name: Clef field report
description: Clef stopped or answered wrongly on your machine. The report is public.
title: "Clef field report: "
body:
  - type: markdown
    attributes:
      value: |
        This report is **public**. Put no path, account name, log or server output in it: only what the fields below ask for. [Field reports](https://github.com/mephistopheles4/the-pact/blob/main/docs/clef.md#field-reports) says more.
  - type: textarea
    id: status
    attributes:
      label: clef status lines
      description: What `node ~/.pact/tools/clef.mjs status` prints.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform key
      description: The `platform:` line, such as linux-arm64-cpu.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: llama.cpp build
      description: The `tag:` line.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS name and version
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU model
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and arch
      description: What `node -p "process.version + ' ' + process.arch"` prints.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      description: "`load` when clef says the server stopped while loading the model; `serve` when it stopped or answered wrongly later."
      options:
        - load
        - serve
        - not sure
    validations:
      required: true
