name: claude-code-review

# Reviews each pull request opened from a branch of this repo by an owner,
# member, collaborator or one of the owner's three agent apps. Authentication
# as in claude.yml: Workload Identity Federation, no API key.
# gate/tests/workflow.test.mjs holds this file to an exact allow-list (spec
# 0006).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) || contains(fromJSON('["mephistos-homunculus[bot]","mephistos-euphorion[bot]","mephistos-wagner[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        with:
          anthropic_federation_rule_id: fdrl_01V8jy6dtvy7Ebf916SRieME
          anthropic_organization_id: 6161ef7b-3383-44f6-bd62-34226aa8c2fc
          anthropic_service_account_id: svac_01QUZe8emXQcqnE1opH93J5e
          allowed_bots: mephistos-homunculus,mephistos-euphorion,mephistos-wagner
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
