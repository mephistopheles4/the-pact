name: claude

# The one way to ask Claude for work: @claude on an issue, a pull request's
# conversation, a review or a diff line. A run can answer, review ("@claude
# review"), commit, push and open a pull request, writing through the Claude
# GitHub app. Nothing runs on a push or on opening a pull request. It
# authenticates to the Claude API through Workload Identity Federation:
# GitHub's OIDC token is traded for a short-lived Anthropic token, so the repo
# holds no API key. The IDs below are identifiers, not credentials.
# allowed_bots and the guard name the owner's three agent apps, which may
# start a run too. claude_args caps each run's model, turns and spend.
# gate/tests/workflow.test.mjs holds this file to an exact allow-list
# (spec 0006 V2).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || contains(fromJSON('["mephistos-homunculus[bot]","mephistos-euphorion[bot]","mephistos-wagner[bot]"]'), github.event.comment.user.login))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || contains(fromJSON('["mephistos-homunculus[bot]","mephistos-euphorion[bot]","mephistos-wagner[bot]"]'), github.event.comment.user.login))) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) || contains(fromJSON('["mephistos-homunculus[bot]","mephistos-euphorion[bot]","mephistos-wagner[bot]"]'), github.event.review.user.login))) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) || contains(fromJSON('["mephistos-homunculus[bot]","mephistos-euphorion[bot]","mephistos-wagner[bot]"]'), github.event.issue.user.login)))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: "claude-${{ github.event.issue.number || github.event.pull_request.number }}"
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        with:
          anthropic_federation_rule_id: fdrl_01V8jy6dtvy7Ebf916SRieME
          anthropic_organization_id: 6161ef7b-3383-44f6-bd62-34226aa8c2fc
          anthropic_service_account_id: svac_01QUZe8emXQcqnE1opH93J5e
          allowed_bots: mephistos-homunculus,mephistos-euphorion,mephistos-wagner
          additional_permissions: |
            actions: read
          claude_args: '--model claude-opus-5-5 --max-turns 60 --max-budget-usd 5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr create:*)"'
