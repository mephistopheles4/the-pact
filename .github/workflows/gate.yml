# The commit-time layer (#153, S11): every pull request and every push to
# main runs the Node install's dry run against an empty home folder, and the
# gate suite's full tier, on the current Node LTS. Full, not fast (#303): the
# install tier holds Linux-only tests that Windows skips, so this job is the
# one place they run before a merge. Made a required check on
# main by the owner's ruleset, with GitHub Actions as its source, so main
# can't hold a pact that fails its own install.
#
# A second job, gate-windows (#351), runs the same two steps on a pinned
# Windows image, under Git Bash so the same lines run unchanged, and fails on
# any skipped test that gate/tests/windows-skips.txt doesn't list. Its dry-run
# step also makes a real Claude folder in the runner's throwaway home, as the
# Linux container's image does, so the installer's real-folder guards run. A
# newer push to a pull request cancels its older run of both jobs; each push
# to main is grouped by its own commit, so no run of this workflow cancels
# another on main. The group is repo-wide, so another workflow naming it could;
# a run on main that was cancelled is re-run before an install or a rollback
# reads it.
# The file is held to an exact allow-list (#351), as codeql.yml is.
#
# Locked down for a public repo: a read-only token, no secrets, no
# pull_request_target, each action pinned to a full commit SHA, and the
# checkout's token not left in the clone for later steps. Nothing is uploaded.
# A pull request runs this file as the pull request has it, so an edit here is
# a change to the gate and takes the security route (S11's stated limit).
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dry run against an empty home folder
        run: |
          mkdir -p "$RUNNER_TEMP/pact-home"
          env -u NODE_OPTIONS node gate/install.mjs --claude-home "$RUNNER_TEMP/pact-home"
      - name: Gate suite, full tier
        run: env -u NODE_OPTIONS node gate/tests/run.mjs full
  gate-windows:
    name: gate-windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dry run against an empty home folder
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pact-home"
          mkdir -p "$HOME/.claude/agents"
          env -u NODE_OPTIONS node gate/install.mjs --claude-home "$RUNNER_TEMP/pact-home"
      - name: Gate suite, full tier
        shell: bash
        run: env -u NODE_OPTIONS node gate/tests/run.mjs full --skips gate/tests/windows-skips.txt
