# Clef end to end (PACT-93, spec 0005 U7): on each platform's CPU build, the
# real server and model are fetched, set up, asked the cases in
# docs/clef-cases.json and removed, by gate/tests/clef-e2e.mjs. The second Linux
# x64 job moves setpriv aside first, so the keeper line runs too. It runs only
# for a change to the tool, the cases, the script, the installer's modules or
# this file, since each run downloads gigabytes; a manual run checks the runners
# by hand. A fetch that fails may be re-run once.
#
# Its concurrency group starts clef-e2e-, never gate-: gate.yml's group is
# repo-wide, so sharing it would cancel gate. A newer push to a pull request
# cancels the older run.
#
# Locked down as gate.yml is: a read-only token, no secret, no
# pull_request_target, each action pinned to gate.yml's commit, no token left in
# the checkout, nothing cached or uploaded. The file is held to an exact
# allow-list by gate/tests/workflow.test.mjs.
name: clef-e2e

on:
  pull_request:
    paths:
      - claude/tools/clef.mjs
      - docs/clef-cases.json
      - gate/tests/clef-e2e.mjs
      - gate/install.mjs
      - gate/install-run.mjs
      - gate/install-core.mjs
      - gate/install-io.mjs
      - gate/paths.mjs
      - gate/harnesses.mjs
      - gate/harness-render.mjs
      - gate/project-core.mjs
      - gate/render-core.mjs
      - gate/seam-a-core.mjs
      - gate/review-core.mjs
      - gate/shared.mjs
      - gate/contained.mjs
      - .github/workflows/clef-e2e.yml
  push:
    branches: [main]
    paths:
      - claude/tools/clef.mjs
      - docs/clef-cases.json
      - gate/tests/clef-e2e.mjs
      - gate/install.mjs
      - gate/install-run.mjs
      - gate/install-core.mjs
      - gate/install-io.mjs
      - gate/paths.mjs
      - gate/harnesses.mjs
      - gate/harness-render.mjs
      - gate/project-core.mjs
      - gate/render-core.mjs
      - gate/seam-a-core.mjs
      - gate/review-core.mjs
      - gate/shared.mjs
      - gate/contained.mjs
      - .github/workflows/clef-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clef-e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  clef-e2e-linux-x64:
    name: clef-e2e-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Clef end to end
        run: env -u NODE_OPTIONS node gate/tests/clef-e2e.mjs "$RUNNER_TEMP/clef-e2e" linux-x64-cpu
  clef-e2e-linux-x64-keeper:
    name: clef-e2e-linux-x64-keeper
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Hide setpriv, so the keeper line runs
        run: sudo mv /usr/bin/setpriv /usr/bin/setpriv.off
      - name: Clef end to end
        run: env -u NODE_OPTIONS node gate/tests/clef-e2e.mjs "$RUNNER_TEMP/clef-e2e" linux-x64-cpu
  clef-e2e-linux-arm64:
    name: clef-e2e-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Clef end to end
        run: env -u NODE_OPTIONS node gate/tests/clef-e2e.mjs "$RUNNER_TEMP/clef-e2e" linux-arm64-cpu
  clef-e2e-windows-x64:
    name: clef-e2e-windows-x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Clef end to end
        shell: bash
        run: env -u NODE_OPTIONS node gate/tests/clef-e2e.mjs "$RUNNER_TEMP/clef-e2e" win32-x64-cpu
  clef-e2e-windows-arm64:
    name: clef-e2e-windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Clef end to end
        shell: bash
        run: env -u NODE_OPTIONS node gate/tests/clef-e2e.mjs "$RUNNER_TEMP/clef-e2e" win32-arm64-cpu
