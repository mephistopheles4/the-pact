<text x="44" y="39.2" font-size="12" font-weight="600" letter-spacing="1.92" fill="#22262b">FIG. 02 — RIGOUR FOLLOWS RISK</text>
<text x="756" y="39.2" font-size="12" letter-spacing="1.92" text-anchor="end" fill="#22262b" fill-opacity="0.7">HOW MUCH CHECKING</text>
<line x1="18" y1="58" x2="782" y2="58" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<rect x="44" y="80" width="712" height="252" fill="#fafaf7" stroke="#22262b" stroke-width="2"/>
<text x="52" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">TIER</text>
<text x="164" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">FITS</text>
<text x="500" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">PLAN</text>
<text x="632" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">BUILD</text>
<line x1="44" y1="134" x2="756" y2="134" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<text x="52" y="160.25" font-size="15" font-weight="600" fill="#22262b">Quick</text>
<text x="164" y="159.2" font-size="12" fill="#22262b">Small, one session, no plan needed</text>
<text x="500" y="159.2" font-size="12" fill="#22262b" fill-opacity="0.7">—</text>
<text x="632" y="159.2" font-size="12" fill="#22262b">planning</text>
<text x="632" y="177.2" font-size="12" fill="#22262b">model, low</text>
<line x1="44" y1="194" x2="756" y2="194" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="52" y="220.25" font-size="15" font-weight="600" fill="#22262b">Standard</text>
<text x="164" y="219.2" font-size="12" fill="#22262b">Needs a short spec</text>
<text x="500" y="219.2" font-size="12" fill="#22262b">planning</text>
<text x="500" y="237.2" font-size="12" fill="#22262b">model, medium</text>
<text x="632" y="219.2" font-size="12" fill="#22262b">executor</text>
<text x="632" y="237.2" font-size="12" fill="#22262b">model, medium</text>
<line x1="44" y1="254" x2="756" y2="254" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="52" y="280.25" font-size="15" font-weight="600" fill="#22262b">Thorough</text>
<text x="164" y="279.2" font-size="12" fill="#22262b">Too big for one session, or risky;</text>
<text x="164" y="297.2" font-size="12" fill="#22262b">cut into tickets, each its own</text>
<text x="164" y="315.2" font-size="12" fill="#22262b">session</text>
<text x="500" y="279.2" font-size="12" fill="#22262b">planning</text>
<text x="500" y="297.2" font-size="12" fill="#22262b">model, high</text>
<text x="632" y="279.2" font-size="12" fill="#22262b">executor</text>
<text x="632" y="297.2" font-size="12" fill="#22262b">model, medium</text>
<line x1="156" y1="81" x2="156" y2="331" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<line x1="492" y1="81" x2="492" y2="331" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<line x1="624" y1="81" x2="624" y2="331" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<rect x="44" y="356" width="712" height="206" fill="#fafaf7" stroke="#b45309" stroke-width="2"/>
<rect x="54" y="353" width="320.55" height="6" fill="#fafaf7"/>
<text x="60" y="360" font-size="11" font-weight="600" letter-spacing="1.76" fill="#b45309">SENSITIVE WORK · WHEN I CHOOSE IT</text>
<text x="60" y="393.4" font-size="14" fill="#22262b">By default, sensitive work is auth, crypto, input validation and data</text>
<text x="60" y="414.4" font-size="14" fill="#22262b">migrations. The sensitive route: thorough, planned and built</text>
<text x="60" y="435.4" font-size="14" fill="#22262b">on the planning model at high, with the security pair on the spec</text>
<text x="60" y="456.4" font-size="14" fill="#22262b">and the diff.</text>
<text x="60" y="482.55" font-size="13" fill="#22262b" fill-opacity="0.8">The agent recommends the route, with its why, in its tier proposal,</text>
<text x="60" y="502.55" font-size="13" fill="#22262b" fill-opacity="0.8">and I take it or not. If I don't, the security pair is offered once</text>
<text x="60" y="522.55" font-size="13" fill="#22262b" fill-opacity="0.8">more at Test on a list match, and a flag I haven't answered stays</text>
<text x="60" y="542.55" font-size="13" fill="#22262b" fill-opacity="0.8">open in the result.</text>
<line x1="44" y1="584" x2="756" y2="584" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<text x="44" y="606.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">PLANS</text>
<text x="44" y="625.55" font-size="13" font-weight="500" fill="#22262b">Planning model</text>
<line x1="281.33" y1="584" x2="281.33" y2="631" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="293.33" y="606.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">BUILDS</text>
<text x="293.33" y="625.55" font-size="13" font-weight="500" fill="#22262b">Executor from standard</text>
<line x1="518.67" y1="584" x2="518.67" y2="631" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="530.67" y="606.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">SENSITIVE ROUTE</text>
<text x="530.67" y="625.55" font-size="13" font-weight="500" fill="#22262b">Planning model, high</text>
