<text x="60" y="486" font-size="11" font-weight="600" letter-spacing="1.76" fill="#b45309">SENSITIVE WORK · MORE CHECKING</text>
<text x="60" y="519.4" font-size="14" fill="#22262b">By default, sensitive work is auth, secrets, crypto, input validation</text>
<text x="60" y="540.4" font-size="14" fill="#22262b">and data migrations: thorough, built on Opus at high.</text>
<text x="60" y="566.55" font-size="13" fill="#22262b" fill-opacity="0.8">The security pair reads its spec and its diff. Small work that touches</text>
<text x="60" y="586.55" font-size="13" fill="#22262b" fill-opacity="0.8">nothing sensitive is quick. Keep one model for a whole session.</text>
