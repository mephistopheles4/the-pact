<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#22262b" stroke-opacity="0.05" stroke-width="1"/></pattern></defs>
<rect width="800" height="652" fill="url(#grid)"/>
<rect x="17" y="17" width="766" height="618" fill="#fafaf7" fill-opacity="0.72" stroke="#22262b" stroke-width="2"/>
<text x="44" y="39.2" font-size="12" font-weight="600" letter-spacing="1.92" fill="#22262b">FIG. 02 — RIGOUR FOLLOWS RISK</text>
<text x="756" y="39.2" font-size="12" letter-spacing="1.92" text-anchor="end" fill="#22262b" fill-opacity="0.7">HOW MUCH CHECKING</text>
<line x1="18" y1="58" x2="782" y2="58" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<rect x="44" y="80" width="712" height="234" fill="#fafaf7" stroke="#22262b" stroke-width="2"/>
<text x="52" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">TIER</text>
<text x="172" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">FITS</text>
<text x="532" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">PLAN</text>
<text x="648" y="102.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">BUILD</text>
<line x1="44" y1="134" x2="756" y2="134" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<text x="52" y="160.25" font-size="15" font-weight="600" fill="#22262b">Quick</text>
<text x="172" y="159.2" font-size="12" fill="#22262b">Small, one session, no plan needed</text>
<text x="532" y="159.2" font-size="12" fill="#22262b" fill-opacity="0.7">—</text>
<text x="648" y="159.2" font-size="12" fill="#22262b">Opus, low</text>
<line x1="44" y1="176" x2="756" y2="176" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="52" y="202.25" font-size="15" font-weight="600" fill="#22262b">Standard</text>
<text x="172" y="201.2" font-size="12" fill="#22262b">Needs a short spec</text>
<text x="532" y="201.2" font-size="12" fill="#22262b">Opus, medium</text>
<text x="648" y="201.2" font-size="12" fill="#22262b">Sonnet,</text>
<text x="648" y="219.2" font-size="12" fill="#22262b">medium</text>
<line x1="44" y1="236" x2="756" y2="236" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="52" y="262.25" font-size="15" font-weight="600" fill="#22262b">Thorough</text>
<text x="172" y="261.2" font-size="12" fill="#22262b">Too big for one session, or risky;</text>
<text x="172" y="279.2" font-size="12" fill="#22262b">cut into tickets, each its own</text>
<text x="172" y="297.2" font-size="12" fill="#22262b">session</text>
<text x="532" y="261.2" font-size="12" fill="#22262b">Opus, high</text>
<text x="648" y="261.2" font-size="12" fill="#22262b">Sonnet,</text>
<text x="648" y="279.2" font-size="12" fill="#22262b">medium</text>
<line x1="164" y1="81" x2="164" y2="313" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<line x1="524" y1="81" x2="524" y2="313" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<line x1="640" y1="81" x2="640" y2="313" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<rect x="44" y="338" width="712" height="205" fill="#fafaf7" stroke="#b45309" stroke-width="2"/>
<rect x="54" y="335" width="320.55" height="6" fill="#fafaf7"/>
<text x="60" y="342" font-size="11" font-weight="600" letter-spacing="1.76" fill="#b45309">SENSITIVE WORK · WHEN I CHOOSE IT</text>
<text x="60" y="375.4" font-size="14" fill="#22262b">By default, sensitive work is auth, secrets, crypto, input validation</text>
<text x="60" y="396.4" font-size="14" fill="#22262b">and data migrations. The sensitive route: thorough, planned and built</text>
<text x="60" y="417.4" font-size="14" fill="#22262b">on Opus at high, with the security pair on the spec and the diff.</text>
<text x="60" y="443.55" font-size="13" fill="#22262b" fill-opacity="0.8">The agent recommends the route, with its why, in its tier proposal,</text>
<text x="60" y="463.55" font-size="13" fill="#22262b" fill-opacity="0.8">and I take it or not. If I don't, the security pair is offered once</text>
<text x="60" y="483.55" font-size="13" fill="#22262b" fill-opacity="0.8">more at Test on a list match, and a flag I haven't answered stays</text>
<text x="60" y="503.55" font-size="13" fill="#22262b" fill-opacity="0.8">open in the result. Small work that touches nothing sensitive is</text>
<text x="60" y="523.55" font-size="13" fill="#22262b" fill-opacity="0.8">quick. Keep one model for a whole session.</text>
<line x1="44" y1="565" x2="756" y2="565" stroke="#22262b" stroke-opacity="0.3" stroke-width="1"/>
<text x="44" y="587.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">PLANS</text>
<text x="44" y="606.55" font-size="13" font-weight="500" fill="#22262b">Opus</text>
<line x1="281.33" y1="565" x2="281.33" y2="612" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="293.33" y="587.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">BUILDS</text>
<text x="293.33" y="606.55" font-size="13" font-weight="500" fill="#22262b">Sonnet · Opus for quick</text>
<line x1="518.67" y1="565" x2="518.67" y2="612" stroke="#22262b" stroke-opacity="0.12" stroke-width="1"/>
<text x="530.67" y="587.35" font-size="11" letter-spacing="1.76" fill="#22262b" fill-opacity="0.7">SENSITIVE ROUTE</text>
<text x="530.67" y="606.55" font-size="13" font-weight="500" fill="#22262b">Opus, high effort</text>
