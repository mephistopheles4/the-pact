<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img">
<rect width="800" height="620" fill="#1a1614"/>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ece5df" stroke-opacity="0.045" stroke-width="1"/></pattern></defs>
<rect width="800" height="620" fill="url(#grid)"/>
<rect x="17" y="17" width="766" height="586" fill="#201b18" fill-opacity="0.72" stroke="#ece5df" stroke-width="2"/>
<text x="44" y="39.2" font-size="12" font-weight="600" letter-spacing="1.92" fill="#ece5df">FIG. 03 — LENSES ADVISE. YOU DECIDE.</text>
<text x="756" y="39.2" font-size="12" letter-spacing="1.92" text-anchor="end" fill="#ece5df" fill-opacity="0.7">THE FAMILIARS</text>
<line x1="18" y1="58" x2="782" y2="58" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<rect x="44" y="80" width="500" height="104" fill="#1a1614" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<rect x="54" y="77" width="273.8" height="6" fill="#1a1614"/>
<text x="60" y="84" font-size="11" font-weight="600" letter-spacing="1.76" fill="#ece5df">SPEC PAIR · MOVE 2, THOROUGH</text>
<text x="56" y="113.2" font-size="12" font-weight="600" fill="#ece5df">executability-lens</text>
<text x="56" y="131.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Would the spec, built as</text>
<text x="56" y="149.2" font-size="12" fill="#ece5df" fill-opacity="0.8">written, run end to end?</text>
<text x="302" y="113.2" font-size="12" font-weight="600" fill="#ece5df">good-enough-lens</text>
<text x="302" y="131.2" font-size="12" fill="#ece5df" fill-opacity="0.8">What could be cut or</text>
<text x="302" y="149.2" font-size="12" fill="#ece5df" fill-opacity="0.8">deferred, and what would</text>
<text x="302" y="167.2" font-size="12" fill="#ece5df" fill-opacity="0.8">it save?</text>
<rect x="44" y="206" width="500" height="86" fill="#1a1614" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<rect x="54" y="203" width="208.35" height="6" fill="#1a1614"/>
<text x="60" y="210" font-size="11" font-weight="600" letter-spacing="1.76" fill="#ece5df">QA PAIR · EVERY BUILD</text>
<text x="56" y="239.2" font-size="12" font-weight="600" fill="#ece5df">behaviour-lens</text>
<text x="56" y="257.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Runs the change. Does it</text>
<text x="56" y="275.2" font-size="12" fill="#ece5df" fill-opacity="0.8">do what was asked?</text>
<text x="302" y="239.2" font-size="12" font-weight="600" fill="#ece5df">integrity-lens</text>
<text x="302" y="257.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Can the tests behind the</text>
<text x="302" y="275.2" font-size="12" fill="#ece5df" fill-opacity="0.8">pass actually fail?</text>
<rect x="44" y="314" width="500" height="86" fill="#1a1614" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<rect x="54" y="311" width="442.1" height="6" fill="#1a1614"/>
<text x="60" y="318" font-size="11" font-weight="600" letter-spacing="1.76" fill="#ece5df">STANDARDS PAIR · MOVE 4, STANDARD AND THOROUGH</text>
<text x="56" y="347.2" font-size="12" font-weight="600" fill="#ece5df">conventions-lens</text>
<text x="56" y="365.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Does the diff keep the</text>
<text x="56" y="383.2" font-size="12" fill="#ece5df" fill-opacity="0.8">repo's written rules?</text>
<text x="302" y="347.2" font-size="12" font-weight="600" fill="#ece5df">reader-lens</text>
<text x="302" y="365.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Can the next reader act</text>
<text x="302" y="383.2" font-size="12" fill="#ece5df" fill-opacity="0.8">on what it says?</text>
<rect x="44" y="422" width="500" height="86" fill="#1a1614" stroke="#ece5df" stroke-width="2"/>
<rect x="54" y="419" width="292.5" height="6" fill="#1a1614"/>
<text x="60" y="426" font-size="11" font-weight="600" letter-spacing="1.76" fill="#ece5df">SECURITY PAIR · SECURITY ROUTE</text>
<text x="56" y="455.2" font-size="12" font-weight="600" fill="#ece5df">adversarial-lens</text>
<text x="56" y="473.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Which attack paths does</text>
<text x="56" y="491.2" font-size="12" fill="#ece5df" fill-opacity="0.8">no control stop?</text>
<text x="302" y="455.2" font-size="12" font-weight="600" fill="#ece5df">data-lens</text>
<text x="302" y="473.2" font-size="12" fill="#ece5df" fill-opacity="0.8">Where can the data leak?</text>
<rect x="44" y="530" width="500" height="50" fill="#1a1614" stroke="#ece5df" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="54" y="527" width="423.4" height="6" fill="#1a1614"/>
<text x="60" y="534" font-size="11" font-weight="600" letter-spacing="1.76" fill="#ece5df">ALONE · MOVES 2 AND 4, STANDARD AND THOROUGH</text>
<text x="56" y="563.2" font-size="12" font-weight="600" fill="#ece5df">unstated-lens</text>
<text x="180" y="563.2" font-size="12" fill="#ece5df" fill-opacity="0.8">What need did nobody write down?</text>
<rect x="572" y="80" width="184" height="92" fill="#1a1614" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<text x="584" y="103.2" font-size="12" fill="#ece5df">Each lens runs</text>
<text x="584" y="121.2" font-size="12" fill="#ece5df">fresh, alone.</text>
<text x="584" y="139.2" font-size="12" fill="#ece5df">Neither sees the</text>
<text x="584" y="157.2" font-size="12" fill="#ece5df">other's report.</text>
<line x1="664" y1="176" x2="664" y2="187" stroke="#ece5df" stroke-width="1.5"/>
<path d="M660 186L668 186L664 192Z" fill="#ece5df"/>
<rect x="572" y="196" width="184" height="128" fill="#1a1614" stroke="#ece5df" stroke-width="2"/>
<text x="584" y="219.2" font-size="12" font-weight="600" fill="#ece5df">Cross script</text>
<text x="584" y="237.2" font-size="12" fill="#ece5df">checks and joins</text>
<text x="584" y="255.2" font-size="12" fill="#ece5df">the pair. Where</text>
<text x="584" y="273.2" font-size="12" fill="#ece5df">both lenses hit</text>
<text x="584" y="291.2" font-size="12" fill="#ece5df">one spot, it</text>
<text x="584" y="309.2" font-size="12" fill="#ece5df">shows first.</text>
<line x1="664" y1="328" x2="664" y2="339" stroke="#ece5df" stroke-width="1.5"/>
<path d="M660 338L668 338L664 344Z" fill="#ece5df"/>
<rect x="572" y="348" width="184" height="74" fill="#1a1614" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<text x="584" y="371.2" font-size="12" fill="#ece5df">Posted on the</text>
<text x="584" y="389.2" font-size="12" fill="#ece5df">issue word for</text>
<text x="584" y="407.2" font-size="12" fill="#ece5df">word.</text>
<line x1="664" y1="426" x2="664" y2="437" stroke="#ece5df" stroke-width="1.5"/>
<path d="M660 436L668 436L664 442Z" fill="#ece5df"/>
<rect x="572" y="446" width="184" height="55" fill="#ece5df" stroke="#ece5df" stroke-width="2"/>
<text x="584" y="468.35" font-size="11" font-weight="600" letter-spacing="1.76" fill="#1a1614">YOU DECIDE</text>
<text x="584" y="486.2" font-size="12" fill="#1a1614">Done, fix, or stop.</text>
</svg>
