<text x="293.33" y="586.55" font-size="13" font-weight="500" fill="#ece5df">Sonnet · Opus for quick</text>
<line x1="518.67" y1="545" x2="518.67" y2="592" stroke="#ece5df" stroke-opacity="0.11" stroke-width="1"/>
<text x="530.67" y="567.35" font-size="11" letter-spacing="1.76" fill="#ece5df" fill-opacity="0.7">SENSITIVE ROUTE</text>
