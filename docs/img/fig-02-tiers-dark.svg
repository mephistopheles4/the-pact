<text x="52" y="262.25" font-size="15" font-weight="600" fill="#ece5df">Thorough</text>
<text x="172" y="261.2" font-size="12" fill="#ece5df">Too big for one session, or risky;</text>
<text x="172" y="279.2" font-size="12" fill="#ece5df">cut into tickets, each its own</text>
<text x="172" y="297.2" font-size="12" fill="#ece5df">session</text>
<text x="532" y="261.2" font-size="12" fill="#ece5df">Opus, high</text>
<text x="648" y="261.2" font-size="12" fill="#ece5df">Sonnet,</text>
<text x="648" y="279.2" font-size="12" fill="#ece5df">medium</text>
