<line x1="44" y1="134" x2="756" y2="134" stroke="#ece5df" stroke-opacity="0.28" stroke-width="1"/>
<text x="52" y="160.25" font-size="15" font-weight="600" fill="#ece5df">Quick</text>
<text x="172" y="159.2" font-size="12" fill="#ece5df">Small, one session, no plan needed</text>
<text x="532" y="159.2" font-size="12" fill="#ece5df" fill-opacity="0.7">—</text>
<text x="648" y="159.2" font-size="12" fill="#ece5df">Opus, low</text>
<line x1="44" y1="176" x2="756" y2="176" stroke="#ece5df" stroke-opacity="0.11" stroke-width="1"/>
<text x="52" y="202.25" font-size="15" font-weight="600" fill="#ece5df">Standard</text>
<text x="172" y="201.2" font-size="12" fill="#ece5df">Needs a short spec</text>
<text x="532" y="201.2" font-size="12" fill="#ece5df">Opus, medium</text>
<text x="648" y="201.2" font-size="12" fill="#ece5df">Sonnet,</text>
<text x="648" y="219.2" font-size="12" fill="#ece5df">medium</text>
