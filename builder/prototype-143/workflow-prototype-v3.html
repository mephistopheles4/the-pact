<!doctype html>
<!-- PROTOTYPE v3 for #143, THROWAWAY. Never for main. Hand-written, no generator.
     Revision 1: a drag-and-drop node canvas. Stages are the work's own lifecycle;
     condition nodes sit between a stage and its agents and switch on and off;
     the moves sit beside the work as practices, never on the canvas.
     Styled with the Aviation design system's deck theme, tokens carried inline
     as in builder/scriptorium.html. It saves, downloads and copies nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Workflow builder v3 (throwaway)</title>
<style>
/* Aviation design system, deck theme: the tokens, carried inline. Light is the
   default; dark is opt-in through the toggle. */
:root {
  --av-rule-hair: 1px; --av-rule-thin: 1.5px; --av-rule-bold: 2px;
  --av-s1: 6px; --av-s2: 12px; --av-s3: 24px; --av-s4: 36px;
  --av-t-micro: 0.6875rem; --av-t-annot: 0.8125rem; --av-t-body: 0.9375rem; --av-t-lead: 1.125rem;
  --av-track-label: 0.16em;
  --av-grid-size: 24px; --av-grid-major-every: 5;
  --av-paper: #fafaf7; --av-ink: #22262b; --av-caution: #b45309; --av-normal: #15803d;
  --av-ink-80: rgb(34 38 43 / 0.8); --av-ink-70: rgb(34 38 43 / 0.7); --av-ink-55: rgb(34 38 43 / 0.55);
  --av-ink-30: rgb(34 38 43 / 0.3); --av-ink-12: rgb(34 38 43 / 0.12);
  --av-grid-minor: rgb(34 38 43 / 0.035); --av-grid-major: rgb(34 38 43 / 0.085);
  --av-surface: rgb(250 250 247 / 0.72); --av-ground: #efefe9; --av-paper-tech: #eaf0f6;
  --av-font: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media screen {
  [data-aviation-scheme="dark"] {
    --av-paper: #1a1614; --av-ink: #ece5df; --av-caution: #d98a3c; --av-normal: #4fae6d;
    --av-ink-80: rgb(236 229 223 / 0.80); --av-ink-70: rgb(236 229 223 / 0.70); --av-ink-55: rgb(236 229 223 / 0.55);
    --av-ink-30: rgb(236 229 223 / 0.28); --av-ink-12: rgb(236 229 223 / 0.11);
    --av-grid-minor: rgb(236 229 223 / 0.032); --av-grid-major: rgb(236 229 223 / 0.075);
    --av-surface: rgb(32 27 24 / 0.72); --av-ground: #100e0d; --av-paper-tech: #141a20;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { box-sizing: border-box; padding: var(--av-s1); background: var(--av-ground); color: var(--av-ink); font-family: var(--av-font); font-size: var(--av-t-body); line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.av-label { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 500; color: var(--av-ink-70); }
.av-annot { font-size: var(--av-t-annot); line-height: 1.5; color: var(--av-ink-70); margin: 0; }
.av-tool-stamp { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 600; white-space: nowrap; }
.av-tool-stamp--caution { color: var(--av-caution); }
.av-tool-stamp--normal { color: var(--av-normal); }
.av-tool-chip { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 500; padding: 5px var(--av-s2); border: var(--av-rule-hair) solid var(--av-ink); background: transparent; cursor: pointer; white-space: nowrap; }
.av-tool-chip:hover { color: var(--av-caution); border-color: var(--av-caution); }
.av-tool-chip--on { background: var(--av-ink); color: var(--av-paper); }
.av-tool-chip--on:hover { color: var(--av-paper); border-color: var(--av-ink); }
.av-tool-chip--ghost { border-color: var(--av-ink-30); color: var(--av-ink-80); }
:focus-visible { outline: var(--av-rule-bold) solid var(--av-caution); outline-offset: 2px; }

/* SHELL: the sheet, head, library | canvas | panel. */
/* As groundtrack does it: the graph is the drafting surface, paper with the grid coming through raw;
   the chrome panels are sheets laid on it, surface fill and a soft shadow (groundtrack's local exception
   to the no-shadow rule, a literal so it stays a shadow in the dark scheme). Green and amber marks on
   the ground fill fall below 4.5:1; on paper and surface they clear it. */
.sheet { --pf-panel-shadow: 0 2px 6px rgb(34 38 43 / 0.16); height: 100%; display: grid; grid-template-rows: auto auto 1fr; border: var(--av-rule-bold) solid var(--av-ink); background-color: var(--av-paper); overflow: hidden; }
@media screen { [data-aviation-scheme="dark"] .sheet { --pf-panel-shadow: 0 2px 6px rgb(0 0 0 / 0.45); } }
.head, .bar, .side, #panel, #wtable { background: var(--av-surface); box-shadow: var(--pf-panel-shadow); position: relative; z-index: 2; }
.head { display: flex; align-items: center; gap: var(--av-s2); flex-wrap: wrap; padding: var(--av-s1) var(--av-s3); border-bottom: var(--av-rule-hair) solid var(--av-ink); z-index: 3; }
.head h1 { font-size: var(--av-t-lead); margin: 0; font-weight: 600; }
.head .sp { flex: 1; }
.bar { display: flex; align-items: center; gap: var(--av-s1); flex-wrap: wrap; padding: var(--av-s1) var(--av-s3); border-bottom: var(--av-rule-hair) solid var(--av-ink-12); }
.bar .note { font-size: var(--av-t-micro); color: var(--av-ink-70); }
.cols { display: grid; grid-template-columns: 250px 1fr 7px var(--panel-w, 330px); min-height: 0; }
.resizer { cursor: col-resize; background: var(--av-surface); position: relative; z-index: 2; border-left: var(--av-rule-hair) solid var(--av-ink-30); touch-action: none; transition: background .15s; }
.resizer:hover, .resizer.on { background: var(--av-caution); }
@media (max-width: 1000px) { .cols { grid-template-columns: 200px 1fr; } .resizer { display: none; } #panel { grid-column: 1 / -1; max-height: 40vh; } }
.side { overflow: auto; padding: var(--av-s2); border-right: var(--av-rule-hair) solid var(--av-ink-30); display: flex; flex-direction: column; gap: var(--av-s1); }
#panel { overflow: auto; }

/* LIBRARY */
.lib { display: flex; align-items: center; gap: var(--av-s1); width: 100%; text-align: left; padding: var(--av-s1); border: var(--av-rule-hair) solid var(--av-ink-30); background: var(--av-paper); cursor: grab; transition: transform .12s, border-color .12s; }
.lib:hover { border-color: var(--av-ink); transform: translateX(2px); }
.lib .ic { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: var(--av-rule-hair) solid currentColor; font-size: 12px; }
.lib .ic.cond { transform: rotate(45deg) scale(.8); }
.lib .ic.cond span { transform: rotate(-45deg); }
.lib b { font-size: var(--av-t-annot); font-weight: 600; display: block; }
.lib small { font-size: var(--av-t-micro); color: var(--av-ink-70); display: block; }
.practices { margin-top: var(--av-s2); padding-top: var(--av-s2); border-top: var(--av-rule-hair) dashed var(--av-ink-30); }
.practice { padding: var(--av-s1) 0; border-bottom: var(--av-rule-hair) solid var(--av-ink-12); }
.practice b { font-size: var(--av-t-annot); font-weight: 600; }
.practice p { margin: 0; font-size: var(--av-t-micro); color: var(--av-ink-70); }

/* CANVAS: the drafting grid, panned and zoomed. */
#canvas { position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--av-paper);
  background-image:
    linear-gradient(to right, var(--av-grid-major) 1px, transparent 1px), linear-gradient(to bottom, var(--av-grid-major) 1px, transparent 1px),
    linear-gradient(to right, var(--av-grid-minor) 1px, transparent 1px), linear-gradient(to bottom, var(--av-grid-minor) 1px, transparent 1px); }
#canvas.panning { cursor: grabbing; }
#canvas.dropping { box-shadow: inset 0 0 0 var(--av-rule-bold) var(--av-caution); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
#edges path.e { fill: none; stroke: var(--av-ink-55); stroke-width: 1.5; pointer-events: stroke; cursor: pointer; }
#edges path.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
#edges path.e.next { stroke: var(--av-ink); stroke-width: 2; }
#edges path.e.flow { stroke: var(--av-normal); stroke-dasharray: 6 6; animation: flow 0.9s linear infinite; }
#edges path.e.off { stroke: var(--av-ink-30); stroke-dasharray: 2 5; }
#edges path.e.loop { stroke: var(--av-caution); stroke-dasharray: 8 5; animation: flow 1.6s linear infinite; }
#edges path.e.sel { stroke-width: 3.5; }
#edges path.temp { fill: none; stroke: var(--av-caution); stroke-width: 2; stroke-dasharray: 4 4; }
#edges text { font-family: var(--av-font); font-size: 11px; fill: var(--av-caution); pointer-events: all; cursor: pointer; paint-order: stroke; stroke: var(--av-paper); stroke-width: 4px; }
#edges circle.pulse { fill: var(--av-normal); filter: drop-shadow(0 0 4px var(--av-normal)); }
@keyframes flow { to { stroke-dashoffset: -24; } }
.zoom { position: absolute; left: var(--av-s2); bottom: var(--av-s2); display: flex; gap: 2px; background: var(--av-paper); border: var(--av-rule-hair) solid var(--av-ink-30); }
.zoom button { border: 0; background: none; padding: 4px 9px; cursor: pointer; font-size: var(--av-t-annot); }
.zoom span { padding: 4px 6px; font-size: var(--av-t-micro); min-width: 44px; text-align: center; align-self: center; }
#toast { position: absolute; left: 50%; bottom: var(--av-s2); transform: translateX(-50%); background: var(--av-ink); color: var(--av-paper); padding: 5px 12px; font-size: var(--av-t-annot); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }

/* NODES */
.node { position: absolute; background: var(--av-paper); border: var(--av-rule-thin) solid var(--av-ink); cursor: move; user-select: none; animation: pop .22s ease-out; transition: box-shadow .15s, opacity .2s; }
.node:hover { box-shadow: 3px 3px 0 var(--av-ink-12); }
.node.sel { box-shadow: 0 0 0 var(--av-rule-bold) var(--av-caution); }
.node.dragging { box-shadow: 6px 6px 0 var(--av-ink-12); z-index: 5; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.node.stage { width: 200px; padding: var(--av-s1) var(--av-s2); border-width: var(--av-rule-bold); }
.node.stage .kind { display: flex; justify-content: space-between; }
.node.stage h3 { margin: 0; font-size: var(--av-t-body); font-weight: 600; }
.node.stage p { margin: 0; font-size: var(--av-t-micro); color: var(--av-ink-70); }
.node.stage.skipped { opacity: .45; }
.node.stage.active { box-shadow: 0 0 0 4px var(--av-normal); }
.node.cond { width: 168px; padding: var(--av-s1) var(--av-s1) var(--av-s1) var(--av-s2); border-style: dashed; }
.node.cond .row1 { display: flex; align-items: center; gap: var(--av-s1); }
.node.cond .q { flex: 1; font-size: var(--av-t-micro); line-height: 1.3; }
.node.cond .q b { display: block; font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink-70); font-weight: 500; }
.node.loop { border-color: var(--av-caution); }
.node.loop .q b { color: var(--av-caution); }
.node.cond.pass { border-color: var(--av-normal); border-style: solid; }
.node.cond.off { opacity: .55; }
.node.cond.def::after { content: "default"; position: absolute; top: -9px; right: 6px; background: var(--av-paper); padding: 0 4px; font-size: 10px; letter-spacing: var(--av-track-label); text-transform: uppercase; color: var(--av-caution); }
.node.cond .pair { font-size: 10px; color: var(--av-ink-70); margin-top: 2px; }
.node.agent { width: 168px; padding: 4px var(--av-s2); font-size: var(--av-t-annot); border-width: var(--av-rule-hair); }
.node.agent.own { font-style: italic; }
.node.agent.fires { border-color: var(--av-normal); color: var(--av-normal); }
.node.agent.fired { animation: fire .7s ease-out; }
@keyframes fire { 0% { box-shadow: 0 0 0 0 var(--av-normal); } 100% { box-shadow: 0 0 0 14px transparent; } }
.sw { position: relative; width: 30px; height: 16px; flex: none; border: var(--av-rule-hair) solid var(--av-ink); background: transparent; cursor: pointer; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--av-ink-55); transition: left .18s, background .18s; }
.sw[aria-checked="true"] { background: var(--av-normal); border-color: var(--av-normal); }
.sw[aria-checked="true"]::after { left: 16px; background: var(--av-paper); }
.port { position: absolute; width: 12px; height: 12px; border: var(--av-rule-thin) solid var(--av-ink); background: var(--av-paper); border-radius: 50%; cursor: crosshair; transition: transform .12s, background .12s; }
.port:hover, .port.hot { transform: scale(1.5); background: var(--av-caution); border-color: var(--av-caution); }
.port.in { left: -7px; top: calc(50% - 6px); }
.port.back { left: -7px; top: calc(50% - 6px); border-color: var(--av-caution); }
.port.out { right: -7px; top: calc(50% - 6px); }
.port.down { left: calc(50% - 6px); bottom: -7px; }
.port.top { left: calc(50% - 6px); top: -7px; }

/* WORKFLOW TABLE: the part the canvas edits, live under it. */
.centre { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
#wtable { max-height: 40vh; overflow: auto; border-top: var(--av-rule-hair) solid var(--av-ink); padding: var(--av-s1) var(--av-s2) var(--av-s2); }
#wtable .whead { display: flex; gap: var(--av-s2); align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
#wtable h2 { font-size: var(--av-t-body); margin: 0; font-weight: 600; }
table.wf { width: 100%; border-collapse: collapse; font-size: var(--av-t-micro); }
table.wf th { text-align: left; font-weight: 500; text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink-70); border-bottom: var(--av-rule-thin) solid var(--av-ink); padding: 3px 6px; }
table.wf td { padding: 4px 6px; border-bottom: var(--av-rule-hair) solid var(--av-ink-12); vertical-align: top; }
table.wf tr { cursor: pointer; transition: background .15s; }
table.wf tbody tr:hover { background: var(--av-ink-12); }
table.wf tr.sel { box-shadow: inset 3px 0 0 var(--av-caution); }
table.wf .cur { background: rgb(21 128 61 / 0.09); }
table.wf th.cur { color: var(--av-normal); }
table.wf .fire { color: var(--av-normal); font-weight: 600; }
table.wf .idle { color: var(--av-ink-55); }
table.wf .loop { color: var(--av-caution); }
table.wf td b { font-weight: 600; font-size: var(--av-t-annot); }
.flash { animation: flash .6s ease-out; }
@keyframes flash { from { background: rgb(180 83 9 / 0.18); } to { background: transparent; } }

/* PANEL */
.tabs { display: flex; border-bottom: var(--av-rule-hair) solid var(--av-ink-30); position: sticky; top: 0; background: var(--av-paper); z-index: 1; }
.tab { flex: 1; font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); padding: var(--av-s1); border: 0; border-bottom: var(--av-rule-bold) solid transparent; background: none; color: var(--av-ink-70); cursor: pointer; }
.tab--on { color: var(--av-ink); border-bottom-color: var(--av-ink); font-weight: 600; }
.pbody { padding: var(--av-s2); display: flex; flex-direction: column; gap: var(--av-s1); }
.pbody h2 { font-size: var(--av-t-body); margin: var(--av-s1) 0 0; font-weight: 600; }
.pbody label { display: flex; flex-direction: column; gap: 2px; }
.pbody input, .pbody select, .pbody textarea { width: 100%; padding: 4px 6px; border: var(--av-rule-hair) solid var(--av-ink-30); background: var(--av-paper); }
.warn { border-left: var(--av-rule-bold) solid var(--av-caution); padding: 4px 8px; font-size: var(--av-t-annot); color: var(--av-caution); background: var(--av-ink-12); }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: var(--av-track-label); padding: 0 4px; border: var(--av-rule-hair) solid currentColor; white-space: nowrap; }
.tag.t262 { color: var(--av-normal); } .tag.tgraph { color: var(--av-caution); } .tag.tfix { color: var(--av-ink-70); }
table.tiers { width: 100%; border-collapse: collapse; font-size: var(--av-t-micro); }
table.tiers td { padding: 3px 2px; border-bottom: var(--av-rule-hair) solid var(--av-ink-12); vertical-align: top; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: var(--av-rule-hair) solid var(--av-ink-30); padding: 0 6px; font-size: var(--av-t-annot); }
.chip button { border: 0; background: none; cursor: pointer; padding: 0 0 0 4px; }
pre.out { margin: 0; white-space: pre-wrap; font-size: var(--av-t-micro); line-height: 1.55; overflow-wrap: anywhere; }

/* TOUR */
.tour { position: fixed; z-index: 30; max-width: 320px; background: var(--av-paper); border: var(--av-rule-bold) solid var(--av-ink); padding: var(--av-s2); box-shadow: 6px 6px 0 var(--av-ink-12); font-size: var(--av-t-annot); animation: pop .2s ease-out; }
.tour p { margin: var(--av-s1) 0; }
.tourhl { outline: 3px solid var(--av-caution) !important; outline-offset: 2px; }
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <h1>Workflow builder</h1>
    <span class="av-tool-stamp av-tool-stamp--caution">Throwaway prototype v3 · emits nothing</span>
    <span class="sp"></span>
    <span class="tag t262">#262 builds</span><span class="tag tgraph">workflow part · new</span><span class="tag tfix">fixed</span>
    <button class="av-tool-chip av-tool-chip--ghost" id="darkBtn" aria-pressed="false">Dark</button>
    <button class="av-tool-chip av-tool-chip--ghost" id="resetBtn">Reset</button>
    <button class="av-tool-chip av-tool-chip--on" id="tourBtn">Take the tour</button>
  </div>
  <div class="bar" id="sim"></div>
  <div class="cols">
    <div class="side" id="library"></div>
    <div class="centre">
    <div id="canvas">
      <div id="world"><svg id="edges"></svg></div>
      <div class="zoom"><button id="zOut" aria-label="zoom out">−</button><span id="zPct">100%</span><button id="zIn" aria-label="zoom in">+</button><button id="zFit">Fit</button><button id="zArr" title="lay the graph out again">Arrange</button></div>
      <div id="toast" role="status"></div>
    </div>
    <div id="wtable"></div>
    </div>
    <div class="resizer" id="pResize" role="separator" aria-orientation="vertical" aria-label="resize the panel" tabindex="0"></div>
    <div id="panel"></div>
  </div>
</div>
<script>
'use strict';
// ---- Data, from claude/CLAUDE.md on main and the owner's 2026-10-09 software preset.
const PRACTICES = [
  ['Sense the work', 'Claude nudges when a bug has no reproduction yet, or a target nobody can know gets a plan instead of an experiment.'],
  ['Think before doing', 'Claude nudges when the intent is still forming: a quick prototype finds it.'],
  ['Checkpoint the seams', 'Claude nudges when something hard to undo has no checkpoint before it.'],
  ['Stay the owner', 'Claude nudges when a pass rests on no check that could have failed.'],
];
const LENSES = ['behaviour-lens','integrity-lens','executability-lens','unstated-lens','reader-lens','conventions-lens','adversarial-lens','data-lens','good-enough-lens'];
const CONDS = {
  always:    { label: 'Every build', test: w => true },
  spec:      { label: 'Standard and above', test: w => w.tier !== 'quick' },
  thorough:  { label: 'Thorough only', test: w => w.tier === 'thorough' },
  sensitive: { label: 'Sensitive work', test: w => w.sensitive },
  custom:    { label: 'In your own words', test: w => false },
};
const PAIRS = [['behaviour-lens','integrity-lens','the QA pair'],['adversarial-lens','data-lens','the security pair'],
  ['unstated-lens','good-enough-lens','the spec pair'],['conventions-lens','reader-lens','the standards pair']];
const DEFAULT_PAIRS = ['the QA pair','the security pair']; // the defaults sentence names these two

let S, uid = 0;
const nid = p => p + (++uid);
function fresh(){
  uid = 0;
  const st = {}, nodes = [], edges = [];
  const STG = [['Plan','Kind, size and risk; a tier proposed.','plan'],['Design','The spec: intent, unhappy paths, decisions.','plan'],['Build','Test-first; tests and gates decide.','build'],
    ['Test','Each claim checked against the ask.','build'],['Deploy','I accept and ship; nothing promotes itself.','owner'],['Maintain','What escaped, and what to change.','plan']];
  const X = [40, 300, 660, 920, 1330, 1590];
  STG.forEach(([name, text, model], i) => { const n = { id: nid('s'), kind: 'stage', name, text, model, x: X[i], y: 60, skipOn: name === 'Design' ? 'quick' : '' }; st[name] = n; nodes.push(n); });
  for (let i = 0; i < STG.length - 1; i++) edges.push({ id: nid('e'), from: st[STG[i][0]].id, fp: 'out', to: st[STG[i+1][0]].id, tp: 'in', when: '', on: true });
  const cond = (stage, c, y, agents, def) => {
    const n = { id: nid('c'), kind: 'cond', cond: c, custom: '', on: true, def: !!def, x: stage.x, y };
    nodes.push(n); edges.push({ id: nid('e'), from: stage.id, fp: 'down', to: n.id });
    agents.forEach((a, k) => { const g = { id: nid('a'), kind: 'agent', name: a, own: false, x: stage.x + 200, y: y + k * 40 - (agents.length > 1 ? 4 : -8) };
      nodes.push(g); edges.push({ id: nid('e'), from: n.id, fp: 'out', to: g.id }); });
  };
  const D = st.Design, T = st.Test;
  cond(D, 'spec', 200, ['unstated-lens','good-enough-lens']);
  cond(D, 'spec', 290, ['executability-lens']);
  cond(D, 'sensitive', 380, ['adversarial-lens','data-lens'], true);
  cond(T, 'always', 200, ['behaviour-lens','integrity-lens'], true);
  cond(T, 'spec', 310, ['conventions-lens','reader-lens']);

// ---- The workflow table: the part that joins the tier table and the lens table.
const TIERS = ['quick','standard','thorough'];
const MODELS = { plan: 'the tier\'s plan model', build: 'the tier\'s build model', owner: 'mine: no model' };
function stagesInOrder(){
  const stages = S.nodes.filter(n => n.kind === 'stage');
  const nextOf = s => defaultExits(s)[0];

  let cur = stages.filter(s => !S.edges.some(e => e.to === s.id && isDefault(e))).sort((a, b) => a.x - b.x)[0];
  while (cur && !seen.has(cur.id)) { seen.add(cur.id); out.push(cur); const nx = nextOf(cur); cur = nx && N(nx.to); }
  return out.concat(stages.filter(s => !seen.has(s.id)).sort((a, b) => a.x - b.x)); // unwired stages trail, in canvas order
}

// ---- Canvas: edges
function portPos(n, port){
  const el = nodeEl(n.id); const w = el ? el.offsetWidth : 160, h = el ? el.offsetHeight : 40;
  switch (port) {
    case 'in': return { x: n.x, y: n.y + h / 2, nx: -1, ny: 0 };
    case 'out': return { x: n.x + w, y: n.y + h / 2, nx: 1, ny: 0 };
    case 'down': return { x: n.x + w / 2, y: n.y + h, nx: 0, ny: 1 };
    case 'top': return { x: n.x + w / 2, y: n.y, nx: 0, ny: -1 };
    case 'back': return { x: n.x, y: n.y + h / 2, nx: -1, ny: 0 };
  }
}
function curve(a, b, lift){
  if (lift) return `M${a.x},${a.y} C${a.x},${a.y - lift} ${b.x},${b.y - lift} ${b.x},${b.y}`;
  const dist = Math.hypot(b.x - a.x, b.y - a.y), d = Math.max(40, Math.min(dist / 2.2, 70 + dist * 0.1));
  return `M${a.x},${a.y} C${a.x + a.nx * d},${a.y + a.ny * d} ${b.x + b.nx * d},${b.y + b.ny * d} ${b.x},${b.y}`;
}
function edgeGeom(e){
  const a = N(e.from), b = N(e.to); if (!a || !b) return null;
  const tp = e.tp || (b.kind === 'cond' ? 'top' : 'in');
  if (isLoop(e)) return { d: curve(portPos(a, e.fp), portPos(b, tp)), kind: 'loop' };
  const kind = a.kind === 'stage' && b.kind === 'stage' ? 'next' : a.kind === 'stage' ? 'check' : 'fire';
  return { d: curve(portPos(a, e.fp), portPos(b, tp)), kind };
}
function renderEdges(){
  const svg = $('edges');

    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--av-caution)"/></marker></defs>`;
  S.edges.forEach(e => {
    const g = edgeGeom(e); if (!g) return;
    let cls = g.kind;
    if (isLoop(e)) cls += e.on === false ? ' off' : '';
    else if (g.kind === 'check' || g.kind === 'fire') { const c = g.kind === 'check' ? N(e.to) : N(e.from); cls += passes(c) ? ' flow' : c.on ? '' : ' off'; }
    const sel = S.sel && S.sel.edge === e.id ? ' sel' : '';
    h += `<path class="hit" data-e="${e.id}" d="${g.d}"/><path class="e ${cls}${sel}" id="p_${e.id}" d="${g.d}" marker-end="url(#${g.kind === 'loop' ? 'ahc' : 'ah'})"/>`;
  });
  svg.innerHTML = h;
  S.edges.filter(isLoop).forEach(e => {
    const p = $('p_' + e.id); if (!p) return; const m = p.getPointAtLength(p.getTotalLength() / 2);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', m.x); t.setAttribute('y', m.y - 6); t.setAttribute('text-anchor', 'middle'); t.dataset.e = e.id;

}

// ---- Pointer: pan, drag nodes, draw links
const canvas = $('canvas');
function applyView(){ const v = S.view; $('world').style.transform = `translate(${v.x}px,${v.y}px) scale(${v.k})`;
  canvas.style.backgroundPosition = `${v.x}px ${v.y}px`; canvas.style.backgroundSize = `${120*v.k}px ${120*v.k}px, ${120*v.k}px ${120*v.k}px, ${24*v.k}px ${24*v.k}px, ${24*v.k}px ${24*v.k}px`;
  $('zPct').textContent = Math.round(v.k * 100) + '%'; }
function toWorld(cx, cy){ const r = canvas.getBoundingClientRect(), v = S.view; return { x: (cx - r.left - v.x) / v.k, y: (cy - r.top - v.y) / v.k }; }

    t.setAttribute('d', curve(a, { x: b.x, y: b.y, nx: 0, ny: 0 }));

function sideAt(n, p){

function connect(a, fp, b, tp){

  if (!ok) { toast('A stage links to a stage or a condition; a condition fires agents.'); renderEdges(); return; }
  if (S.edges.some(e => e.from === a.id && e.to === b.id)) { renderEdges(); return; }
  if (b.kind === 'cond' || b.kind === 'agent') S.edges = S.edges.filter(e => !(e.to === b.id && N(e.from)?.kind === a.kind)); // one parent each
  const e = { id: nid('e'), from: a.id, fp, to: b.id };

  if (a.kind === 'stage' && b.kind === 'stage') { e.on = true; e.when = defaultExits(a).length ? 'your words' : ''; }
  S.edges.push(e); S.sel = { edge: e.id }; S.tab = 'inspect';
  renderNodes(); renderPanel();

canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY); }, { passive: false });
function zoomAt(f, cx, cy){ const r = canvas.getBoundingClientRect(); cx = cx ?? r.left + r.width / 2; cy = cy ?? r.top + r.height / 2;
  const v = S.view, k = Math.min(1.8, Math.max(0.3, v.k * f)), wx = (cx - r.left - v.x) / v.k, wy = (cy - r.top - v.y) / v.k;
  v.k = k; v.x = cx - r.left - wx * k; v.y = cy - r.top - wy * k; applyView(); }
function fit(){ if (!S.nodes.length) return; const r = canvas.getBoundingClientRect();
  const xs = S.nodes.map(n => n.x), ys = S.nodes.map(n => n.y), x0 = Math.min(...xs) - 20, y0 = Math.min(...ys) - 230, x1 = Math.max(...xs) + 240, y1 = Math.max(...ys) + 80;
  const k = Math.min(1.2, Math.max(0.3, Math.min(r.width / (x1 - x0), r.height / (y1 - y0))));
  S.view = { k, x: -x0 * k + (r.width - (x1 - x0) * k) / 2, y: -y0 * k }; applyView(); }
// Stages left to right in spine order; under each, its conditions with their agents to the right, then its loops.
function arrange(animate = true){
  let x = 40;
  const placed = new Set(), moves = [];
  const put = (n, nx, ny) => { moves.push([n, nx, ny]); placed.add(n.id); };
  stagesInOrder().forEach(st => {
    put(st, x, 60); let y = 200;
    const cs = conds(st), ls = loopsUnder(st);
    cs.forEach(c => { put(c, x, y); const ag = children(c); ag.forEach((a, k) => put(a, x + 200, y + k * 40 - (ag.length > 1 ? 4 : -8))); y += Math.max(1, ag.length) * 40 + 30; });
    ls.forEach(l => { put(l, x, y); y += 90; });
    x += cs.length ? 420 : 260;
  });
  let fx = 40;
  S.nodes.filter(n => !placed.has(n.id)).forEach(n => { put(n, fx, -140); fx += 200; }); // unwired nodes wait in a row above
  if (!animate) { moves.forEach(([n, nx, ny]) => { n.x = nx; n.y = ny; }); return; }
  const from = moves.map(([n]) => [n.x, n.y]), t0 = performance.now();
  const step = t => { const f = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - f, 3);
    moves.forEach(([n, nx, ny], i) => { n.x = Math.round(from[i][0] + (nx - from[i][0]) * e); n.y = Math.round(from[i][1] + (ny - from[i][1]) * e);
      const el = nodeEl(n.id); if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; } });
    renderEdges(); if (f < 1) requestAnimationFrame(step); else fit(); };
  requestAnimationFrame(step);
}
$('zArr').onclick = () => arrange(true);
$('zIn').onclick = () => zoomAt(1.15); $('zOut').onclick = () => zoomAt(1 / 1.15); $('zFit').onclick = fit;
canvas.addEventListener('dragover', e => { e.preventDefault(); canvas.classList.add('dropping'); });
canvas.addEventListener('dragleave', () => canvas.classList.remove('dropping'));
canvas.addEventListener('drop', e => { e.preventDefault(); canvas.classList.remove('dropping');
  let d; try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  if (d && d.type) addNode(d.type, d.val, toWorld(e.clientX, e.clientY)); });
document.addEventListener('keydown', e => { if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel && S.sel.edge && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) delSel(); });
function delSel(){
  if (!S.sel) return;
  if (S.sel.edge) S.edges = S.edges.filter(e => e.id !== S.sel.edge);
  if (S.sel.node) { const id = S.sel.node; S.nodes = S.nodes.filter(n => n.id !== id); S.edges = S.edges.filter(e => e.from !== id && e.to !== id); }
  S.sel = null; renderNodes(); renderPanel();
}

// ---- Run it through: a pulse travels the spine and out to what fires.
let running = false;
function pulse(pathId, ms){ return new Promise(res => {
  const p = $('p_' + pathId); if (!p) return res(); const L = p.getTotalLength();
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('r', 6); c.setAttribute('class', 'pulse'); $('edges').appendChild(c);
  const t0 = performance.now();
  const step = t => { const f = Math.min(1, (t - t0) / ms), q = p.getPointAtLength(L * f); c.setAttribute('cx', q.x); c.setAttribute('cy', q.y);
    if (f < 1) requestAnimationFrame(step); else { c.remove(); res(); } };
  requestAnimationFrame(step); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function run(){
  if (running) return; running = true;
  const stages = S.nodes.filter(n => n.kind === 'stage');
  const nextOf = s => defaultExits(s)[0];
  let cur = stages.find(s => !S.edges.some(e => e.to === s.id && isDefault(e))) || stages[0];
  const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id); const el = nodeEl(cur.id); el?.classList.add('active');
    if (!skipped(cur)) await Promise.all(conds(cur).map(async c => {
      const e = S.edges.find(e => e.from === cur.id && e.to === c.id); await pulse(e.id, 380);
      if (!passes(c)) return;
      await Promise.all(children(c).map(async a => { const ea = S.edges.find(x => x.from === c.id && x.to === a.id); await pulse(ea.id, 320);
        const ae = nodeEl(a.id); if (ae) { ae.classList.remove('fired'); void ae.offsetWidth; ae.classList.add('fired'); } }));
    }));
    else await wait(250);
    el?.classList.remove('active');
    const nx = nextOf(cur); if (!nx) break; await pulse(nx.id, 420); cur = N(nx.to);
  }
  running = false;
}

// ---- Right-hand panel

  if (S.tab === 'inspect') h += inspectHTML();
  if (S.tab === 'tiers') h += `<h2>Tiers <span class="tag t262">#262 builds</span></h2><p class="av-annot">How much checking. The Design stage is skipped at a tier with no plan.</p><table class="tiers">` +
    S.tiers.map((t,i) => `<tr><td><b>${t.name}</b><input data-t="${i}" data-f="fits" value="${esc(t.fits)}"></td><td>plan${msel(i,'plan',t.plan,true)}</td><td>build${msel(i,'build',t.build)}</td></tr>`).join('') + `</table>`;
  if (S.tab === 'sensitive') h += `<h2>Sensitive work <span class="tag t262">#262 builds</span></h2><p class="av-annot">Runs thorough, built on Opus at high. Lights every "Sensitive work" condition.</p><div class="chips">` +
    S.sensitive.map((s,i) => `<span class="chip">${esc(s)}<button data-rs="${i}" aria-label="remove ${esc(s)}">×</button></span>`).join('') +
    `</div><label><span class="av-label">Add</span><input id="sAdd" placeholder="e.g. payments, then Enter"></label>`;
  if (S.tab === 'preview') h += `<h2>What the graph compiles to</h2><pre class="out">${esc(compiled())}</pre><h2>What compiles to nothing</h2><pre class="out">${esc(nothing())}</pre>`;
  const warns = warnings(); if (warns.length) h += `<div class="warn"><b>Open question, not a rule</b><br>${warns.map(esc).join('<br>')}</div>`;

  $('panel').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderPanel(); });

function msel(i, f, v, none){ const o = (none ? ['none'] : []).concat(['Opus, low','Opus, medium','Opus, high','Sonnet, medium','Sonnet, high']);
  return `<select data-t="${i}" data-f="${f}">${o.map(x => `<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`; }

function bindPanel(){
  const on = (id, ev, fn) => { const e = $(id); if (e) e[ev] = fn; };
  const n = S.sel && S.sel.node && N(S.sel.node), e = S.sel && S.sel.edge && S.edges.find(x => x.id === S.sel.edge);
  const soft = () => { renderNodes(); }; // panel keeps focus; only the canvas redraws
  on('iDel', 'onclick', delSel);
  if (n) {
    on('iName', 'oninput', ev => { n.name = ev.target.value; soft(); });
    on('iText', 'oninput', ev => { n.text = ev.target.value; soft(); });
    on('iSkip', 'onchange', ev => { n.skipOn = ev.target.value; refreshState(); });
    on('iModel', 'onchange', ev => { n.model = ev.target.value; renderTable(); });
    on('iCond', 'onchange', ev => { n.cond = ev.target.value; renderNodes(); renderPanel(); });
    on('iCustom', 'oninput', ev => { n.custom = ev.target.value; soft(); });
    on('iOn', 'onclick', () => { n.on = !n.on; renderNodes(); renderPanel(); });
  }
  if (e) { on('iEWhen', 'onchange', ev => { e.when = ev.target.value.trim(); renderNodes(); renderPanel(); });
    on('iEWhen', 'oninput', ev => { e.when = ev.target.value.trim(); renderEdges(); renderTable(); });
    on('iEOn', 'onclick', () => { e.on = e.on === false; refreshState(); renderPanel(); }); }
  $('panel').querySelectorAll('[data-t]').forEach(x => x.onchange = x.oninput = ev => { S.tiers[+x.dataset.t][x.dataset.f] = ev.target.value; renderTable(); });
  $('panel').querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { S.sensitive.splice(+b.dataset.rs, 1); renderPanel(); });
  on('sAdd', 'onkeydown', ev => { if (ev.key === 'Enter' && ev.target.value.trim()) { S.sensitive.push(ev.target.value.trim()); renderPanel(); $('sAdd').focus(); } });
}
function warnings(){
  const out = [];
  S.nodes.filter(n => n.kind === 'stage').forEach(st => { const d = defaultExits(st);
    if (d.length > 1) out.push(`${st.name} has ${d.length} default ways on (${d.map(e => N(e.to).name).join(', ')}): give all but one a condition.`); });
  { const seen = new Set(); let cur = S.nodes.find(n => n.kind === 'stage' && !S.edges.some(e => e.to === n.id && isDefault(e)));
    if (!cur && S.nodes.some(n => n.kind === 'stage' && defaultExits(n).length)) out.push('The default ways on go round in a circle: one of them needs a condition, or the work never ends.');
    while (cur && !seen.has(cur.id)) { seen.add(cur.id); const nx = defaultExits(cur)[0]; cur = nx && N(nx.to); if (cur && seen.has(cur.id)) out.push('The default ways on go round in a circle: one of them needs a condition, or the work never ends.'); } }
  S.nodes.filter(n => n.kind === 'cond' && n.def && !n.on).forEach(c => { const st = parentStage(c);
    out.push(`A default is off at ${st ? st.name : '?'}: ${children(c).map(a => a.name).join(' and ')}. The defaults sentence still says it runs. Should the builder refuse this?`); });
  S.nodes.filter(n => n.kind === 'cond').forEach(c => { const names = children(c).map(a => a.name);
    PAIRS.filter(x => DEFAULT_PAIRS.includes(x[2])).forEach(([x, y, l]) => { if (names.includes(x) !== names.includes(y)) out.push(`Half of ${l} on one condition at ${parentStage(c)?.name || '?'}: a crossing would be lost.`); }); });
  return out;
}

// ---- Compile preview: #262's three parts, the lens table derived from the graph.
const listJoin = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
function lensRows(){
  const rows = new Map();
  S.nodes.filter(n => n.kind === 'cond' && n.on).forEach(c => {
    const st = parentStage(c), names = children(c).map(a => a.name).sort(); if (!st || !names.length) return;
    const k = names.join('+') + '|' + c.cond + '|' + c.custom.trim().toLowerCase();
    if (!rows.has(k)) rows.set(k, { names, cond: condText(c), stages: [] });
    rows.get(k).stages.push(st.name);
  });
  return [...rows.values()];
}
function compiled(){
  return '── workflow (new: joins the two tables below) ──\n' + workflowPart() + '\n\n── tiers ──\n| Tier | Fits | Plan | Build |\n| --- | --- | --- | --- |\n' + S.tiers.map(t => `| ${t.name} | ${t.fits} | ${t.plan} | ${t.build} |`).join('\n') +
    '\n\n── sensitive ──\nSensitive work gets more checking. By default, sensitive work is ' + listJoin(S.sensitive) + ': thorough, built on Opus at high.\n\n' +
    '── lenses (from the graph) ──\n| Lens | Where it fits |\n| --- | --- |\n' +
    lensRows().map(r => { const p = pairLabel(r.names); return `| ${r.names.map(n => '`' + n + '`').join(', ')}${PAIRS.some(x => x[2] === p) ? ' (' + p + ')' : ''} | ${r.cond}, at ${listJoin(r.stages)} |`; }).join('\n') +
    '\n\n── fixed, outside the lens part ──\nThe defaults. The QA pair reads every result. The security pair reads sensitive work. Only I skip a default. The rest are your judgment, or my call.';
}
function nothing(){
  return 'The workflow part is new: no open part takes it today, so it, like the stages and loops it carries, is a renderer and gate change.\n\n' +
    '• Where nodes sit on the canvas, and the order of agents under a condition.\n' +
    '• Conditions switched off: they drop out of every table.\n' +
    '• Overlap: the lens table\'s "where it fits" repeats the workflow\'s agents column; the tier table\'s Plan and Build columns are what the workflow\'s tier columns look up.\n' +
    '• My practices: the pact already says them; they never compile from here.';
}

// ---- Tour
const TOUR = [
  ['library', 'The nodes library. Drag a stage, a condition or an agent onto the canvas, or click one to drop it in the middle.'],
  ['canvas', 'The canvas holds the work\'s own lifecycle: Plan, Design, Build, Test, Deploy, Maintain. Drag nodes about; drag the grid to pan; scroll to zoom.'],
  ['canvas', 'Wire by dragging from a port: a stage\'s right port to the next stage (or back to an earlier one, which makes a loop), a condition. Any side of a stage links to any other stage. A stage has one default way on; every other link out of it carries a condition, which is how work goes back, or skips ahead.'],
  ['canvas', 'A condition sits between a stage and its agents and switches on and off. Agents on one condition fire together: that is all a pair is.'],
  ['wtable', 'The workflow table, the new part. One row per stage: what each tier sets there, the agents that fire and when, and any loop back. It joins the tier table and the lens table; the canvas is its editor.'],
  ['sim', 'Describe a piece of work and press Run it through: a pulse travels the stages and lights the agents that would fire.'],
  ['panel', 'Edit whatever you select here. Tiers and sensitive work are #262\'s parts; Compiles to shows the lens table the graph makes, and what has nowhere to go.'],
  ['library', 'My practices sit beside the work, below the library: no order, no arrows, never on the canvas. They show where Claude would nudge.'],
];
let tourEl = null;
function tour(i){
  document.querySelectorAll('.tourhl').forEach(e => e.classList.remove('tourhl')); if (tourEl) tourEl.remove(); tourEl = null;
  if (i < 0 || i >= TOUR.length) return;
  const [id, text] = TOUR[i], t = $(id); t.classList.add('tourhl'); const r = t.getBoundingClientRect();
  tourEl = document.createElement('div'); tourEl.className = 'tour'; tourEl.setAttribute('role', 'dialog');
  tourEl.innerHTML = `<span class="av-label">${i + 1} of ${TOUR.length}</span><p>${text}</p><div style="display:flex;gap:6px"><button class="av-tool-chip av-tool-chip--ghost" id="tB">Back</button><button class="av-tool-chip av-tool-chip--on" id="tN">${i === TOUR.length - 1 ? 'Done' : 'Next'}</button><button class="av-tool-chip av-tool-chip--ghost" id="tS">Skip</button></div>`;
  document.body.appendChild(tourEl);
  const left = Math.min(innerWidth - tourEl.offsetWidth - 12, Math.max(12, r.left + 16)), top = Math.min(innerHeight - tourEl.offsetHeight - 12, Math.max(12, r.top + 16));
  tourEl.style.left = left + 'px'; tourEl.style.top = top + 'px';
  $('tB').onclick = () => tour(i - 1); $('tN').onclick = () => tour(i + 1); $('tS').onclick = () => tour(-1); $('tN').focus();
}
$('tourBtn').onclick = () => tour(0);

// Panel width: drag the bar, or arrow keys on it; remembered per viewer when storage allows.
