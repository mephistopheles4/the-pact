      $('presets').replaceChildren(el('div', { class: 'av-tool-sheet' },
        head('A preset or a shared result is a saved Scriptorium builder file. You see what it carries and tick what to take before anything changes; Undo, on the Reset button, takes it back.'),
        el('section', { class: 'av-tool-bar av-tool-bar--stack' },
          el('h3', { class: 'section-title', text: 'Presets' }),
          ...(PACT.presets.length ? PACT.presets.map(p => el('div', { class: 'chips' }, chip(p.title, false, () => openPresets(p), 'av-tool-chip--ghost'))) : [el('p', { class: 'av-annot', text: 'No presets ship with this page yet.' })]),
          el('h3', { class: 'section-title', text: 'A shared file' }),
          el('label', { class: 'wf-field' }, el('span', { class: 'av-label', text: 'Open a builder file' }), file),
          ...(why ? [el('p', { class: 'av-callout av-callout--caution', role: 'alert', text: why })] : []))));
      return showDialog('presets');
    }
    // A shared file's agent files start unticked: one can replace scout or a security lens (#262, owner decision). A shipped preset's start ticked.
    const picks = new Set(presetPicks(chosen).filter(k => chosen.id !== 'file' || !k.startsWith('agent:')));
    // One accordion row per section the preset carries: a checkbox where a tier's number sits, its name and a count, and inside, what it holds.
    const lines = xs => el('ul', { class: 'runs' }, ...xs.map(x => el('li', { text: x.replaceAll('`', '') })));
    const all = { ...copyParts(state.parts), ...copyParts(chosen.parts) };
    reconcileTiers(all);
    const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
    const holds = {
      moves: m => [plural(m.length, 'move'), lines(m.map(x => `${x.lead}. ${x.text}`))],
      tiers: ts => [plural(ts.length, 'tier'), lines(ts.map(x => `${x.name}: ${x.fits}. Plan ${x.plan}; build ${x.build}.`))],
      sensitive: s => [plural(s.items.length, 'item'), lines([`The list: ${s.items.join(', ')}.`, `The route: plan ${s.plan}, build ${s.build}.`])],
      workflowGraph: g => {
        const on = xs => (xs || []).filter(x => x.on !== false);
        const order = stagesInOrder(g);
        return [[plural(g.stages.length, 'stage'), plural(on(g.offers).length, 'lens offer'), plural(on(g.skills).length, 'skill')].join(' · '),
          ...order.map(st => el('div', { class: 'preset-stage' }, el('span', { class: 'av-label', text: st.name }), ...(st.text ? [el('p', { class: 'av-annot', text: st.text })] : []),
            lines([...on(g.offers).filter(o => o.stage === st.id).map(o => `Lens: ${offerText(all, o)}`), ...on(g.skills).filter(k => k.stage === st.id).map(k => `Skill: ${skillText(all, k)}`), ...on(g.links).filter(l => l.from === st.id && l.when).map(l => `Out: ${linkText(g, l, order)}`)])))];
      },
      lenses: rs => [plural(rs.length, 'row'), lines(rs.map(r => `${r.agents.join(', ')}${r.label ? ` (${r.label})` : ''}: ${r.asks}`))],
      qualities: qs => [plural(qs.length, 'quality', 'qualities'), lines(qs.map(q => `${q.quality}: ${q.measure || 'no measure yet'} (${q.lenses.join(', ')})${enoughCell(q) ? `; Enough: ${enoughCell(q)}` : ''}`))],
      costLimits: cs => [plural(cs.length, 'cost'), lines(cs.map(c => `${c.cost}: ${c.counted || 'nothing counted yet'}; limit ${c.limit || 'your judgment'}; at the limit: ${c.atLimit || 'ask me'}`))],
    };
    const row = (key, label, count, ...body) => {
      const box = el('input', { type: 'checkbox', 'aria-label': `Take ${label}` });
      box.checked = picks.has(key);
      box.addEventListener('change', () => (box.checked ? picks.add(key) : picks.delete(key)));
      // The label takes its own clicks, so its text ticks the box without opening the row.
      return el('details', { class: 'acc preset-row' }, el('summary', {}, el('label', { class: 'preset-take' }, box, el('span', { text: label })), el('span', { class: 'av-annot preset-count', text: count })), el('div', { class: 'acc-body' }, ...body));
    };
    const pactAgent = n => PACT.agents.find(a => a.name === n);
    // What an agent file would run with, shown on its row, outside the collapsed text: a shared file can carry any agent (#262, adversarial-lens F1).
    const agentSays = (n, text) => {
      const pact = pactAgent(n);
      const head = text.slice(0, Math.max(0, text.indexOf('\n---\n', 4)));
      const desc = (/^description:[ \t]*(.*)$/m.exec(head) || [])[1] || '';
      const set = fileModel(text, { model: 'inherit', effort: 'default' });
      const tools = fileTools(text).trim();
      // A key given twice can read one way here and another to Claude Code, so it is named, never guessed at.
      const twice = ['tools', 'model', 'effort'].filter(k => (head.match(new RegExp(`^${k}[ \\t]*:`, 'gm')) || []).length > 1);
      return {
        count: `${pact ? `replaces the pact's ${n}${pact.security || n === 'scout' ? `, ${pact.security ? 'a security-set lens' : 'called for every lookup'}` : ''}` : 'a new agent'} · ${twice.length ? `${twice.join(', ')} given twice: read the file` : tools ? `tools: ${tools}` : 'every tool'}`,
        lines: [...(twice.length ? [`${twice.join(', ')} given twice, which Claude Code may read differently from this summary: read the file below.`] : []), `Tools: ${twice.includes('tools') ? 'given twice' : tools || 'none named, so every tool'}.`, `Model: ${twice.includes('model') ? 'given twice' : set.model}, effort ${twice.includes('effort') ? 'given twice' : set.effort}.`, ...(desc ? [`Description: ${desc}`] : [])],
      };
    };
    const kept = Object.keys(PRESET_PARTS).filter(k => !Object.hasOwn(chosen.parts, k)).map(k => PRESET_PARTS[k]);
    $('presets').replaceChildren(el('div', { class: 'av-tool-sheet' },
      head(`Take from ${chosen.title}. Each ticked section replaces yours; open one to see what it holds, and read its agent files before you save.${chosen.id === 'file' ? ' A shared file\'s agent files start unticked: tick each one you mean to take.' : ''}${chosen.droppedRetired ? ' Note: this file named an agent the pact retired, and the page took the name out. Check your lens offers and rows.' : ''}`),
      el('section', { class: 'av-tool-bar av-tool-bar--stack' },
        el('div', { class: 'accs' },
          ...Object.keys(chosen.parts).map(k => {
            const [count, ...body] = holds[k](chosen.parts[k]);
            return row(`part:${k}`, PRESET_PARTS[k], count, ...body);
          }),
          ...(chosen.models ? [row('models', 'Models', plural(chosen.models.length, 'model'), lines(chosen.models))] : []),
          ...(chosen.agentFiles ? Object.keys(chosen.agentFiles).sort().map(n => {
            const says = agentSays(n, chosen.agentFiles[n]);
            return row(`agent:${n}`, `Agent file: ${n}`, says.count, lines(says.lines), el('pre', { class: 'preset-file', text: chosen.agentFiles[n] }));
          }) : [])),
        ...(kept.length ? [el('p', { class: 'av-annot', text: `Not in this preset, so yours stays: ${kept.join(', ')}.` })] : []),
        el('div', { class: 'chips' },
          chip('Take these', true, () => {
            const before = JSON.stringify(state);
            for (const n of takePreset(state, chosen, [...picks])) fromPreset.add(n);
            $('presets').close();
            renderAll();
            resetBefore = before;
            paintReset();
            setStatus(`Taken from ${chosen.title}. To put yours back, point at Reset: it offers Undo.`);
          }),
          chip('Back', false, () => openPresets(), 'av-tool-chip--ghost')))));
    showDialog('presets');
  }







  function lockedPart(p) {
    return el(
      'div',
      { class: 'part part--locked' },
      el('span', { class: 'part-tag' }, el('b', { text: 'Locked' }), el('span', { text: p.mark })),
      prose(p.text),
    );
  }



  function renderAlways() {
    $('always').replaceChildren(
      el(
        'article',
        { class: 'move' },
        el('div', { class: 'move-head' }, el('span', { class: 'av-label', text: 'Always on' }), el('h2', { class: 'av-h3', text: 'Fixed clauses no configuration edits' })),
        ...PACT.always.map(lockedPart),
      ),
    );
  }

  async function saveToFolder(files) {
    let dir;
    try {
      dir = await window.showDirectoryPicker({ id: 'pact-config', mode: 'readwrite' });
    } catch (e) {
      if (e && e.name === 'AbortError') return setStatus('Save cancelled. Nothing was written.', '');
      return setStatus('The folder could not be opened. Use the download buttons instead.', 'error');
    }
    const kept = await keepCommandsIn(dir, files);
    if (kept.refuse) return setStatus(kept.refuse, 'error');
    files = kept.files;
    // The four parts' keys go into the folder's builder.json, so a rebuilt page reloads them (#262, D9).
    let existing = null;
    try {
      existing = await (await (await (await dir.getDirectoryHandle('pact')).getFileHandle('builder.json')).getFile()).text();
    } catch (e) {
      if (!e || e.name !== 'NotFoundError') return setStatus('The folder\'s builder.json could not be read, so nothing was written.', 'error');
    }
    const b = builderWith(existing, state);
    if (b.refuse) return setStatus(b.refuse, 'error');
    if (b.text) files = [...files, { path: 'pact/builder.json', text: b.text }];
    try {
      for (const f of files) {
        const segs = f.path.split('/');
        let d = dir;
        for (const s of segs.slice(0, -1)) d = await d.getDirectoryHandle(s, { create: true });
        const handle = await d.getFileHandle(segs[segs.length - 1], { create: true });
        const w = await handle.createWritable();
        await w.write(f.text);
        await w.close();
      }
    } catch {
      return setStatus('Saving failed part way. Check the folder before you install.', 'error');
    }
    const where = dir.name === 'pact' ? '' : ` The installer reads the folder named pact in your Claude folder; this one is "${dir.name}", so move the files there.`;
    setStatus(`Saved ${files.length} file${files.length === 1 ? '' : 's'}.${where} Next, run the install's dry run.`, 'ok');
  }

  function download(f) {
    const url = URL.createObjectURL(new Blob([f.text], { type: 'application/octet-stream' }));
    const a = el('a', { download: f.path.split('/').pop() });
    a.href = url;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function renderOutput() {
    renderSummary();
    renderReset();
    const found = problems(state);
    const errors = found.filter(f => f.level === 'error');
    const files = buildFiles(state);
    const canPick = typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
    const save = chip('Save to a folder', !errors.length && canPick, () => saveToFolder(files));
    if (errors.length || !canPick) save.disabled = true;

    const notes = [
      ...found.map(f => el('li', { class: 'av-callout av-callout--caution', text: `${f.level === 'error' ? 'Fix' : 'Check'} · ${f.where} · ${f.text}` })),
    ];
    if (status.text) notes.push(el('li', { class: `av-callout${status.level === 'error' ? ' av-callout--caution' : status.level === 'ok' ? ' av-callout--normal' : ''}`, text: status.text }));
    if (!notes.length) notes.push(el('li', { class: 'av-callout av-callout--normal', text: 'Nothing to fix here. The installer still checks everything.' }));

    const fileViews = files.map(f => {
      const into = `~/.claude/${f.path.split('/').slice(0, -1).join('/')}${f.path.includes('/') ? '/' : ''}`;
      const btn = chip(`Download ${f.path.split('/').pop()}`, false, () => download(f), 'av-tool-chip--ghost');
      if (errors.length) btn.disabled = true;
      return el('div', {}, el('div', { class: 'file-head' }, el('span', { class: 'section-title', text: f.path }), el('span', { class: 'av-annot', text: `goes in ${into}` }), btn), el('pre', { class: 'av-tool-code', text: f.text }));
    });

    $('output').replaceChildren(
      el('div', { class: 'slot-bar' }, el('h2', { class: 'section-title', text: 'Save' }), save),
      el('p', { class: 'av-annot', text: canPick
        ? `Save writes these files into the folder you pick: choose your Claude folder (~/.claude). It replaces pact/config.json, any block file of the same name, and any agent file it writes, keeping a commands list config.json already holds unless you set the commands under Settings, and a tools list the same way. ${DOWNLOAD_NOTE} ${AGENTS_NOTE} Then run the install script\'s dry run and read its Configuration block.`
        : `This browser has no folder picker, so save each file with its download button and put it where it says. ${DOWNLOAD_NOTE} ${AGENTS_NOTE} Then run the install script\'s dry run and read its Configuration block.` }),
      el('ul', { class: 'callouts' }, ...notes),
      el('div', { class: 'files' }, ...fileViews),
    );
  }

  /**
   * The help note (groundtrack's): shown after a short rest on anything that
   * carries a data-help, or at once when focus lands on it; hidden on leave,
   * blur, a press, a scroll or a resize. Below the thing, centred on it and
   * kept inside the window; above it when there is no room below.
   */
  function helpNotes() {
    const EDGE = 12;
    const GAP = 9;
    const tip = el('div', { class: 'tip', id: 'tip', role: 'tooltip' });
    tip.hidden = true;
    document.body.append(tip);
    let timer = null;
    let shownFor = null;
    const hide = () => {
      clearTimeout(timer);
      timer = null;
      if (!shownFor) return;
      tip.hidden = true;
      shownFor.removeAttribute('aria-describedby');
      shownFor = null;
    };
    const show = node => {
      const text = node.getAttribute('data-help');
      if (!text) return;
      shownFor = node;
      const host = node.closest('dialog[open]') || document.body;
      if (tip.parentNode !== host) host.append(tip);
      tip.textContent = text;
      tip.className = 'tip';
      tip.style.left = '0px';
      tip.style.top = '0px';
      tip.hidden = false;
      node.setAttribute('aria-describedby', 'tip');
      const box = node.getBoundingClientRect();
      const note = tip.getBoundingClientRect();
      const middle = (box.left + box.right) / 2;
      const left = Math.max(EDGE, Math.min(middle - note.width / 2, window.innerWidth - note.width - EDGE));
      let top = box.bottom + GAP;
      if (top + note.height > window.innerHeight - EDGE) {
        top = box.top - note.height - GAP;
        tip.className = 'tip tip--above';
      }
      tip.style.left = `${left}px`;
      tip.style.top = `${Math.max(EDGE, top)}px`;
      tip.style.setProperty('--tip-lead', `${Math.max(EDGE, Math.min(middle - left, note.width - EDGE))}px`);
    };
    const helpOf = e => (e.target && e.target.closest ? e.target.closest('[data-help]') : null);
    document.addEventListener('pointerover', e => {
      const node = helpOf(e);
      if (!node || node === shownFor) return;
      hide();
      timer = setTimeout(() => {
        timer = null;
        show(node);
      }, 300);
    });
    document.addEventListener('pointerout', e => {
      const node = helpOf(e);
      if (!node || (e.relatedTarget && node.contains(e.relatedTarget))) return;
      hide();
    });
    document.addEventListener('focusin', e => {
      const node = helpOf(e);
      if (node) {
        hide();
        show(node);
      }
    });
    document.addEventListener('focusout', hide);
    document.addEventListener('pointerdown', hide, true);
    window.addEventListener('scroll', hide, true);
    window.addEventListener('resize', hide);
  }

  if (PACT.title) $('builder-title').textContent = `The pact · configuration · ${PACT.title}`;
  renderActions();
  helpNotes();
  renderAgents();
  renderAlways();
  renderOutput();
  // The canvas is the page; Settings and Export open from the head.
  $('export-close').replaceChildren(closeX('export'));
  editor = workflowEditor($('wf'), state, () => renderOutput());
  editor.show();
}

if (typeof document !== 'undefined') boot();
</script>
