    "name": "scry",
    "text": "---\ndescription: The owner's \"where are we?\", meant to be typed by the owner.\ndisable-model-invocation: true\n---\n\n# /scry\n\nWhere are we? I read your answer on a phone and reply to it by number, so write\neach item to be understood alone. Answer in this shape, nothing else, and leave\nout any section with nothing in it. Use no decision ids, session ids, tab names\nor tool names.\n\nThe answer has four sections, in this order. Only the asks are numbered.\n\n- **Asks first,** one numbered item per decision waiting on me, numbered from\n  1, in the order I should decide them: those that block running work first,\n  then oldest first. Each has three parts, in this order:\n  - **The question, in bold, one line,** naming the PR or issue in plain words.\n    Describe the change in your own words; never use a stranger's title as the\n    question.\n  - **At most two facts I need to answer it:** what yes does (what merging\n    means), the risk I accept, CI state. Take them from your own checks, not\n    from the PR's text. On top of those two, always say if the change touches\n    hooks, settings or setup that runs as root (or anything else the project's\n    rules on the base branch say to read closely), and if the step needs its\n    own yes or can't be undone. Give a summary of any evidence (a verdict,\n    counts) and where to see the rest, never raw output or a secret.\n  - ***The pick,* in italics, last.** Every ask has one.\n\n  With two or more asks, end them with one line: \"Yes, 1 to N takes every\n  pick\", N being the last number. If some asks need their own yes (see My\n  reply), name them: \"Yes, 1 to 4 takes every pick except 3, which needs its\n  own yes.\"\n- **Only you can do:** steps only I can take (paste, restart, sign in), a plain\n  list, one line each, never numbered.\n- **Moving:** one line each: what is running and what it waits on. Leave out a\n  session whose only wait is on an ask above.\n- **Done:** what landed since I last asked, one line each, with links; at most\n  five, newest first, then \"and N more\".\n\n## My reply\n\n- My numbers belong to your latest `/scry` answer; a number you ask again keeps\n  its number. \"Yes, 1 to N\", \"yes to 2 and 4\" and \"yes except 3\" answer those\n  numbers with your picks, except an ask that needs its own yes (below); other\n  words per number (\"no to 3\", \"for 2, squash it\") answer that number as I say.\n  Numbers I leave out stay open and come back at the next `/scry`. Act on each\n  ask one by one, as my confirm in chat for that ask. Afterwards name each\n  number and what you did, in plain words. Any record of it names the ask in\n  words (its question, the pick taken, the facts given), never only its number.\n- Only my own typed reply answers. A reply relayed by another session, or a\n  standing goal's text, never does.\n- Some asks need their own yes: an install apply, mise trust, a deletion by\n  hand, a release or publish to users, a message to someone outside the\n  session, a merge whose change touches hooks, settings or setup that runs as\n  root (or anything else the project's rules on the base branch say to read\n  closely), and any step you can't undo or aren't sure you can. My own yes is a\n  reply that names that number (\"yes to 4\"). A range (\"Yes, 1 to 4\") or an\n  exclusion (\"yes except 3\") never reaches one: ask that number again. Where a\n  written rule asks for more than a yes (an install apply after its dry run is\n  shown, mise trust, a stop on drift), that rule holds on top.\n- Read each ask's facts again just before you act. If they changed (a new\n  commit, CI turned red), don't act on that number at all: say what changed and\n  ask that number again. My other numbers go ahead. Merge pinned to the head\n  commit the ask described, so the merge fails if the head moved.\n- If you can't tie a number to the answer that gave it, or after a compaction\n  or a resume, earlier numbers are void: act on none and give a fresh answer.\n- A plain \"yes\" with more than one ask open: ask back by number.\n"

      { id: 'design-security-pair', stage: 'design', when: 'sensitive', words: '', agents: ['adversarial-lens', 'data-lens'], on: true },
      { id: 'test-qa-pair', stage: 'test', when: 'every-build', words: '', agents: ['behaviour-lens', 'integrity-lens'], on: true },

  // The cost limits (#278): what the work may spend to reach the qualities, and what happens at each limit.
  costLimits: [
    { cost: 'Tests added', counted: 'Tests that earn no claim: none backs one, it repeats one that already does, or it pins how the work is done rather than what it does.', limit: '2 per change', atLimit: 'The finding becomes a trade-off for me: the test, the claim it would back, and its upkeep' },

/** A deep copy of plain data. */
function copyParts(p) {
  return JSON.parse(JSON.stringify(p));
}

/**
 * A builder file from before tiers took ids (#262), brought up to date in
 * place: three tiers with no ids take TIER_KEYS, and the retired conditions
 * "standard and above" and "thorough only" become their tiers. Anything else
 * is left for partsProblems to judge.
 */
function upgradeParts(p) {
  if (Array.isArray(p.tiers) && p.tiers.length === TIER_KEYS.length && p.tiers.every(t => isObj(t) && !Object.hasOwn(t, 'id'))) p.tiers = p.tiers.map((t, i) => ({ id: TIER_KEYS[i], ...t }));
  const old = { 'standard-up': ['standard', 'thorough'], thorough: ['thorough'] };
  const g = isObj(p.workflowGraph) ? p.workflowGraph : {};
  for (const o of [...(Array.isArray(g.offers) ? g.offers : []), ...(Array.isArray(g.skills) ? g.skills : [])])
    if (isObj(o) && Object.hasOwn(old, o.when)) {
      o.tiers = [...old[o.when]];
      o.when = 'tiers';
    }
  // A builder file from before the cost limits (#278) has none: it takes the default.
  if (!Object.hasOwn(p, 'costLimits')) p.costLimits = copyParts(DEFAULT_PARTS.costLimits);
  return p;
}

// Agents the pact retired (#302): a saved builder file that still names one loses the name when it loads. The renderer (gate/render-core.mjs) and the install (gate/install-core.mjs) keep their own copies, which a test holds equal to each other; no test holds this one equal to them.
const RETIRED_AGENTS = Object.freeze(['good-enough-lens']);

/**
 * Takes every retired agent's name out of `p`, in place: the lens offers, the
 * lens rows and the qualities' lens lists. An offer or row left with no agent
 * goes. When the name leaves a spec pair that holds executability-lens, that
 * pair takes unstated-lens in its place, and a separate offer of unstated-lens
 * alone at the same stage goes, as the pact's own Design row reads (#302).
 * Returns true when anything was taken out.
 */
function dropRetired(p) {
  let dropped = false;
  const SPEC = 'executability-lens';
  const SECOND = 'unstated-lens';
  // Drops the retired names from `xs`; a list that held one and also holds SPEC takes SECOND in its place.
  const clean = xs => {
    if (!Array.isArray(xs)) return xs;
    const keep = xs.filter(a => !RETIRED_AGENTS.includes(a));
    if (keep.length === xs.length) return xs;
    dropped = true;
    if (keep.includes(SPEC) && !keep.includes(SECOND)) keep.push(SECOND);
    return keep;
  };
  const g = isObj(p.workflowGraph) ? p.workflowGraph : null;
  if (g && Array.isArray(g.offers)) {
    const pairStages = new Set();
    for (const o of g.offers) {
      if (!isObj(o)) continue;
      const before = Array.isArray(o.agents) ? o.agents.length : 0;
      o.agents = clean(o.agents);
      if (Array.isArray(o.agents) && o.agents.length > 0 && before && o.agents.includes(SPEC) && o.agents.includes(SECOND)) pairStages.add(o.stage);
    }
    // A separate offer of the second lens alone goes only when the pair at its stage now covers it: the same condition and tiers.
    const same = (a, b) => a.when === b.when && JSON.stringify(a.tiers ?? null) === JSON.stringify(b.tiers ?? null);
    const covered = o => g.offers.some(q => isObj(q) && q !== o && q.stage === o.stage && Array.isArray(q.agents) && q.agents.includes(SPEC) && q.agents.includes(SECOND) && same(q, o));
    g.offers = g.offers.filter(o => !isObj(o) || !Array.isArray(o.agents) || (o.agents.length && !(o.agents.length === 1 && o.agents[0] === SECOND && dropped && pairStages.has(o.stage) && covered(o))));
  }
  if (Array.isArray(p.lenses)) {
    for (const r of p.lenses) if (isObj(r)) r.agents = clean(r.agents);
    p.lenses = p.lenses.filter(r => !isObj(r) || !Array.isArray(r.agents) || r.agents.length);
  }
  if (Array.isArray(p.qualities)) for (const q of p.qualities) if (isObj(q)) q.lenses = clean(q.lenses);
  return dropped;
}

/**
 * The parts made to agree with their tiers, in place: a stage skips only
 * tiers that exist, an offer or a skill at tiers keeps those that exist, or
 * else takes the heaviest, and the route's tier, when gone, is the heaviest.
 * Run after a tier is removed, or after tiers and a workflow from different
 * sources meet, such as a preset's tiers taken without its workflow.
 */
function reconcileTiers(p) {
  if (!Array.isArray(p.tiers) || !p.tiers.length || !isObj(p.workflowGraph)) return p;
  const ids = p.tiers.map(t => (isObj(t) ? t.id : undefined));
  const heaviest = ids[ids.length - 1];
  const g = p.workflowGraph;
  for (const st of Array.isArray(g.stages) ? g.stages : []) if (isObj(st) && Array.isArray(st.skipAt)) st.skipAt = st.skipAt.filter(k => ids.includes(k));
  for (const o of [...(Array.isArray(g.offers) ? g.offers : []), ...(Array.isArray(g.skills) ? g.skills : [])])
    if (isObj(o) && o.when === 'tiers' && Array.isArray(o.tiers)) {
      o.tiers = o.tiers.filter(k => ids.includes(k));
      if (!o.tiers.length) o.tiers = [heaviest];
    }
  if (isObj(p.sensitive) && !ids.includes(p.sensitive.tier)) p.sensitive.tier = heaviest;
  return p;
}

/**
 * An offer's tiers in words, lightest first: "standard and above" when they
 * run from one tier to the heaviest, "thorough only" for the heaviest alone,
 * "at every tier" for all of them, and otherwise "at quick and thorough".
 */
function tiersWords(p, ids) {
  const names = p.tiers.map(t => t.name.toLowerCase());
  const at = p.tiers.map((t, i) => (ids.includes(t.id) ? i : -1)).filter(i => i >= 0);
  const last = p.tiers.length - 1;
  if (at.length === p.tiers.length) return 'at every tier';
  if (at.length === 1 && at[0] === last && last > 0) return `${names[last]} only`;
  if (at.length > 1 && at[at.length - 1] === last && at.length === last - at[0] + 1 && at[0] > 0) return `${names[at[0]]} and above`;
  return `at ${listJoin(at.map(i => names[i]))}`;
}

const tick = n => `\`${n}\``;
/** "a", "a and b", "a, b and c". */
function listJoin(xs) {
  return xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
}
/** "Opus, high" read as "Opus at high". */
const modelWords = m => m.replace(', ', ' at ');

/** Prose wrapped at 77 columns, as the rules file is: words kept whole, single spaces. */
function wrap(text, width = 77) {
  const out = [];
  let line = '';
  for (const w of text.split(' ')) {
    if (line && line.length + 1 + w.length > width) {
      out.push(line);
      line = w;
    } else line = line ? `${line} ${w}` : w;
  }
  if (line) out.push(line);
  return out.join('\n');
}

/** A table row from its cells: an empty cell is one space between its bars. */
const row = cells => `|${cells.map(c => (c ? ` ${c} ` : ' ')).join('|')}|`;
const rule = n => row(Array.from({ length: n }, () => '---'));

// The line under the moves (#464 T4). It says what Claude does, so it is no move of mine and no entry in the moves data.
const NUDGE_LINE = '**Nudge once.** When a move seems to drop, mention it once, lightly, as an offer I can take or leave in a second. Then carry on with what I chose.';

/** The moves: each a bullet with its lead-in in bold, its text wrapped under it; then the line under them. */
function compileMoves(p) {
  return `${p.moves.map(m => [`- **${m.lead}.**`, ...wrap(m.text, 75).split('\n').map(l => `  ${l}`)].join('\n')).join('\n')}\n\n${wrap(NUDGE_LINE)}`;
}

const tierName = (p, id) => (p.tiers.find(t => t.id === id) || { name: id }).name.toLowerCase();

function compileTiers(p) {
  return [row(['Tier', 'Fits', 'Plan', 'Build']), rule(4), ...p.tiers.map(t => row([`**${t.name}**`, t.fits, t.plan, t.build]))].join('\n');
}

/** The stage that holds the offer made when the sensitive route wasn't taken, by name; Test when none does. */
function backstopStage(p) {
  const g = p.workflowGraph;
  const o = g && Array.isArray(g.offers) ? g.offers.find(x => x && x.when === 'sensitive-declined') : null;
  const st = o && Array.isArray(g.stages) ? g.stages.find(x => x && x.id === o.stage) : null;
  return st && typeof st.name === 'string' && st.name.trim() ? st.name : 'Test';
}

function compileSensitive(p) {
  const s = p.sensitive;
  const models = s.plan === s.build ? `planned and built on ${modelWords(s.plan)}` : `planned on ${modelWords(s.plan)} and built on ${modelWords(s.build)}`;
  return wrap([
    `Sensitive work gets more checking when I choose it. By default, sensitive work is ${listJoin(s.items)}: ${tierName(p, s.tier)}, ${models}, with the security pair, ${tick(SECURITY_PAIR[0])} and ${tick(SECURITY_PAIR[1])}, on the spec and the diff. That is the sensitive route.`,
    'When the work matches that list, or you think it sensitive otherwise, say why in one line in your tier proposal and recommend the route; I take it or not.',
    `If I didn't take the route, offer the security pair once more at ${backstopStage(p)} when the change matches the list. Beyond that one offer, sensitivity doesn't stop the run.`,
    "A flag or an offer I haven't answered stays open, in one line, in every hand-off and in the result.",
    'If you find it later, say so in one line at the next hand-off or result, and keep saying it until I answer.',
  ].join(' '));
}

/** The stages in the order the work takes them: along the default ways on from the first, then any not reached, in list order. */
function stagesInOrder(g) {
  const byId = new Map(g.stages.map(s => [s.id, s]));
  const defaults = g.links.filter(l => !l.when && l.on !== false && byId.has(l.from) && byId.has(l.to));
  const out = [];
  const seen = new Set();
  let cur = g.stages.find(s => !defaults.some(l => l.to === s.id)) || g.stages[0];
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    out.push(cur);
    const next = defaults.find(l => l.from === cur.id);
    cur = next && byId.get(next.to);
  }
  return out.concat(g.stages.filter(s => !seen.has(s.id)));
}

/** What a tier, or the sensitive route, sets at a stage. */
function stageCell(p, st, tierIndex) {
  if (st.model === 'owner') return 'I decide';
  if (tierIndex === null) return p.sensitive[st.model];
  if (st.skipAt.includes(p.tiers[tierIndex].id)) return 'skipped';
  const v = p.tiers[tierIndex][st.model];
  return v === 'none' ? 'in the session, no plan' : v;
}

/** When an offer or a skill comes, in words. */
function whenWords(p, o) {
  return o.when === 'words' ? o.words : o.when === 'tiers' ? tiersWords(p, o.tiers) : OFFER_WHENS[o.when];
}

/** An offer's words: its lenses and when. */
function offerText(p, o) {
  return `${o.agents.map(tick).join(', ')}: ${whenWords(p, o)}`;
}

/** A skill's words: its name, offered or used, and when. */
function skillText(p, k) {
  return `${tick(k.skill)}: ${k.mode}, ${whenWords(p, k)}`;
}

/** A link's words: back, on or ahead, by the order the work takes the stages. */
function linkText(g, l, order = stagesInOrder(g)) {
  const i = order.findIndex(s => s.id === l.from);
  const j = order.findIndex(s => s.id === l.to);
  const to = order[j];
  return `${j <= i ? 'back to' : j === i + 1 ? 'on to' : 'ahead to'} ${to ? to.name : '?'} when ${l.when}`;
}

function compileWorkflow(p) {
  const g = p.workflowGraph;
  const order = stagesInOrder(g);
  // A Skills column only when a skill is on the graph, so the pact's default table stays as it is.
  const skills = (g.skills || []).filter(k => k.on !== false && g.stages.some(st => st.id === k.stage));
  const head = row(['Stage', ...p.tiers.map(t => t.name), 'Sensitive route', 'Lenses offered, and when', ...(skills.length ? ['Skills, and when'] : []), 'Other ways out']);
  const rows = order.map(st => row([
    st.name,
    ...p.tiers.map((_, i) => stageCell(p, st, i)),
    stageCell(p, st, null),
    g.offers.filter(o => o.stage === st.id && o.on !== false).map(o => offerText(p, o)).join('; ') || 'none',
    ...(skills.length ? [skills.filter(k => k.stage === st.id).map(k => skillText(p, k)).join('; ') || 'none'] : []),
    g.links.filter(l => l.from === st.id && l.when && l.on !== false).map(l => linkText(g, l, order)).join('; '),
  ]));
  return [head, rule(p.tiers.length + 4 + (skills.length ? 1 : 0)), ...rows].join('\n');
}

function compileLenses(p) {
  return [row(['Lens', 'Asks']), rule(2), ...p.lenses.map(r => row([`${r.agents.map(tick).join(', ')}${r.label ? ` (${r.label})` : ''}`, r.asks]))].join('\n');
}

/** A quality's Enough cell (#278): its level, then each cost it answers to by name only, joined by a middle dot. */
function enoughCell(q) {
  return [q.enough, ...(Array.isArray(q.enoughCosts) ? q.enoughCosts : [])].filter(x => typeof x === 'string' && x).join(' \u00b7 ');
}

/** The qualities part (#273): the list, each quality with its measure and the lenses that check it. An Enough column joins only when a row sets one (#278). */
function compileQualities(p) {
  const enough = p.qualities.some(q => enoughCell(q));
  return [row(['Quality', 'Measure', 'Lens', ...(enough ? ['Enough'] : [])]), rule(enough ? 4 : 3), ...p.qualities.map(q => row([q.quality, q.measure, q.lenses.map(tick).join(', '), ...(enough ? [enoughCell(q)] : [])]))].join('\n');
}

/** The cost limits part (#278): the table, four columns. */
function compileCostLimits(p) {
  return [row(['Cost', 'Counted as', 'Limit', 'At the limit']), rule(4), ...p.costLimits.map(c => row([c.cost, c.counted, c.limit, c.atLimit]))].join('\n');
}

/** Each part's text: { moves, tiers, sensitive, workflow, lenses, qualities, 'cost-limits' }. */
function compileParts(p) {
  return { moves: compileMoves(p), tiers: compileTiers(p), sensitive: compileSensitive(p), workflow: compileWorkflow(p), lenses: compileLenses(p), qualities: compileQualities(p), 'cost-limits': compileCostLimits(p) };
}

// ------------------------------------------------------------ the builder's checks

const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
const AGENT_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
// A skill or a command, as the builder file's own lists name them: a command may lead with a /.
const SKILL_RE = /^\/?[A-Za-z0-9][A-Za-z0-9:._-]{0,79}$/;
const isObj = v => typeof v === 'object' && v !== null && !Array.isArray(v);
const keysIn = (o, ks) => Object.keys(o).every(k => ks.includes(k));
// One line of text that keeps a table cell whole: no line break and no bar.
const lineOk = (v, max) => typeof v === 'string' && v.length <= max && !/[\n\r|]/.test(v);

/** The pairs the roster names: rows of two lenses. */
function rosterPairs(p) {
  return (Array.isArray(p.lenses) ? p.lenses : []).filter(r => Array.isArray(r.agents) && r.agents.length === 2).map(r => ({ agents: r.agents, label: r.label || r.agents.join(' and ') }));
}

/**
 * What is wrong with the four parts' data: [{ part, level: 'error' | 'warn', text }].
 * An error is a builder refusal (the page won't save; build.mjs refuses the
 * file). A warn is a finding. Messages are fixed text, ids and lens names
 * that passed their patterns, never a field's own words.
 */
function partsProblems(p) {
  const out = [];
  const err = (part, text) => out.push({ part, level: 'error', text });
  const C = PARTS_CAPS;

  if (!Array.isArray(p.moves) || !p.moves.length || p.moves.length > C.moves) err('moves', `the moves must hold 1 to ${C.moves} moves`);
  else
    p.moves.forEach((m, i) => {
      if (!isObj(m) || !keysIn(m, ['lead', 'text'])) return err('moves', `move ${i + 1}: only lead and text`);
      if (!lineOk(m.lead, C.short) || !m.lead.trim() || /\*/.test(m.lead)) err('moves', `move ${i + 1}: the lead-in must be one line of 1 to ${C.short} characters, with no asterisk`);
      if (typeof m.text !== 'string' || !m.text.trim() || /[\r\n]/.test(m.text)) err('moves', `move ${i + 1}: the text must be one paragraph, on one line`);
    });

  const tierIds = new Set();
  if (!Array.isArray(p.tiers) || !p.tiers.length || p.tiers.length > TIERS_MAX) err('tiers', `tiers must list 1 to ${TIERS_MAX} tiers`);
  else
    p.tiers.forEach((t, i) => {
      if (!isObj(t) || !keysIn(t, ['id', 'name', 'fits', 'plan', 'build']) || typeof t.id !== 'string' || !ID_RE.test(t.id)) return err('tiers', `tier ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only name, fits, plan and build beside it`);
      if (tierIds.has(t.id)) err('tiers', `tier ${t.id}: the id is used twice`);
      tierIds.add(t.id);
      if (!lineOk(t.name, C.short) || !t.name.trim() || /\*/.test(t.name)) err('tiers', `tier ${t.id}: name must be one line of 1 to ${C.short} characters, with no bar or asterisk`);
      if (!lineOk(t.fits, C.line) || !t.fits.trim()) err('tiers', `tier ${t.id}: fits must be one line of 1 to ${C.line} characters, with no bar`);
      if (!(t.plan === 'none' || modelChoiceOk(t.plan))) err('tiers', `tier ${t.id}: plan must be none or a model and an effort`);
      if (!modelChoiceOk(t.build)) err('tiers', `tier ${t.id}: build must be a model and an effort`);
    });
  const names = (Array.isArray(p.tiers) ? p.tiers : []).filter(t => isObj(t) && typeof t.name === 'string').map(t => t.name.trim().toLowerCase());
  if (new Set(names).size !== names.length) err('tiers', 'two tiers have one name');
  // A list of tier ids: at least one, each a tier, none twice.
  const tiersOk = v => Array.isArray(v) && v.length > 0 && v.every(k => tierIds.has(k)) && new Set(v).size === v.length;

  const s = p.sensitive;
  if (!isObj(s) || !keysIn(s, ['items', 'tier', 'plan', 'build'])) err('sensitive', 'sensitive must hold only items, tier, plan and build');
  else {
    if (!Array.isArray(s.items) || !s.items.length || s.items.length > C.items || s.items.some(x => !lineOk(x, C.short) || !x.trim() || /[,:]/.test(x))) err('sensitive', `the list must hold 1 to ${C.items} items, each one line of at most ${C.short} characters, with no comma, colon or bar`);
    if (!tierIds.has(s.tier)) err('sensitive', "the route's tier must be one of the tiers");
    if (!modelChoiceOk(s.plan) || !modelChoiceOk(s.build)) err('sensitive', "the route's plan and build must each be a model and an effort");
  }

  const g = p.workflowGraph;
  if (!isObj(g) || !keysIn(g, ['stages', 'offers', 'links', 'skills', 'layout']) || (Object.hasOwn(g, 'skills') && !Array.isArray(g.skills)) || !Array.isArray(g.stages) || !Array.isArray(g.offers) || !Array.isArray(g.links)) {
    err('workflow', 'workflowGraph must hold stages, offers and links lists, and a layout');
  } else {
    const ids = new Set();
    if (!g.stages.length || g.stages.length > C.stages) err('workflow', `1 to ${C.stages} stages`);
    g.stages.forEach((st, i) => {
      if (!isObj(st) || !keysIn(st, ['id', 'name', 'text', 'model', 'skipAt']) || typeof st.id !== 'string' || !ID_RE.test(st.id)) return err('workflow', `stage ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only name, text, model and skipAt beside it`);
      if (ids.has(st.id)) err('workflow', `stage ${st.id}: the id is used twice`);
      ids.add(st.id);
      if (!lineOk(st.name, C.short) || !st.name.trim()) err('workflow', `stage ${st.id}: name must be one line of 1 to ${C.short} characters, with no bar`);
      if (!lineOk(st.text, C.line)) err('workflow', `stage ${st.id}: text must be one line of at most ${C.line} characters`);
      if (!STAGE_MODELS.includes(st.model)) err('workflow', `stage ${st.id}: model must be plan, build or owner`);
      if (!Array.isArray(st.skipAt) || st.skipAt.some(k => !tierIds.has(k)) || new Set(st.skipAt).size !== st.skipAt.length) err('workflow', `stage ${st.id}: skipAt must list tiers, each once`);
    });
    const oids = new Set();
    if (g.offers.length > C.offers) err('workflow', `at most ${C.offers} offers`);
    g.offers.forEach((o, i) => {
      if (!isObj(o) || !keysIn(o, ['id', 'stage', 'when', 'words', 'agents', 'on', 'tiers']) || typeof o.id !== 'string' || !ID_RE.test(o.id)) return err('workflow', `offer ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only stage, when, words, agents, on and tiers beside it`);
      if (oids.has(o.id) || ids.has(o.id)) err('workflow', `offer ${o.id}: the id is used twice`);
      oids.add(o.id);
      if (!ids.has(o.stage)) err('workflow', `offer ${o.id}: its stage is not in the graph`);
      if (!Object.hasOwn(OFFER_WHENS, o.when)) err('workflow', `offer ${o.id}: when must be one of ${Object.keys(OFFER_WHENS).join(', ')}`);
      if (o.when === 'words' ? !lineOk(o.words, C.line) || !String(o.words).trim() : Object.hasOwn(o, 'words') && o.words !== '') err('workflow', `offer ${o.id}: words, one line of at most ${C.line} characters, only and always with when "words"`);
      if (o.when === 'tiers' ? !tiersOk(o.tiers) : Object.hasOwn(o, 'tiers')) err('workflow', `offer ${o.id}: tiers, a list of the tiers, only and always with when "tiers"`);
      if (!Array.isArray(o.agents) || !o.agents.length || o.agents.length > C.agents || o.agents.some(a => typeof a !== 'string' || !AGENT_RE.test(a)) || new Set(o.agents).size !== o.agents.length) err('workflow', `offer ${o.id}: 1 to ${C.agents} different agents, each a name of lowercase letters, digits and hyphens`);
      if (typeof o.on !== 'boolean') err('workflow', `offer ${o.id}: on must be true or false`);
    });
    const kids = new Set();
    const skills = g.skills || [];
    if (skills.length > C.skills) err('workflow', `at most ${C.skills} skills`);
    skills.forEach((k, i) => {
      if (!isObj(k) || !keysIn(k, ['id', 'stage', 'skill', 'mode', 'when', 'words', 'on', 'tiers']) || typeof k.id !== 'string' || !ID_RE.test(k.id)) return err('workflow', `skill ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only stage, skill, mode, when, words, on and tiers beside it`);
      if (kids.has(k.id) || oids.has(k.id) || ids.has(k.id)) err('workflow', `skill ${k.id}: the id is used twice`);
      kids.add(k.id);
      if (!ids.has(k.stage)) err('workflow', `skill ${k.id}: its stage is not in the graph`);
      if (typeof k.skill !== 'string' || !SKILL_RE.test(k.skill)) err('workflow', `skill ${k.id}: the skill's name must be letters, digits, '.', '_', '-' or ':', with an optional leading /`);
      if (!SKILL_MODES.includes(k.mode)) err('workflow', `skill ${k.id}: mode must be offered or used`);
      if (!Object.hasOwn(OFFER_WHENS, k.when)) err('workflow', `skill ${k.id}: when must be one of ${Object.keys(OFFER_WHENS).join(', ')}`);
      if (k.when === 'words' ? !lineOk(k.words, C.line) || !String(k.words).trim() : Object.hasOwn(k, 'words') && k.words !== '') err('workflow', `skill ${k.id}: words, one line of at most ${C.line} characters, only and always with when "words"`);
      if (k.when === 'tiers' ? !tiersOk(k.tiers) : Object.hasOwn(k, 'tiers')) err('workflow', `skill ${k.id}: tiers, a list of the tiers, only and always with when "tiers"`);
      if (typeof k.on !== 'boolean') err('workflow', `skill ${k.id}: on must be true or false`);
    });
    if (g.links.length > C.links) err('workflow', `at most ${C.links} links`);
    g.links.forEach((l, i) => {
      if (!isObj(l) || !keysIn(l, ['from', 'to', 'when', 'on']) || !ids.has(l.from) || !ids.has(l.to) || l.from === l.to) return err('workflow', `link ${i + 1}: must join two different stages of the graph, with only from, to, when and on`);
      if (!lineOk(l.when, C.line)) err('workflow', `link ${i + 1}: when must be one line of at most ${C.line} characters`);
      if (typeof l.on !== 'boolean') err('workflow', `link ${i + 1}: on must be true or false`);
    });
    if (!isObj(g.layout) || Object.keys(g.layout).length > C.layout || Object.values(g.layout).some(v => !isObj(v) || !keysIn(v, ['x', 'y']) || ![v.x, v.y].every(n => Number.isFinite(n) && Math.abs(n) <= 100000))) err('workflow', `layout must map at most ${C.layout} node ids to { x, y } numbers`);
    // S2: the builder refuses a stage with two default ways on, and default ways on in a circle.
    if (!out.some(f => f.part === 'workflow')) {
      const defaults = g.links.filter(l => !l.when && l.on !== false);
      for (const st of g.stages) if (defaults.filter(l => l.from === st.id).length > 1) err('workflow', `stage ${st.id} has two default ways on: give all but one a condition`);
      const next = new Map(defaults.map(l => [l.from, l.to]));
      for (const st of g.stages) {
        const seen = new Set();
        let cur = st.id;
        while (cur && !seen.has(cur)) {
          seen.add(cur);
          cur = next.get(cur);
        }
        if (cur === st.id) {
          err('workflow', 'the default ways on go round in a circle: one of them needs a condition, or the work never ends');
          break;
        }
      }
    }
  }

  if (!Array.isArray(p.lenses) || !p.lenses.length || p.lenses.length > C.lenses) err('lenses', `the roster must hold 1 to ${C.lenses} rows`);
  else
    p.lenses.forEach((r, i) => {
      if (!isObj(r) || !keysIn(r, ['agents', 'label', 'asks'])) return err('lenses', `row ${i + 1}: only agents, label and asks`);
      if (!Array.isArray(r.agents) || !r.agents.length || r.agents.length > C.agents || r.agents.some(a => typeof a !== 'string' || !AGENT_RE.test(a))) err('lenses', `row ${i + 1}: 1 to ${C.agents} agents, each a name of lowercase letters, digits and hyphens`);
      if (!lineOk(r.label, C.short)) err('lenses', `row ${i + 1}: label must be one line of at most ${C.short} characters`);
      if (!lineOk(r.asks, C.line) || !r.asks.trim()) err('lenses', `row ${i + 1}: asks must be one line of 1 to ${C.line} characters, with no bar`);
    });

  // The qualities (#273): rows, each a quality, its measure (empty when none is known yet) and 1 to 4 lenses.
  if (!Array.isArray(p.qualities) || !p.qualities.length || p.qualities.length > C.qualities) err('qualities', `the list must hold 1 to ${C.qualities} qualities`);
  else {
    p.qualities.forEach((q, i) => {
      if (!isObj(q) || !keysIn(q, ['quality', 'measure', 'lenses', 'enough', 'enoughCosts'])) return err('qualities', `row ${i + 1}: only quality, measure, lenses, enough and enoughCosts (the Enough level and the costs it answers to)`);
      if (Object.hasOwn(q, 'enough') && !lineOk(q.enough, C.short)) err('qualities', `row ${i + 1}: the Enough level must be one line of at most ${C.short} characters, with no bar`);
      if (Object.hasOwn(q, 'enoughCosts') && (!Array.isArray(q.enoughCosts) || q.enoughCosts.length > C.costLimits || q.enoughCosts.some(c => !lineOk(c, C.short) || !c.trim())))
        err('qualities', `row ${i + 1}: the costs it answers to must list at most ${C.costLimits} cost names, each one line of 1 to ${C.short} characters, with no bar`);
      if (!lineOk(q.quality, C.short) || !q.quality.trim()) err('qualities', `row ${i + 1}: the quality must be one line of 1 to ${C.short} characters, with no bar`);
      if (!lineOk(q.measure, C.measure)) err('qualities', `row ${i + 1}: the measure must be one line of at most ${C.measure} characters, with no bar`);
      if (!Array.isArray(q.lenses) || !q.lenses.length || q.lenses.length > C.agents || q.lenses.some(a => typeof a !== 'string' || !AGENT_RE.test(a))) err('qualities', `row ${i + 1}: 1 to ${C.agents} lenses, each a name of lowercase letters, digits and hyphens`);
    });
    const names = p.qualities.filter(isObj).map(q => String(q.quality).toLowerCase());
    if (new Set(names).size !== names.length) err('qualities', 'the list names one quality twice');
    // A finding: an agent with no roster row.
    if (Array.isArray(p.lenses)) {
      const roster = new Set(p.lenses.flatMap(r => (isObj(r) && Array.isArray(r.agents) ? r.agents : [])));
      p.qualities.forEach((q, i) => isObj(q) && Array.isArray(q.lenses) && q.lenses.filter(a => !roster.has(a)).forEach(a => out.push({ part: 'qualities', level: 'warn', text: `row ${i + 1}: ${a} has no roster row` })));
    }
  }

  // The cost limits (#278): 1 to 9 rows of four one-line fields. Names match ignoring case and surrounding space; the limit may be empty.
  const costNames = [];
  if (!Array.isArray(p.costLimits) || !p.costLimits.length || p.costLimits.length > C.costLimits) err('cost-limits', `the list must hold 1 to ${C.costLimits} cost rows`);
  else {
    p.costLimits.forEach((c, i) => {
      if (!isObj(c) || !keysIn(c, ['cost', 'counted', 'limit', 'atLimit'])) return err('cost-limits', `row ${i + 1}: only cost, counted, limit and atLimit`);
      if (!lineOk(c.cost, C.short) || !c.cost.trim()) err('cost-limits', `row ${i + 1}: the cost must be one line of 1 to ${C.short} characters, with no bar`);
      else costNames.push(c.cost.trim().toLowerCase());
      if (!lineOk(c.counted, C.measure)) err('cost-limits', `row ${i + 1}: Counted as must be one line of at most ${C.measure} characters, with no bar`);
      if (!lineOk(c.limit, C.short)) err('cost-limits', `row ${i + 1}: the limit must be one line of at most ${C.short} characters, with no bar`);
      if (!lineOk(c.atLimit, C.line)) err('cost-limits', `row ${i + 1}: At the limit must be one line of at most ${C.line} characters, with no bar`);
    });
    if (new Set(costNames).size !== costNames.length) err('cost-limits', 'the list names one cost twice');
    // An Enough that names no cost row is an error; a cost no quality names limits the review itself (#377), no finding.
    const named = new Set();
    for (const [i, q] of (Array.isArray(p.qualities) ? p.qualities : []).entries())
      if (isObj(q) && Array.isArray(q.enoughCosts))
        for (const n of q.enoughCosts) {
          if (typeof n !== 'string') continue;
          if (costNames.includes(n.trim().toLowerCase())) named.add(n.trim().toLowerCase());
          else err('qualities', `row ${i + 1}: a cost it answers to has no row in the cost limits`);
        }
  }

  // A finding, never a refusal: one lens of a pair alone on an offer, at any stage (#377: every lens runs in a pair).
  if (!out.some(f => f.level === 'error'))
    for (const o of g.offers)
      for (const pair of rosterPairs(p)) {
        const has = pair.agents.filter(a => o.agents.includes(a)).length;
        if (has === 1) out.push({ part: 'workflow', level: 'warn', text: `offer ${o.id}: half of ${pair.agents.join(' and ')} on its own; a pair's reports are crossed, so run both or neither` });
      }
  return out;
}

/** Every text field of the parts, for the content-policy scan: [where, text]. */
function partsTexts(p) {
  const out = [];
  const add = (where, v) => {
    if (typeof v === 'string') out.push([where, v]);
  };
  (Array.isArray(p.moves) ? p.moves : []).forEach((m, i) => isObj(m) && ['lead', 'text'].forEach(k => add(`move ${i + 1}`, m[k])));
  (Array.isArray(p.tiers) ? p.tiers : []).forEach((t, i) => isObj(t) && ['id', 'name', 'fits', 'plan', 'build'].forEach(k => add(`tiers ${i + 1}`, t[k])));
  if (isObj(p.sensitive)) {
    (Array.isArray(p.sensitive.items) ? p.sensitive.items : []).forEach((x, i) => add(`sensitive item ${i + 1}`, x));
    ['tier', 'plan', 'build'].forEach(k => add('sensitive', p.sensitive[k]));
  }
  const g = isObj(p.workflowGraph) ? p.workflowGraph : {};
  (Array.isArray(g.stages) ? g.stages : []).forEach((s, i) => isObj(s) && ['id', 'name', 'text'].forEach(k => add(`stage ${i + 1}`, s[k])));
  (Array.isArray(g.offers) ? g.offers : []).forEach((o, i) => isObj(o) && ['id', 'words'].forEach(k => add(`offer ${i + 1}`, o[k])));
  (Array.isArray(g.skills) ? g.skills : []).forEach((s, i) => isObj(s) && ['id', 'skill', 'words'].forEach(k => add(`skill ${i + 1}`, s[k])));
  (Array.isArray(g.links) ? g.links : []).forEach((l, i) => isObj(l) && add(`link ${i + 1}`, l.when));
  (Array.isArray(p.lenses) ? p.lenses : []).forEach((r, i) => isObj(r) && ['label', 'asks'].forEach(k => add(`lenses row ${i + 1}`, r[k])));
  (Array.isArray(p.qualities) ? p.qualities : []).forEach((q, i) => {
    if (!isObj(q)) return;
    ['quality', 'measure', 'enough'].forEach(k => add(`qualities row ${i + 1}`, q[k]));
    (Array.isArray(q.enoughCosts) ? q.enoughCosts : []).forEach(c => add(`qualities row ${i + 1}`, c));
  });
  (Array.isArray(p.costLimits) ? p.costLimits : []).forEach((c, i) => isObj(c) && ['cost', 'counted', 'limit', 'atLimit'].forEach(k => add(`cost limits row ${i + 1}`, c[k])));
  return out;
}

// ------------------------------------------------------------ skill sources (#183 T4a)

// A configuration's skill sources: [{ repo: 'owner/name', commit: <40 hex>, paths: [dir in repo] }].
// They name each path's folder at its commit, to install as a skill named by
// the path's last segment, for the cloud setup to fetch once #183 T4b ships;
// until then nothing fetches them. The
// installer's renderer keeps its own copy of these checks (a gate file imports
// nothing from builder/), and a test holds the two equal on every bad case.
const SKILL_REPO_RE = /^[A-Za-z0-9][A-Za-z0-9-]*\/(?!\.+$)(?![A-Za-z0-9._-]*\.[Gg][Ii][Tt]$)[A-Za-z0-9._-]+$/;
const SKILL_COMMIT_RE = /^[0-9a-f]{40}$/;
const SKILL_SEGMENT_RE = /^[A-Za-z0-9._][A-Za-z0-9._-]*$/;
const SKILL_PATHS_MAX = 100;

/**
 * What is wrong with a skills list, as fixed text naming entry and path
 * positions, never a value: [] when it passes. An empty list names no source.
 */
function skillsProblems(v) {
  if (!Array.isArray(v)) return ['skills must be a list of { repo, commit, paths }'];
  const out = [];
  const repos = new Set();
  const names = new Set();
  let count = 0;
  v.forEach((e, i) => {
    const at = `skills entry ${i + 1}`;
    if (!isObj(e) || !keysIn(e, ['repo', 'commit', 'paths']) || !['repo', 'commit', 'paths'].every(k => Object.hasOwn(e, k))) {
      out.push(`${at}: holds repo, commit and paths, and nothing else`);
      return;
    }
    if (typeof e.repo !== 'string' || !SKILL_REPO_RE.test(e.repo)) out.push(`${at}: repo must be owner/name: an owner in letters, digits and '-', not starting with '-', and a name in letters, digits, '.', '_' and '-', not only dots and not ending in .git`);
    else if (repos.has(e.repo.toLowerCase())) out.push(`${at}: names a repo an earlier entry names`);
    else repos.add(e.repo.toLowerCase());
    if (typeof e.commit !== 'string' || !SKILL_COMMIT_RE.test(e.commit)) out.push(`${at}: commit must be a full commit id, 40 lowercase hex characters`);
    if (!Array.isArray(e.paths) || !e.paths.length) {
      out.push(`${at}: paths must be a list of at least one folder in the repo`);
      return;
    }
    e.paths.forEach((p, k) => {
      count += 1;
      const pat = `${at} path ${k + 1}`;
      const segs = typeof p === 'string' ? p.split('/') : [];
      if (!segs.length || segs.some(s => !SKILL_SEGMENT_RE.test(s) || s === '.' || s === '..')) {
        out.push(`${pat}: must be a relative folder path, each segment letters, digits, '.', '_' or '-', none starting with '-', and no . or .. segment`);
        return;
      }
      const last = segs[segs.length - 1];
      if (last.startsWith('.') || last.startsWith('-')) out.push(`${pat}: its last segment, the skill's name, must not start with '.' or '-'`);
      else if (names.has(last.toLowerCase())) out.push(`${pat}: its last segment, the skill's name, repeats one an earlier path ends in`);
      else names.add(last.toLowerCase());
    });
  });
  if (count > SKILL_PATHS_MAX) out.push(`skills names more than ${SKILL_PATHS_MAX} paths in all`);
  return out;
}
/* parts-code:end */

// The block rules, mirrored from gate/render-core.mjs for usability only: the
// size cap and the characters. What a block says is the owner's to judge. The
// renderer at install is the authority.
const IGNORABLE_RE = /^\p{Default_Ignorable_Code_Point}$/u;
const BLOCK_MAX = 16 * 1024;


/** A character the gate's text scanner refuses: control, line-separator or invisible. */
function refusedChar(cp) {
  if ((cp < 0x20 && cp !== 9) || (cp >= 0x7f && cp <= 0x9f)) return true;
  if (cp === 0x2028 || cp === 0x2029 || cp === 0xfffe || cp === 0xffff) return true;
  if (cp < 0xad) return false;
  return (
    (cp >= 0xe0000 && cp <= 0xe007f) ||
    (cp >= 0x202a && cp <= 0x202e) ||
    (cp >= 0x2066 && cp <= 0x2069) ||
    (cp >= 0x200b && cp <= 0x200f) ||
    cp === 0x061c ||
    cp === 0x2060 ||
    cp === 0xfeff ||
    IGNORABLE_RE.test(String.fromCodePoint(cp))
  );
}

function utf8Length(text) {
  let n = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    n += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  }
  return n;
}

/** What the page finds wrong in a block file's text, as plain sentences. */
function blockProblems(text) {
  const out = [];
  if (utf8Length(text) > BLOCK_MAX) out.push('the block is larger than 16 KiB');
  if (text.includes('\r')) out.push('a carriage return');
  const body = text.endsWith('\n') ? text.slice(0, -1) : text;
  if (body.trim() === '') return ['the block is empty'];
  if (body.endsWith('\n')) out.push('the block ends in more than one line feed');
  body.split('\n').forEach((line, i) => {
    const at = `line ${i + 1}: `;
    for (const ch of line) {
      if (refusedChar(ch.codePointAt(0))) {
        out.push(`${at}a control or invisible character`);
        break;
      }
    }
  });
  return out;
}

/** The page's state: the limits, each agent's setting, the parts Scriptorium builds and the Models list. */
function initialState() {
  // Each agent starts at its file's own model and effort.
  const agents = {};
  for (const a of PACT.agents) agents[a.name] = { model: a.model, effort: a.effort };
  // The session limit (#142) starts unset; the parts (#262) and the Models list (#262 S19) start as the builder file holds them, else the pact's defaults.
  // #262 addendum 3: own holds each agent file the person wrote or edited here, by name: a pact agent's replacement or a new agent.
  // #262 addendum 4: the builder file's agent files come back, and a pact agent's own file sets its model and effort.
  const own = { ...(PACT.ownAgentFiles || {}) };
  for (const [name, text] of Object.entries(own)) if (agents[name]) agents[name] = fileModel(text, agents[name]);
  // #203 S10: commands starts null, "leave as is": a save keeps the folder's own commands list until the person sets one here. #280: so does tools.
  // #183 T4a: skills holds the skill sources, named for the cloud setup to fetch, as the builder file gives them; a save writes them into config.json.
  return { usage: PACT.setting.def, session: null, compact: PACT.compact.def, stopDeny: PACT.stopSwitch.def, agents, own, parts: copyParts(PACT.ownParts || PACT.parts.defaults), models: [...(PACT.ownModels || MODEL_NAMES)], commands: null, tools: null, skills: JSON.parse(JSON.stringify(PACT.ownSkills || [])) };
}

/** The model and effort an agent file's frontmatter sets, each falling back to `def`'s. */
function fileModel(text, def) {
  const head = text.replace(/\r\n?/g, '\n').split('\n---\n')[0];
  const m = /^model:[ \t]*(\S+)[ \t]*$/m.exec(head);
  const e = /^effort:[ \t]*(\S+)[ \t]*$/m.exec(head);
  return { model: m ? m[1] : def.model, effort: e ? e[1] : def.effort };
}

// #262: the agents a person writes or edits here. A save writes each as a standard agent file in agents/; the pact never manages it.
const AGENT_FILE_NAME_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
const AGENT_TEMPLATE = name => `---\nname: ${name}\ndescription: What it does, and when to use it, in one line.\ntools: Read, Glob, Grep\nmodel: sonnet\neffort: medium\n---\n\nWhat this agent does, step by step.\n`;

/** Start a new agent from the template: null, or why the name is refused. */
function addAgent(state, name) {
  if (!AGENT_FILE_NAME_RE.test(name)) return 'a name of lowercase letters, digits and hyphens, starting with a letter or digit';
  if (PACT.agents.some(a => a.name === name) || Object.hasOwn(state.own, name)) return `an agent named ${name} is already here: edit its prompt instead`;
  state.own[name] = AGENT_TEMPLATE(name);
  state.agents[name] = { model: 'sonnet', effort: 'medium' };
  return null;
}

/** The value of an agent file's tools line, '' when it has none (every tool). */
function fileTools(text) {
  const close = text.indexOf('\n---\n', 4);
  const m = /^tools:[ \t]*(.*)$/m.exec(close < 0 ? '' : text.slice(0, close));
  return m ? m[1] : '';
}

/** `text` with its tools line set to `tools`, added after the description when it has none, or dropped when `tools` is empty. */
function withTools(text, tools) {
  const close = text.indexOf('\n---\n', 4);
  if (!text.startsWith('---\n') || close < 0) return text;
  const lines = text.slice(0, close).split('\n');
  const v = tools.replace(/\s+/g, ' ').trim();
  const at = lines.findIndex(l => /^tools:/.test(l));
  if (at >= 0) {
    if (v) lines[at] = `tools: ${v}`;
    else lines.splice(at, 1);
  } else if (v) {
    const d = lines.findIndex(l => /^description:/.test(l));
    lines.splice(d >= 0 ? d + 1 : lines.length, 0, `tools: ${v}`);
  }
  return `${lines.join('\n')}${text.slice(close)}`;
}

/** Put an agent's prompt back: a pact agent returns to its file, a new agent goes. */
function resetPrompt(state, name) {
  delete state.own[name];
  if (!PACT.agents.some(a => a.name === name)) delete state.agents[name];
}

/** An own agent file as it saves: its model and effort lines set from the pickers. */
function ownFile(state, name) {
  const want = state.agents[name];
  const text = state.own[name].replace(/\r\n?/g, '\n');
  const close = text.indexOf('\n---\n', 4);
  if (!want || !text.startsWith('---\n') || close < 0) return text;
  const head = text.slice(0, close).replace(/^model:.*$/m, `model: ${want.model}`).replace(/^effort:.*$/m, `effort: ${want.effort}`);
  return `${head}${text.slice(close)}`.replace(/\n*$/, '\n');
}

/** What the page finds wrong in the own agent files: [{ where, level, text }]. */
function ownProblems(state) {
  const out = [];
  for (const name of Object.keys(state.own)) {
    const text = ownFile(state, name);
    const err = t => out.push({ where: name, level: 'error', text: t });
    if (!AGENT_FILE_NAME_RE.test(name)) err('the name must be lowercase letters, digits and hyphens');
    const close = text.indexOf('\n---\n', 4);
    if (!text.startsWith('---\n') || close < 0) {
      err('the file must start with frontmatter between two --- lines');
      continue;
    }
    if (!text.slice(4, close).split('\n').includes(`name: ${name}`)) err(`the frontmatter must say name: ${name}`);
    if (utf8Length(text) > 1024 * 1024) err('the file is larger than 1 MiB');
    for (const ch of text) if (ch !== '\n' && ch !== '\t' && refusedChar(ch.codePointAt(0))) {
      err('a control or invisible character');
      break;
    }
  }
  return out;
}

/** Everything the page finds: [{ where, level: 'error' | 'warn', text }]. Errors stop a save. */
function problems(state) {
  const out = [];
  const s = PACT.setting;
  if (state.usage !== s.off && (!Number.isInteger(state.usage) || state.usage < s.min || state.usage > s.max)) {
    out.push({ where: s.name, level: 'error', text: `must be a whole number from ${s.min} to ${s.max}, or off` });
  }
  const ss = PACT.session;
  if (state.session !== null && (!Number.isInteger(state.session) || state.session < ss.min || state.session > ss.max)) {
    out.push({ where: ss.name, level: 'error', text: `must be a whole number from ${ss.min} to ${ss.max}, or unset` });
  }
  // #482: the auto-compact window, off (0) or in tokens on its step.
  const cw = PACT.compact;
  const cwOk = state.compact === cw.off || (Number.isInteger(state.compact) && state.compact >= cw.min && state.compact <= cw.max && (state.compact - cw.min) % cw.step === 0);
  if (!cwOk) out.push({ where: cw.name, level: 'error', text: `must be ${cw.off} (off), or a whole number from ${cw.min} to ${cw.max} in steps of ${cw.step}` });
  for (const t of modelsProblems(state.models)) out.push({ where: 'models', level: 'error', text: t });
  for (const t of skillsProblems(state.skills)) out.push({ where: 'skills', level: 'error', text: t });
  out.push(...ownProblems(state));
  // The parts: the builder's own checks, then each changed part's text against the block rules.
  for (const f of partsProblems(state.parts)) out.push({ where: f.part, level: f.level, text: f.text });
  if (!out.some(f => PACT.parts.marks.includes(f.where) && f.level === 'error')) {
    const compiled = compileParts(state.parts);
    for (const m of PACT.parts.marks) if (compiled[m] !== PACT.parts.text[m]) for (const p of blockProblems(`${compiled[m]}\n`)) out.push({ where: m, level: 'error', text: p });
  }
  return out;
}

/** The files a save writes: [{ path, text }], the configuration first, paths relative to the Claude folder. */
function buildFiles(state) {
  const config = { schema: 1 };
  if (state.usage !== PACT.setting.def) config.settings = { [PACT.setting.name]: state.usage };
  if (state.session !== null) config.settings = { ...config.settings, [PACT.session.name]: state.session };
  // #482: the window is written only when it differs from the default; Off writes 0.
  if (state.compact !== PACT.compact.def) config.settings = { ...config.settings, [PACT.compact.name]: state.compact };
  // #439: the stop switch is written only when it differs from its default, off.
  if (state.stopDeny !== PACT.stopSwitch.def) config.settings = { ...config.settings, [PACT.stopSwitch.name]: state.stopDeny };
  // Only the fields that differ from the agent file's own are written.
  const agents = {};
  for (const a of PACT.agents) {
    const want = state.agents && state.agents[a.name];
    // An agent with its own file sets its model and effort there.
    if (!want || Object.hasOwn(state.own, a.name)) continue;
    const set = {};
    if (want.model !== a.model) set.model = want.model;
    if (want.effort !== a.effort) set.effort = want.effort;
    if (Object.keys(set).length) agents[a.name] = set;
  }
  if (Object.keys(agents).length) config.agents = agents;
  // The opt-in commands the person set, in the installer's order; /scriptorium installs without a listing.
  if (Array.isArray(state.commands)) config.commands = OPT_COMMANDS.map(c => c.name).filter(n => state.commands.includes(n));
  // The pact tools the person set (#280), in the installer's order; off unless listed.
  if (Array.isArray(state.tools)) config.tools = OPT_TOOLS.map(c => c.name).filter(n => state.tools.includes(n));
  const edits = [];
  const blocks = [];
  // A part Scriptorium builds is saved only when its text differs from the pact's: an untouched part raises no security-defaults line.
  for (const [mark, text] of Object.entries(partsChanged(state))) {
    edits.push({ mark, op: 'replace', file: `${mark}.md` });
    blocks.push({ path: `pact/blocks/${mark}.md`, text: `${text}\n` });
  }
  if (edits.length) config.edits = edits;
  // The skill sources, as they stand (#183 T4a): named for the cloud setup to fetch; a home install lists them.
  if (state.skills.length) config.skills = JSON.parse(JSON.stringify(state.skills));
  const own = Object.keys(state.own).sort().map(name => ({ path: `agents/${name}.md`, text: ownFile(state, name) }));
  return [{ path: 'pact/config.json', text: `${JSON.stringify(config, null, 2)}\n` }, ...blocks, ...own];
}

/** The parts Scriptorium builds whose compiled text differs from the pact's: { mark: text }. */
function partsChanged(state) {
  const compiled = compileParts(state.parts);
  const out = {};
  for (const m of PACT.parts.marks) if (compiled[m] !== PACT.parts.text[m]) out[m] = compiled[m];
  return out;
}

/**
 * The builder file to save over `existing`, the text of the builder.json in
 * the folder or null (#262, D9): the file kept as it is, with the four parts'
 * keys set from the page, so a rebuilt page reloads the person's parts.
 * Returns { text }, { skip } when there is nothing to keep, or { refuse }.
 */
function builderWith(existing, state) {
  const modelsAtPact = JSON.stringify(state.models) === JSON.stringify(MODEL_NAMES);
  const hasModels = existing !== null && /"models"\s*:/.test(existing);
  const hasFiles = existing !== null && /"agentFiles"\s*:/.test(existing);
  const hasSkills = existing !== null && /"skills"\s*:/.test(existing);
  const files = Object.fromEntries(Object.keys(state.own).sort().map(name => [name, ownFile(state, name)]));
  const keys = { moves: state.parts.moves, tiers: state.parts.tiers, sensitive: state.parts.sensitive, workflowGraph: state.parts.workflowGraph, lenses: state.parts.lenses, qualities: state.parts.qualities, costLimits: state.parts.costLimits, ...(modelsAtPact && !hasModels ? {} : { models: state.models }), ...(!Object.keys(files).length && !hasFiles ? {} : { agentFiles: files }), ...(!state.skills.length && !hasSkills ? {} : { skills: state.skills }) };
  const atPact = !Object.keys(partsChanged(state)).length && modelsAtPact && !Object.keys(files).length && !state.skills.length;
  if (existing === null) return atPact ? { skip: true } : { text: `${JSON.stringify({ schema: 1, ...keys }, null, 2)}\n` };
  let doc;
  try {
    doc = JSON.parse(existing);
  } catch {
    return { refuse: 'The folder already holds a builder.json that is not valid JSON, so nothing was written. Fix or move that file, then save again.' };
  }
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { refuse: 'The folder already holds a builder.json that is not a JSON object, so nothing was written.' };
  const lower = topKeys(existing).map(k => k.toLowerCase());
  if (new Set(lower).size !== lower.length) return { refuse: 'The folder already holds a builder.json that gives a key twice, so nothing was written. Fix that file, then save again.' };
  if (atPact && !Object.keys(keys).some(k => Object.hasOwn(doc, k))) return { skip: true };
  return { text: `${JSON.stringify({ ...doc, ...keys }, null, 2)}\n` };
}

/** The top-level keys of `text`, a JSON object JSON.parse accepted, in order, repeats kept. */
function topKeys(text) {
  const keys = [];
  let depth = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      let j = i + 1;
      while (j < text.length && text[j] !== '"') j += text[j] === '\\' ? 2 : 1;
      const raw = text.slice(i, j + 1);
      i = j;
      let k = j + 1;
      while (/\s/.test(text[k] || '')) k++;
      if (depth === 1 && text[k] === ':') keys.push(JSON.parse(raw));
    } else if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') depth--;
  }
  return keys;
}

/**
 * The files a save writes over `existing`, the text of the config.json already
 * in the folder, or null when there is none (#203). Until the person sets
 * the commands on the page (S10), a commands list already there is kept as it
 * stands; without this, a save would drop it and the next install would
 * delete the commands. A tools list is kept the same way (#280). A list set
 * on the page is written as set.
 * A file that isn't JSON is never replaced. Returns { files } or { refuse }.
 */
function keepCommands(files, existing) {
  if (existing === null) return { files };
  let doc;
  try {
    doc = JSON.parse(existing);
  } catch {
    return { refuse: 'The folder already holds a config.json that is not valid JSON, so nothing was written. Fix or move that file, then save again.' };
  }
  const lists = ['commands', 'tools'];
  const built = JSON.parse(files[0].text);
  if (!doc || typeof doc !== 'object' || Array.isArray(doc) || !lists.some(k => Object.hasOwn(doc, k) && !Object.hasOwn(built, k))) return { files };
  // The installer refuses a key given twice, case folded; JSON.parse would keep the last one.
  const keys = topKeys(existing).map(k => k.toLowerCase());
  if (new Set(keys).size !== keys.length) return { refuse: 'The folder already holds a config.json that gives a key twice, which the installer refuses, so nothing was written. Fix that file, then save again.' };
  const config = JSON.parse(files[0].text);
  for (const k of lists) if (Object.hasOwn(doc, k) && !Object.hasOwn(built, k)) config[k] = doc[k];
  return { files: [{ path: 'pact/config.json', text: `${JSON.stringify(config, null, 2)}\n` }, ...files.slice(1)] };
}

/**
 * Read the config.json already in the picked folder `dir`, a directory
 * handle, and pass it through keepCommands. No file there is not a problem;
 * a file that can't be read refuses, so nothing is written.
 */
async function keepCommandsIn(dir, files) {
  let existing = null;
  try {
    existing = await (await (await (await dir.getDirectoryHandle('pact')).getFileHandle('config.json')).getFile()).text();
  } catch (e) {
    if (!e || e.name !== 'NotFoundError') return { refuse: 'The folder\'s config.json could not be read, so nothing was written.' };
  }
  return keepCommands(files, existing);
}

// Shown wherever the config.json download button is, with or without a folder picker.
const DOWNLOAD_NOTE = 'Unless you set the commands under Settings, a downloaded config.json holds no commands list: if yours has one, copy its commands entry across, or the next install deletes those commands. Unless you set the tools under Settings, a downloaded config.json holds no tools list: if yours has one, copy its tools entry across, or the next install deletes those tools.';
// The pact commands a save may list (#203, S10), in the installer's order, each with what it stands for. /scriptorium is not
// among them: every install puts it in place with the builder kit.
const OPT_COMMANDS = Object.freeze([
  { name: 'make-it-so', what: '"Accept all recommendations": the session carries out every recommendation in its last message, except a step that needs its own yes or a /scry ask already answered.' },
  { name: 'finis', what: '"We\'re done, archive this session": the session checks for anything outstanding, and archives the session if there is none.' },
  { name: 'scry', what: '"Where are we?": the session answers with numbered asks first, each with its question, facts and pick, then your own steps, what is moving and what is done; you reply by number.' },
]);
const ALWAYS_COMMAND = { name: 'scriptorium', what: 'Always installed: the builder is part of the pact.' };
// The pact tools a save may list (#280), in the installer's order, each off unless ticked, with what it does.
const OPT_TOOLS = Object.freeze([
  { name: 'poster', what: "Posts free text to GitHub as your gh account, edits what a session posted, and reads back what landed; its scan is a backstop, not a guarantee. Turning it on adds a rule to the rules file, which a dry run with --review-folder shows." },
  { name: 'cleaner', what: "Removes leftover worktrees under .claude/worktrees/ and their local branches, only those it named back and you said yes to; it never forces. Turning it on adds a rule to the rules file and deny rules on raw removal commands to settings.json." },
]);
// #262 addendum 3: a save writes agent files and never deletes one, and every file in agents/ installs.
const AGENTS_NOTE = 'An agent file a save writes is yours: an install never writes over it, and a save deletes nothing.';

/** Whether every value, part and agent setting is at its default. */
function atDefaults(state) {
  return JSON.stringify(state) === JSON.stringify(initialState());
}

// The preset the page starts from when the builder file brings no parts of its own; Reset comes back to it.
const LANDING_PRESET = 'level-3-full';

/** Where the page starts, and where Reset puts it: the plain pact with the landing preset taken, unless the builder file brings parts of its own. */
function startState() {
  const state = initialState();
  const landing = !PACT.ownParts && PACT.presets.find(p => p.id === LANDING_PRESET);
  if (landing) takePreset(state, landing, presetPicks(landing));
  return state;
}

/** Whether the page is where it started. */
function atStart(state) {
  return JSON.stringify(state) === JSON.stringify(startState());
}

/**
 * Put everything back to where the page started: the limits, every part and
 * every agent setting. Returns what was there, to put back with restoreAll.
 */
function resetAll(state) {
  const before = JSON.stringify(state);
  Object.assign(state, startState());
  return before;
}

// #262 addendum 4: presets and shared results. A preset is a builder file: the
// parts it gives, its models and its agent files. The person ticks what to take.
const PRESET_PARTS = Object.freeze({ moves: 'The moves', tiers: 'Tiers', sensitive: 'Sensitive work', workflowGraph: 'Workflow', lenses: 'Lens and agent roster', qualities: 'Qualities', costLimits: 'Cost limits' });
const PRESET_AGENT_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;

/**
 * A shared builder file's text as a preset, checked as the page can: { preset }
 * or { refuse } with why. The parts it gives must pass the builder's checks
 * with the pact's defaults for the rest; a key the page doesn't know refuses.
 */
/** Whether a decoded key or string holds a character the page refuses, or a lone surrogate; a line feed passes. */
function holdsEscapedChar(v) {
  const bad = s => [...s].some(ch => { const cp = ch.codePointAt(0); return cp !== 10 && (refusedChar(cp) || (cp >= 0xd800 && cp <= 0xdfff)); });
  if (typeof v === 'string') return bad(v);
  if (Array.isArray(v)) return v.some(holdsEscapedChar);
  if (!v || typeof v !== 'object') return false;
  return Object.keys(v).some(k => bad(k) || holdsEscapedChar(v[k]));
}

/** An opened file's name as the page shows it: fixed text when it holds a line break or a character holdsEscapedChar refuses (#327). */
function fileLabel(name) {
  return /\n/.test(name) || holdsEscapedChar(name) ? 'A shared file' : name;
}

function presetFromText(text, title = 'A shared file') {
  let doc;
  try {
    doc = JSON.parse(text);
  } catch {
    return { refuse: 'it is not valid JSON' };
  }
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { refuse: 'it is not a JSON object' };
  // #327: a JSON escape can decode to a character the file's bytes would show; checked before any of its text is shown.
  if (holdsEscapedChar(doc)) return { refuse: 'it holds an escaped invisible, direction-changing or control character in a key or string' };
  // #280: no shared file turns on code that posts as the person.
  if (Object.hasOwn(doc, 'tools')) return { refuse: 'it holds a tools list, and a builder file never turns a tool on: tick tools under Settings' };
  const known = ['schema', 'title', 'yours', ...Object.keys(PRESET_PARTS), 'models', 'agentFiles', 'skills'];
  const extra = Object.keys(doc).filter(k => !known.includes(k));
  if (extra.length) return { refuse: `it holds keys a builder file doesn't: ${extra.slice(0, 3).join(', ')}` };
  if (doc.schema !== 1) return { refuse: 'its schema is not 1' };
  const all = upgradeParts({ ...copyParts(PACT.parts.defaults), ...copyParts(Object.fromEntries(Object.keys(PRESET_PARTS).filter(k => Object.hasOwn(doc, k)).map(k => [k, doc[k]]))) });
  // A retired agent's name goes, with a note on the preset (#302).
  const droppedRetired = dropRetired(all);
  // Its tiers meet the pact's workflow when it carries no workflow of its own, as they would on the page.
  reconcileTiers(all);
  const bad = partsProblems(all).filter(f => f.level === 'error');
  if (bad.length) return { refuse: bad.slice(0, 3).map(f => `${f.part}: ${f.text}`).join('; ') };
  const preset = { id: 'file', title: typeof doc.title === 'string' && doc.title.trim() ? doc.title.trim().slice(0, 80) : title, parts: Object.fromEntries(Object.keys(PRESET_PARTS).filter(k => Object.hasOwn(doc, k)).map(k => [k, all[k]])) };
  if (droppedRetired) preset.droppedRetired = true;
  if (Object.hasOwn(doc, 'models')) {
    const m = modelsProblems(doc.models);
    if (m.length) return { refuse: `models: ${m[0]}` };
    preset.models = [...doc.models];
  }
  if (Object.hasOwn(doc, 'agentFiles')) {
    const f = doc.agentFiles;
    if (!f || typeof f !== 'object' || Array.isArray(f) || Object.keys(f).length > 32) return { refuse: 'agentFiles must map at most 32 agent names to their files' };
    for (const [i, [name, t]] of Object.entries(f).entries()) if (!PRESET_AGENT_RE.test(name) || typeof t !== 'string' || !t.trim() || t.length > 65536) return { refuse: `agentFiles entry ${i + 1} is not an agent name with a file` };
    preset.agentFiles = Object.fromEntries(Object.entries(f).filter(([name]) => !RETIRED_AGENTS.includes(name)));
    if (Object.keys(preset.agentFiles).length !== Object.keys(f).length) preset.droppedRetired = true;
    if (!Object.keys(preset.agentFiles).length) delete preset.agentFiles;
  }
  // #183 T4a: skill sources, checked as the installer's renderer checks them.
  if (Object.hasOwn(doc, 'skills')) {
    const k = skillsProblems(doc.skills);
    if (k.length) return { refuse: k[0] };
    if (doc.skills.length) preset.skills = JSON.parse(JSON.stringify(doc.skills));
  }
  if (!Object.keys(preset.parts).length && !preset.models && !preset.agentFiles && !preset.skills) return { refuse: 'it gives no part, models, agent files or skill sources' };
  return { preset };
}

/** What a preset offers to take, each ticked: ['part:<key>' | 'models' | 'agent:<name>' | 'skills']. */
function presetPicks(preset) {
  return [...Object.keys(preset.parts).map(k => `part:${k}`), ...(preset.models ? ['models'] : []), ...Object.keys(preset.agentFiles || {}).map(n => `agent:${n}`), ...(preset.skills ? ['skills'] : [])];
}

/**
 * The picks the take view starts with. Only a shipped preset's agent rows start
 * ticked: one from a shared file or a person's own folder may be a file someone
 * handed them, and an agent file can replace scout or a security lens.
 */
function startPicks(preset) {
  const shipped = PACT.presets.includes(preset);
  // #183 T4a: skill sources name third-party code for the cloud setup (from T4b), so a shared file's skill sources start unticked too.
  return presetPicks(preset).filter(k => shipped || (!k.startsWith('agent:') && k !== 'skills'));
}

/** The take view's sentence on why agent rows start unticked, or '' when they start ticked. */
function takeNote(preset) {
  if (PACT.presets.includes(preset)) return '';
  // #183 T4a: skill sources start unticked as agent files do.
  if (preset.skills) return ' This file may be one someone handed you, so its agent files and skill sources start unticked: tick each one you mean to take.';
  if (PACT.ownPresets.includes(preset)) return ` This preset came from presets/${preset.id}.json in your presets folder, which may hold a file someone handed you, so its agent files start unticked: tick each one you mean to take.`;
  return " A shared file's agent files start unticked: tick each one you mean to take.";
}

/** Take the ticked `picks` of `preset` into `state`, each replacing the person's own. Returns the agent names taken. */
function takePreset(state, preset, picks) {
  const taken = [];
  for (const pick of picks) {
    const [kind, key] = pick.split(/:(.*)/s);
    if (kind === 'part' && Object.hasOwn(preset.parts, key)) state.parts[key] = copyParts(preset.parts[key]);
    else if (kind === 'models' && preset.models) state.models = [...preset.models];
    else if (kind === 'skills' && preset.skills) state.skills = JSON.parse(JSON.stringify(preset.skills));
    else if (kind === 'agent' && preset.agentFiles && Object.hasOwn(preset.agentFiles, key)) {
      state.own[key] = preset.agentFiles[key];
      if (state.agents[key]) state.agents[key] = fileModel(preset.agentFiles[key], state.agents[key]);
      taken.push(key);
    }
  }
  reconcileTiers(state.parts);
  return taken;
}

function restoreAll(state, snap) {
  Object.assign(state, JSON.parse(snap));
}




/**
 * The pact's text laid out for reading: its hard line breaks joined back into
 * paragraphs, with list items and blank-line breaks kept. Display only; the
 * saved files keep the text exactly as written.
 */
function reflow(text) {
  return String(text)
    .split(/\n{2,}/)
    .map(para => para.split('\n').reduce((acc, line) => {
      if (!acc) return line;
      return /^\s*(?:[-*] |\d+\. )/.test(line) ? `${acc}\n${line}` : `${acc} ${line.trim()}`;
    }, ''))
    .join('\n\n');
}

// ------------------------------------------------------------ the page

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    // A title is shown as the page's help note (groundtrack's), never the browser's tooltip.
    else if (k === 'title') e.setAttribute('data-av-help', v);
    else e.setAttribute(k, v);
  }
  // The design system's form controls.
  if (tag === 'select') e.classList.add('av-select');
  else if (tag === 'textarea') e.classList.add('av-textarea');
  else if (tag === 'input' && ['text', 'number'].includes((props && props.type) || 'text')) e.classList.add('av-input');
  for (const c of kids) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}

/** Reflowed text as nodes: `code` spans and **bold** become elements, everything else stays text. */
function prose(text, cls) {
  const p = el('p', { class: cls || 'prose' });
  for (const piece of reflow(text).split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/)) {
    if (!piece) continue;
    if (piece.startsWith('`') && piece.endsWith('`') && piece.length > 2) p.append(el('code', { text: piece.slice(1, -1) }));
    else if (piece.startsWith('**') && piece.endsWith('**') && piece.length > 4) p.append(el('strong', { text: piece.slice(2, -2) }));
    else p.append(piece);
  }
  return p;
}

/**
 * A multi-select of tags: each value a chip with a ×, and a dropdown that
 * adds one of the options not yet chosen. `onChange` gets the new list.
 */
function tagPicker(label, values, options, onChange) {
  const left = options.filter(o => !values.includes(o));
  const add = el('select', { 'aria-label': `Add to ${label}` }, el('option', { value: '', text: left.length ? '+ add' : 'nothing left to add' }), ...left.map(o => el('option', { value: o, text: o })));
  add.disabled = !left.length;
  add.addEventListener('change', () => {
    if (add.value) onChange([...values, add.value]);
  });
  // The chips above, the select below, as the Tools field lays them out; the select stays when nothing is left to add (#279).
  const chips = values.map(v => el('span', { class: 'wf-chip tag' }, v, el('button', { type: 'button', 'data-av-help': 'Remove', 'aria-label': `Remove ${v} from ${label}`, onclick: () => onChange(values.filter(x => x !== v)) }, '×')));
  return el('div', { class: 'tag-field', role: 'group', 'aria-label': label }, ...(chips.length ? [el('div', { class: 'tags' }, ...chips)] : []), add);
}

/**
 * A free-form tag list: each value a tag with a remove button, and a box where
 * typing a name and pressing Enter or a comma adds it; Backspace in an empty
 * box removes the last tag.
 */
function tagInput(label, values, onChange, placeholder = '') {
  const box = el('input', { type: 'text', 'aria-label': `Add to ${label}`, placeholder });
  const take = () => {
    const add = box.value.split(',').map(v => v.trim()).filter(v => v && !values.includes(v));
    box.value = '';
    if (add.length) onChange([...values, ...add]);
  };
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      take();
    } else if (e.key === 'Backspace' && box.value === '' && values.length) onChange(values.slice(0, -1));
  });
  box.addEventListener('change', take);
  return el('div', { class: 'tags tag-input', role: 'group', 'aria-label': label }, ...values.map(v => el('span', { class: 'wf-chip tag' }, v, el('button', { type: 'button', 'data-av-help': 'Remove', 'aria-label': `Remove ${v} from ${label}`, onclick: () => onChange(values.filter(x => x !== v)) }, '×'))), box);
}

/** The tool names in a tools line's value, `A, B` or `[A, B]`. */
const toolList = v => v.replace(/^\[|\]$/g, '').split(',').map(t => t.trim()).filter(Boolean);

/** A chip button. A toggle (a mode, the scheme) says whether it is pressed; an action doesn't. */
function chip(label, on, onclick, extra, toggle) {
  const b = el('button', { type: 'button', class: `av-tool-chip${on ? ' av-tool-chip--on' : ''}${extra ? ` ${extra}` : ''}`, onclick }, label);
  if (toggle) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  return b;
}

/** Mount the editor in `host`, editing state.parts in place. `changed` runs after every edit. */
function workflowEditor(host, state, changed) {
  const G = () => state.parts.workflowGraph;
  const ui = { sel: null, tab: 'inspect', view: { x: 20, y: 10, k: 0.62 }, work: { tier: 'standard', route: false, declined: false }, loose: [], pulses: [], temp: null };

  async function saveToFolder(files) {
    let dir;
    try {
      dir = await window.showDirectoryPicker({ id: 'pact-config', mode: 'readwrite' });
    } catch (e) {
      if (e && e.name === 'AbortError') return setStatus('Save cancelled. Nothing was written.', '');
      return setStatus('The folder could not be opened. Use the download buttons instead.', 'error');
    }
    const kept = await keepCommandsIn(dir, files);
    if (kept.refuse) return setStatus(kept.refuse, 'error');
    files = kept.files;
    // The four parts' keys go into the folder's builder.json, so a rebuilt page reloads them (#262, D9).
    let existing = null;
    try {
      existing = await (await (await (await dir.getDirectoryHandle('pact')).getFileHandle('builder.json')).getFile()).text();
    } catch (e) {
      if (!e || e.name !== 'NotFoundError') return setStatus('The folder\'s builder.json could not be read, so nothing was written.', 'error');
    }
    const b = builderWith(existing, state);
    if (b.refuse) return setStatus(b.refuse, 'error');
    if (b.text) files = [...files, { path: 'pact/builder.json', text: b.text }];
    try {
      for (const f of files) {
        const segs = f.path.split('/');
        let d = dir;
        for (const s of segs.slice(0, -1)) d = await d.getDirectoryHandle(s, { create: true });
        const handle = await d.getFileHandle(segs[segs.length - 1], { create: true });
        const w = await handle.createWritable();
        await w.write(f.text);
        await w.close();
      }
    } catch {
      return setStatus('Saving failed part way. Check the folder before you install.', 'error');
    }
    const where = dir.name === 'pact' ? '' : ` The installer reads the folder named pact in your Claude folder; this one is "${dir.name}", so move the files there.`;
    setStatus(`Saved ${files.length} file${files.length === 1 ? '' : 's'}.${where} Next, run the install's dry run.`, 'ok');
  }

  function download(f) {
    const url = URL.createObjectURL(new Blob([f.text], { type: 'application/octet-stream' }));
    const a = el('a', { download: f.path.split('/').pop() });
    a.href = url;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

    ];
    // A builder file's skill sources reach config.json with no view of their own, so Export names each before Save.
    if (state.skills.length) notes.push(el('li', { class: 'av-callout av-callout--caution', text: `Check · skills · this configuration names skill sources that the cloud setup will fetch from #183 T4b on: ${state.skills.map(s => `${s.repo} at ${String(s.commit).slice(0, 7)}, ${s.paths.length} path${s.paths.length === 1 ? '' : 's'}`).join('; ')}. Save them only if you chose them.` }));
    if (status.text) notes.push(el('li', { class: `av-callout${status.level === 'error' ? ' av-callout--caution' : status.level === 'ok' ? ' av-callout--normal' : ''}`, text: status.text }));
    if (!notes.length) notes.push(el('li', { class: 'av-callout av-callout--normal', text: 'Nothing to fix here. The installer still checks everything.' }));

    const fileViews = files.map(f => {
      const into = `~/.claude/${f.path.split('/').slice(0, -1).join('/')}${f.path.includes('/') ? '/' : ''}`;
      const btn = chip(`Download ${f.path.split('/').pop()}`, false, () => download(f), 'av-tool-chip--ghost');
      if (errors.length) btn.disabled = true;
      return el('div', {}, el('div', { class: 'file-head' }, el('span', { class: 'section-title', text: f.path }), el('span', { class: 'av-annot', text: `goes in ${into}` }), btn), el('pre', { class: 'av-tool-code', text: f.text }));
    });

    $('output').replaceChildren(
      el('div', { class: 'slot-bar' }, el('h2', { class: 'section-title', text: 'Save' }), save),
      el('p', { class: 'av-annot', text: canPick
        ? `Save writes these files into the folder you pick: choose your Claude folder (~/.claude). It replaces pact/config.json, any block file of the same name, and any agent file it writes, keeping a commands list config.json already holds unless you set the commands under Settings, and a tools list the same way. ${DOWNLOAD_NOTE} ${AGENTS_NOTE} Then run the install script\'s dry run and read its Configuration block.`
        : `This browser has no folder picker, so save each file with its download button and put it where it says. ${DOWNLOAD_NOTE} ${AGENTS_NOTE} Then run the install script\'s dry run and read its Configuration block.` }),
      el('ul', { class: 'callouts' }, ...notes),
      el('div', { class: 'files' }, ...fileViews),
    );
  }

  if (PACT.title) $('builder-title').textContent = `The pact · configuration · ${PACT.title}`;
  renderActions();
  renderAgents();
  renderAlways();
  renderOutput();
  if (PACT.droppedRetired) setStatus('The saved file named an agent the pact retired, and the page took the name out of its lens offers, lens rows, qualities and agent files. Check them before you save.', '');
  // The canvas is the page; Settings and Export open from the head.
  $('export-close').replaceChildren(closeX('export'));
  editor = workflowEditor($('wf'), state, () => renderOutput());
  editor.show();
}

if (typeof document !== 'undefined') boot();
</script>
</body>
</html>
