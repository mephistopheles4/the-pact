<!doctype html>
<html lang="en" data-aviation-theme="deck">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Go3nODve3s7wkzLs1RHZz0Glx6hzAnhOFO3xYr6Dyws='; style-src 'sha256-ZyemiGANFyVjfPlaKmdrO8vjG2yqST2GbOiuwm10i9c='; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium</title>
<style>
/* Aviation design system, deck theme, tool chrome: the tokens and classes this
   page uses, carried inline because the page loads nothing. Light is the
   default; dark is opt-in through the toggle, as the system asks. The fonts
   are not carried: IBM Plex Mono is used when installed, else the platform
   monospace. */
:root {
  --av-rule-hair: 1px;
  --av-rule-thin: 1.5px;
  --av-rule-bold: 2px;
  --av-s1: 6px;
  --av-s2: 12px;
  --av-s3: 24px;
  --av-s4: 36px;
  --av-s5: 48px;
  --av-t-micro: 0.6875rem;
  --av-t-annot: 0.8125rem;
  --av-t-body: 0.9375rem;
  --av-t-lead: 1.125rem;
  --av-t-h3: 1.375rem;
  --av-track-label: 0.16em;
  --av-track-title: 0.12em;
  --av-grid-size: 24px;
  --av-grid-major-every: 5;

  --av-paper: #fafaf7;
  --av-ink: #22262b;
  --av-caution: #b45309;
  --av-normal: #15803d;
  --av-ink-80: rgb(34 38 43 / 0.8);
  --av-ink-70: rgb(34 38 43 / 0.7);
  --av-ink-55: rgb(34 38 43 / 0.55);
  --av-ink-30: rgb(34 38 43 / 0.3);
  --av-ink-12: rgb(34 38 43 / 0.12);
  --av-grid-minor: rgb(34 38 43 / 0.035);
  --av-grid-major: rgb(34 38 43 / 0.085);
  --av-surface: rgb(250 250 247 / 0.72);
  --av-ground: #efefe9;
  --av-paper-tech: #eaf0f6;
  --av-font: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media screen {
  [data-aviation-scheme="dark"] {
    --av-paper: #1a1614;
    --av-ink: #ece5df;
    --av-caution: #d98a3c;
    --av-normal: #4fae6d;
    --av-ink-80: rgb(236 229 223 / 0.80);
    --av-ink-70: rgb(236 229 223 / 0.70);
    --av-ink-55: rgb(236 229 223 / 0.55);
    --av-ink-30: rgb(236 229 223 / 0.28);
    --av-ink-12: rgb(236 229 223 / 0.11);
    --av-grid-minor: rgb(236 229 223 / 0.032);
    --av-grid-major: rgb(236 229 223 / 0.075);
    --av-surface: rgb(32 27 24 / 0.72);
    --av-ground: #100e0d;
    --av-paper-tech: #141a20;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background-color: var(--av-ground); color: var(--av-ink); }

/* PAGE: the ground, with the two-tier drafting grid. */
.av-tool {
  min-height: 100vh;
  padding: var(--av-s3);
  background-color: var(--av-ground);
  color: var(--av-ink);
  font-family: var(--av-font);
  font-size: var(--av-t-body);
  line-height: 1.6;
  display: flex;
  background-image:
    linear-gradient(to right, var(--av-grid-major) var(--av-rule-hair), transparent var(--av-rule-hair)),
    linear-gradient(to bottom, var(--av-grid-major) var(--av-rule-hair), transparent var(--av-rule-hair)),
    linear-gradient(to right, var(--av-grid-minor) var(--av-rule-hair), transparent var(--av-rule-hair)),
    linear-gradient(to bottom, var(--av-grid-minor) var(--av-rule-hair), transparent var(--av-rule-hair));
  background-size:
    calc(var(--av-grid-size) * var(--av-grid-major-every)) calc(var(--av-grid-size) * var(--av-grid-major-every)),
    calc(var(--av-grid-size) * var(--av-grid-major-every)) calc(var(--av-grid-size) * var(--av-grid-major-every)),
    var(--av-grid-size) var(--av-grid-size),
    var(--av-grid-size) var(--av-grid-size);
}
@media (max-width: 640px) { .av-tool { padding: 0; } }

/* SHEET: the bordered document, one per page. */
.av-tool-sheet { flex: 1; display: flex; flex-direction: column; min-width: 0; max-width: 1400px; margin: 0 auto; border: var(--av-rule-bold) solid var(--av-ink); background: var(--av-surface); }

/* HEAD */
.av-tool-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--av-s3); flex-wrap: wrap; padding: var(--av-s3) var(--av-s4) var(--av-s2); border-bottom: var(--av-rule-hair) solid var(--av-ink-30); }
.av-tool-head-text { display: flex; flex-direction: column; min-width: 0; }
.av-tool-title { font-size: var(--av-t-lead); font-weight: 600; line-height: 1.3; margin: 0; }
.av-tool-blurb { font-size: var(--av-t-annot); color: var(--av-ink-70); margin: 2px 0 0; max-width: 110ch; }
.av-tool-actions { display: flex; gap: var(--av-s1); align-items: center; flex-wrap: wrap; }

/* BAR: a full-width strip under the head. */
.av-tool-bar { display: flex; justify-content: space-between; align-items: center; gap: var(--av-s3); flex-wrap: wrap; padding: var(--av-s2) var(--av-s4); border-bottom: var(--av-rule-hair) solid var(--av-ink-12); }
.av-tool-bar--stack { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: var(--av-s2); }
.av-tool-stamp { font-size: var(--av-t-annot); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 600; white-space: nowrap; }
.av-tool-stamp--caution { color: var(--av-caution); }
.av-tool-stamp--normal { color: var(--av-normal); }

/* CHIP: a mode, not a tag. Ink border off, ink fill on. */
.av-tool-chip { font-family: inherit; font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 500; padding: 5px var(--av-s2); border: var(--av-rule-hair) solid var(--av-ink); color: var(--av-ink); background: transparent; cursor: pointer; white-space: nowrap; }
.av-tool-chip:hover { color: var(--av-caution); border-color: var(--av-caution); }
.av-tool-chip--on { background: var(--av-ink); color: var(--av-paper); border-color: var(--av-ink); }
.av-tool-chip--on:hover { color: var(--av-paper); border-color: var(--av-ink); }
.av-tool-chip--ghost { border-color: var(--av-ink-30); color: var(--av-ink-80); }
.av-tool-chip:disabled { border-color: var(--av-ink-12); color: var(--av-ink-30); cursor: not-allowed; }
.av-tool-chip:disabled:hover { color: var(--av-ink-30); border-color: var(--av-ink-12); }
.av-tool-chip:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: var(--av-rule-bold) solid var(--av-caution); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--av-s1); }
[hidden] { display: none !important; }

.av-tool-detail { min-width: 0; padding: var(--av-s3) var(--av-s4); }
.moves .move { padding: var(--av-s2) 0; border-bottom: var(--av-rule-hair) solid var(--av-ink-12); }
.moves .move:first-child { padding-top: 0; }
.move-area { min-height: 5em; padding: var(--av-s1) var(--av-s2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--av-t-annot); line-height: 1.65; color: var(--av-ink); background: var(--av-paper); border: var(--av-rule-thin) dashed var(--av-ink-30); cursor: text; }
.move-area:hover { border-color: var(--av-ink-55); }
.move-area:focus { outline: var(--av-rule-bold) solid var(--av-caution); outline-offset: 2px; border-style: solid; border-color: var(--av-ink); }
.move-box { display: flex; flex-direction: column; gap: var(--av-s1); }
@media (max-width: 900px) { .av-tool-head, .av-tool-bar, .av-tool-detail { padding-left: var(--av-s2); padding-right: var(--av-s2); } }
/* TYPE */
.av-label { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 500; color: var(--av-ink-70); }
.av-annot { font-size: var(--av-t-annot); line-height: 1.5; color: var(--av-ink-70); margin: 0; }
.av-h3 { font-size: var(--av-t-lead); font-weight: 600; line-height: 1.3; margin: 0; }
.av-num { font-variant-numeric: tabular-nums; }
.prose { font-size: var(--av-t-annot); line-height: 1.65; color: var(--av-ink-80); white-space: pre-line; overflow-wrap: anywhere; margin: 0; }
.prose code { white-space: nowrap; font-family: inherit; color: var(--av-ink); background: var(--av-ink-12); padding: 0 3px; }
.prose strong { color: var(--av-ink); font-weight: 600; }
.prose--struck { color: var(--av-ink-70); text-decoration: line-through; text-decoration-color: var(--av-ink-55); }

/* TITLE BLOCK: the ruled cells in the corner of a drawing sheet. */
.av-titleblock { flex: 1 1 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: var(--av-rule-bold) solid var(--av-ink); }
.av-titleblock-cell { padding: var(--av-s2) var(--av-s3); border-right: var(--av-rule-hair) solid var(--av-ink-12); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.av-titleblock-cell:last-child { border-right: 0; }
.av-titleblock-key { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink-70); }
.av-titleblock-val { font-size: var(--av-t-body); font-variant-numeric: tabular-nums; overflow-wrap: break-word; }

/* VALUES */
#values .prose { max-width: 110ch; }
.value-row { display: flex; flex-wrap: wrap; gap: var(--av-s2); align-items: center; }
input[type="range"] { flex: 1 1 220px; accent-color: var(--av-ink); }
input[type="text"], select { font: inherit; font-size: var(--av-t-annot); color: var(--av-ink); background: var(--av-paper); border: var(--av-rule-hair) solid var(--av-ink-30); padding: 3px var(--av-s1); }
input[type="text"] { min-width: 14em; flex: 1 1 14em; }
.wf-field > input, .wf-field > select, .wf-field input[type="text"] { flex: none; min-width: 0; }
.field-row { display: flex; flex-wrap: wrap; gap: var(--av-s2); align-items: center; }
.field-row label { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink-70); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: var(--av-s3) var(--av-s2); padding-top: var(--av-s1); }
.tile { position: relative; border: var(--av-rule-hair) solid var(--av-ink-30); background: var(--av-surface); padding: var(--av-s3) var(--av-s2) var(--av-s2); display: flex; flex-direction: column; gap: var(--av-s1); }
.tile--on { border: var(--av-rule-bold) solid var(--av-ink); }
.tile--locked { background: var(--av-paper-tech); border-left: var(--av-rule-bold) solid var(--av-ink); }
.tile--yours { border: var(--av-rule-thin) dashed var(--av-ink); cursor: grab; }
.tile--drag { cursor: grab; }
.tile .av-annot { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.group-title { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink-70); margin: var(--av-s2) 0 var(--av-s1); }
.runs { list-style: none; margin: 0; padding: 0; font-size: var(--av-t-annot); color: var(--av-ink-80); }
input[type="number"] { width: 5.5em; font: inherit; font-variant-numeric: tabular-nums; color: var(--av-ink); background: var(--av-paper); border: var(--av-rule-hair) solid var(--av-ink-30); padding: 3px var(--av-s1); }

/* MOVES */
.move { min-width: 0; display: flex; flex-direction: column; gap: var(--av-s2); }
#always .move { padding-top: var(--av-s3); }
.move-head { display: flex; flex-direction: column; gap: 2px; }

/* LOCKED: a pinned block, drawn as a solid-ruled sheet with its tag on the border. */
.part { position: relative; padding: var(--av-s3) var(--av-s3) var(--av-s2); }
.part-tag { position: absolute; top: 0; left: var(--av-s2); transform: translateY(-50%); background: var(--av-paper); padding: 0 var(--av-s1); font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink-70); display: flex; gap: var(--av-s1); }
.part-tag b { color: var(--av-ink); font-weight: 600; }
.part--locked { border: var(--av-rule-hair) solid var(--av-ink-30); border-left: var(--av-rule-bold) solid var(--av-ink); background: var(--av-paper-tech); }
.part--locked .part-tag { background: var(--av-paper-tech); }

/* OPEN: a slot drawn as a dashed cutaway, opened up for inspection. */
.part--open { border: var(--av-rule-thin) dashed var(--av-ink-30); display: flex; flex-direction: column; gap: var(--av-s2); }
.part--open.part--edited { border: var(--av-rule-bold) solid var(--av-ink); }
.part--open.part--over { border: var(--av-rule-bold) dashed var(--av-ink); background: var(--av-ink-12); }
.slot-bar { display: flex; flex-wrap: wrap; gap: var(--av-s2); align-items: center; justify-content: space-between; }

/* CARDS: a labelled specimen, its tab on the border. */
.card { position: relative; border: var(--av-rule-hair) solid var(--av-ink-30); background: var(--av-surface); padding: var(--av-s3) var(--av-s2) var(--av-s2); display: flex; flex-direction: column; gap: var(--av-s1); }
.card-tab { position: absolute; top: 0; left: var(--av-s2); transform: translateY(-50%); background: var(--av-paper); padding: 0 var(--av-s1); font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink); font-weight: 600; }
.card-foot { display: flex; flex-wrap: wrap; gap: var(--av-s1); align-items: center; justify-content: space-between; }
.preset { cursor: grab; }
.preset:active { cursor: grabbing; }
textarea { width: 100%; min-height: 6.5em; resize: vertical; font: inherit; font-size: var(--av-t-annot); line-height: 1.6; color: var(--av-ink); background: var(--av-paper); border: var(--av-rule-hair) solid var(--av-ink-30); padding: var(--av-s1) var(--av-s2); }

/* CALLOUT: a note on a leader line. Amber only where something needs attention. */
.callouts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--av-s1); }
.av-callout { position: relative; padding-left: var(--av-s4); font-size: var(--av-t-annot); line-height: 1.45; color: var(--av-ink-80); }
.av-callout::before { content: ''; position: absolute; left: 0; top: 0.62em; width: calc(var(--av-s4) - var(--av-s2)); height: 0; border-top: var(--av-rule-thin) solid var(--av-ink-30); }
.av-callout::after { content: ''; position: absolute; left: 0; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--av-ink); transform: translate(-2px, -2.5px); }
.av-callout--caution { color: var(--av-ink); }
.av-callout--caution::before { border-top-color: var(--av-caution); }
.av-callout--caution::after { background: var(--av-caution); }
.av-callout--normal::before { border-top-color: var(--av-normal); }
.av-callout--normal::after { background: var(--av-normal); }

/* OUTPUT: each file to save, as a value to copy. */
.files { display: flex; flex-direction: column; gap: var(--av-s3); }
.file-head { display: flex; flex-wrap: wrap; gap: var(--av-s2); align-items: baseline; }
.file-head > button { margin-left: auto; }
.av-tool-code { margin: var(--av-s1) 0 0; padding: var(--av-s2); background: var(--av-paper-tech); border: var(--av-rule-hair) solid var(--av-ink-12); border-left: var(--av-rule-bold) solid var(--av-ink-30); font-family: var(--av-font); font-size: var(--av-t-annot); line-height: 1.65; color: var(--av-ink-80); white-space: pre-wrap; overflow-wrap: anywhere; }
.section-title { font-size: var(--av-t-micro); text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 600; color: var(--av-ink); margin: 0; }
/* WORKFLOW (#262): #143's prototype v3, kept. The canvas is the drafting
   surface, paper with the grid coming through; the library, the bar, the
   table and the panel are sheets laid on it. */
.wf { --wf-shadow: 0 2px 6px rgb(34 38 43 / 0.16); display: flex; flex-direction: column; border-top: var(--av-rule-hair) solid var(--av-ink-30); }
@media screen { [data-aviation-scheme="dark"] .wf { --wf-shadow: 0 2px 6px rgb(0 0 0 / 0.45); } }
.wf-head { padding: var(--av-s2) var(--av-s4); }
.wf-bar { display: flex; align-items: center; gap: var(--av-s1); flex-wrap: wrap; padding: var(--av-s1) var(--av-s4); border-top: var(--av-rule-hair) solid var(--av-ink-12); border-bottom: var(--av-rule-hair) solid var(--av-ink-12); background: var(--av-surface); }
.wf-note { font-size: var(--av-t-micro); color: var(--av-ink-70); }
.wf-cols { display: grid; grid-template-columns: var(--side-w, 240px) 7px minmax(0, 1fr) 7px var(--panel-w, 330px); height: 78vh; min-height: 480px; }
@media (max-width: 1000px) { .wf-cols { grid-template-columns: minmax(0, 1fr); height: auto; } .wf-side { max-height: 14rem; } .wf-canvas { height: 60vh; } }
.wf-side, .wf-panel, .wf-table { background: var(--av-surface); box-shadow: var(--wf-shadow); position: relative; z-index: 2; }
.wf-side { overflow: auto; padding: var(--av-s2); border-right: var(--av-rule-hair) solid var(--av-ink-30); display: flex; flex-direction: column; gap: var(--av-s1); }
.wf-panel { overflow: auto; border-left: var(--av-rule-hair) solid var(--av-ink-30); }
.wf-centre { display: grid; grid-template-rows: minmax(0, 1fr) 7px var(--table-h, 220px); min-height: 0; min-width: 0; }

.wf-lib { font: inherit; color: inherit; display: flex; align-items: center; gap: var(--av-s1); width: 100%; text-align: left; padding: var(--av-s1); border: var(--av-rule-hair) solid var(--av-ink-30); background: var(--av-paper); cursor: grab; transition: transform .12s, border-color .12s; }
.wf-lib:hover { border-color: var(--av-ink); transform: translateX(2px); }
.wf-ic { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: var(--av-rule-hair) solid currentColor; font-size: 11px; }
.wf-ic--cond { transform: rotate(45deg) scale(.8); }
.wf-ic--cond span { transform: rotate(-45deg); }
.wf-lib b { font-size: var(--av-t-annot); font-weight: 600; display: block; }
.wf-lib small { font-size: var(--av-t-micro); color: var(--av-ink-70); display: block; }
.wf-libpair { border-left: var(--av-rule-bold) solid var(--av-ink-30); padding-left: var(--av-s1); display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.wf-libpair .wf-lib { padding: 3px var(--av-s1); }
.wf-libpair .wf-lib small { display: none; }
.wf-libpair .wf-lib:first-child small { display: block; }
.wf-practices { margin-top: var(--av-s2); padding-top: var(--av-s2); border-top: var(--av-rule-hair) dashed var(--av-ink-30); display: flex; flex-direction: column; gap: 4px; }
.wf-practice { padding: 4px 0; border-bottom: var(--av-rule-hair) solid var(--av-ink-12); font-size: var(--av-t-annot); }

.wf-canvas { position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 0;
  background-color: var(--av-paper);
  background-image:
    linear-gradient(to right, var(--av-grid-major) 1px, transparent 1px), linear-gradient(to bottom, var(--av-grid-major) 1px, transparent 1px),
    linear-gradient(to right, var(--av-grid-minor) 1px, transparent 1px), linear-gradient(to bottom, var(--av-grid-minor) 1px, transparent 1px); }
.wf-canvas.wf-panning { cursor: grabbing; }
.wf-canvas.wf-dropping { box-shadow: inset 0 0 0 var(--av-rule-bold) var(--av-caution); }
.wf-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wf-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; z-index: 1; }
.wf-zoom { position: absolute; right: var(--av-s2); top: var(--av-s2); z-index: 3; display: flex; gap: 2px; background: var(--av-paper); border: var(--av-rule-hair) solid var(--av-ink-30); }
.wf-zoom button { font: inherit; color: inherit; border: 0; background: none; padding: 4px 9px; cursor: pointer; font-size: var(--av-t-annot); }
.wf-zoom span { padding: 4px 6px; font-size: var(--av-t-micro); min-width: 44px; text-align: center; align-self: center; }
.wf-toast { position: absolute; left: 50%; bottom: var(--av-s2); z-index: 3; transform: translateX(-50%); background: var(--av-ink); color: var(--av-paper); padding: 5px 12px; font-size: var(--av-t-annot); opacity: 0; transition: opacity .25s; pointer-events: none; }
.wf-toast.on { opacity: 1; }

.wf-node { position: absolute; background: var(--av-paper); border: var(--av-rule-thin) solid var(--av-ink); cursor: move; user-select: none; animation: wf-pop .22s ease-out; transition: box-shadow .15s, opacity .2s; }
.wf-node:hover { box-shadow: 3px 3px 0 var(--av-ink-12); }
.wf-node.wf-sel { box-shadow: 0 0 0 var(--av-rule-bold) var(--av-caution); }
.wf-node.wf-dragging { box-shadow: 6px 6px 0 var(--av-ink-12); z-index: 5; }
@keyframes wf-pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.wf-stage { width: 200px; padding: var(--av-s1) var(--av-s2); border-width: var(--av-rule-bold); }
.wf-stage h3 { margin: 0; font-size: var(--av-t-body); font-weight: 600; }
.wf-stage p { margin: 0; font-size: var(--av-t-micro); color: var(--av-ink-70); }
.wf-stage.wf-skipped { opacity: .45; }

/** A deep copy of plain data. */
function copyParts(p) {
  return JSON.parse(JSON.stringify(p));
}

const tick = n => `\`${n}\``;
/** "a", "a and b", "a, b and c". */
function listJoin(xs) {
  return xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
}
/** "Opus, high" read as "Opus at high". */
const modelWords = m => m.replace(', ', ' at ');

/** Prose wrapped at 77 columns, as the rules file is: words kept whole, single spaces. */
function wrap(text, width = 77) {
  const out = [];
  let line = '';
  for (const w of text.split(' ')) {
    if (line && line.length + 1 + w.length > width) {
      out.push(line);
      line = w;
    } else line = line ? `${line} ${w}` : w;
  }
  if (line) out.push(line);
  return out.join('\n');
}

/** A table row from its cells: an empty cell is one space between its bars. */
const row = cells => `|${cells.map(c => (c ? ` ${c} ` : ' ')).join('|')}|`;
const rule = n => row(Array.from({ length: n }, () => '---'));

function compileTiers(p) {
  return [row(['Tier', 'Fits', 'Plan', 'Build']), rule(4), ...p.tiers.map(t => row([`**${t.name}**`, t.fits, t.plan, t.build]))].join('\n');
}

function compileSensitive(p) {
  const s = p.sensitive;
  const models = s.plan === s.build ? `planned and built on ${modelWords(s.plan)}` : `planned on ${modelWords(s.plan)} and built on ${modelWords(s.build)}`;
  return wrap([
    `Sensitive work gets more checking when I choose it. By default, sensitive work is ${listJoin(s.items)}: ${s.tier}, ${models}, with the security pair, ${tick(SECURITY_PAIR[0])} and ${tick(SECURITY_PAIR[1])}, on the spec and the diff. That is the sensitive route.`,
    'When the work matches that list, or you think it sensitive otherwise, say why in one line in your tier proposal and recommend the route; I take it or not.',
    "If I didn't take the route, offer the security pair once more at Test when the change matches the list. Beyond that one offer, sensitivity doesn't stop the run.",
    "A flag or an offer I haven't answered stays open, in one line, in every hand-off and in the result.",
    'If you find it later, say so in one line at the next hand-off or result, and keep saying it until I answer.',
  ].join(' '));
}

/** The stages in the order the work takes them: along the default ways on from the first, then any not reached, in list order. */
function stagesInOrder(g) {
  const byId = new Map(g.stages.map(s => [s.id, s]));
  const defaults = g.links.filter(l => !l.when && l.on !== false && byId.has(l.from) && byId.has(l.to));
  const out = [];
  const seen = new Set();
  let cur = g.stages.find(s => !defaults.some(l => l.to === s.id)) || g.stages[0];
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    out.push(cur);
    const next = defaults.find(l => l.from === cur.id);
    cur = next && byId.get(next.to);
  }
  return out.concat(g.stages.filter(s => !seen.has(s.id)));
}

/** What a tier, or the sensitive route, sets at a stage. */
function stageCell(p, st, tierIndex) {
  if (st.model === 'owner') return 'I decide';
  if (tierIndex === null) return p.sensitive[st.model];
  if (st.skipAt.includes(TIER_KEYS[tierIndex])) return 'skipped';
  const v = p.tiers[tierIndex][st.model];
  return v === 'none' ? 'in the session, no plan' : v;
}

/** An offer's words: its lenses and when. */
function offerText(o) {
  return `${o.agents.map(tick).join(', ')}: ${o.when === 'words' ? o.words : OFFER_WHENS[o.when]}`;
}

/** A skill's words: its name, offered or used, and when. */
function skillText(k) {
  return `${tick(k.skill)}: ${k.mode}, ${k.when === 'words' ? k.words : OFFER_WHENS[k.when]}`;
}

/** A link's words: back, on or ahead, by the order the work takes the stages. */
function linkText(g, l, order = stagesInOrder(g)) {
  const i = order.findIndex(s => s.id === l.from);
  const j = order.findIndex(s => s.id === l.to);
  const to = order[j];
  return `${j <= i ? 'back to' : j === i + 1 ? 'on to' : 'ahead to'} ${to ? to.name : '?'} when ${l.when}`;
}

function compileWorkflow(p) {
  const g = p.workflowGraph;
  const order = stagesInOrder(g);
  // A Skills column only when a skill is on the graph, so the pact's default table stays as it is.
  const skills = (g.skills || []).filter(k => k.on !== false && g.stages.some(st => st.id === k.stage));
  const head = row(['Stage', ...p.tiers.map(t => t.name), 'Sensitive route', 'Lenses offered, and when', ...(skills.length ? ['Skills, and when'] : []), 'Other ways out']);
  const rows = order.map(st => row([
    st.name,
    ...p.tiers.map((_, i) => stageCell(p, st, i)),
    stageCell(p, st, null),
    g.offers.filter(o => o.stage === st.id && o.on !== false).map(offerText).join('; ') || 'none',
    ...(skills.length ? [skills.filter(k => k.stage === st.id).map(skillText).join('; ') || 'none'] : []),
    g.links.filter(l => l.from === st.id && l.when && l.on !== false).map(l => linkText(g, l, order)).join('; '),
  ]));
  return [head, rule(p.tiers.length + 4 + (skills.length ? 1 : 0)), ...rows].join('\n');
}

function compileLenses(p) {
  return [row(['Lens', 'Asks']), rule(2), ...p.lenses.map(r => row([`${r.agents.map(tick).join(', ')}${r.label ? ` (${r.label})` : ''}`, r.asks]))].join('\n');
}

/** Each part's text: { tiers, sensitive, workflow, lenses }. */
function compileParts(p) {
  return { tiers: compileTiers(p), sensitive: compileSensitive(p), workflow: compileWorkflow(p), lenses: compileLenses(p) };
}

const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
const AGENT_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
// A skill or a command, as the builder file's own lists name them: a command may lead with a /.
const SKILL_RE = /^\/?[A-Za-z0-9][A-Za-z0-9:._-]{0,79}$/;
const isObj = v => typeof v === 'object' && v !== null && !Array.isArray(v);
const keysIn = (o, ks) => Object.keys(o).every(k => ks.includes(k));
// One line of text that keeps a table cell whole: no line break and no bar.
const lineOk = (v, max) => typeof v === 'string' && v.length <= max && !/[\n\r|]/.test(v);

/** The pairs the roster names: rows of two lenses. */
function rosterPairs(p) {
  return (Array.isArray(p.lenses) ? p.lenses : []).filter(r => Array.isArray(r.agents) && r.agents.length === 2).map(r => ({ agents: r.agents, label: r.label || r.agents.join(' and ') }));
}

/**
 * What is wrong with the four parts' data: [{ part, level: 'error' | 'warn', text }].

function partsProblems(p) {

  const C = PARTS_CAPS;

      if (!lineOk(t.fits, C.line) || !t.fits.trim()) err('tiers', `${TIER_NAMES[i]}: fits must be one line of 1 to ${C.line} characters, with no bar`);
      if (!(t.plan === 'none' || MODEL_CHOICES.includes(t.plan))) err('tiers', `${TIER_NAMES[i]}: plan must be none or one of the model choices`);
      if (!MODEL_CHOICES.includes(t.build)) err('tiers', `${TIER_NAMES[i]}: build must be one of the model choices`);
    });

  if (!isObj(s) || !keysIn(s, ['items', 'tier', 'plan', 'build'])) err('sensitive', 'sensitive must hold only items, tier, plan and build');

    if (!Array.isArray(s.items) || !s.items.length || s.items.length > C.items || s.items.some(x => !lineOk(x, C.short) || !x.trim() || /[,:]/.test(x))) err('sensitive', `the list must hold 1 to ${C.items} items, each one line of at most ${C.short} characters, with no comma, colon or bar`);
    if (!TIER_KEYS.includes(s.tier)) err('sensitive', `the route's tier must be one of ${TIER_KEYS.join(', ')}`);
    if (!MODEL_CHOICES.includes(s.plan) || !MODEL_CHOICES.includes(s.build)) err('sensitive', "the route's plan and build must be model choices");
  }

  const g = p.workflowGraph;
  if (!isObj(g) || !keysIn(g, ['stages', 'offers', 'links', 'skills', 'layout']) || (Object.hasOwn(g, 'skills') && !Array.isArray(g.skills)) || !Array.isArray(g.stages) || !Array.isArray(g.offers) || !Array.isArray(g.links)) {
    err('workflow', 'workflowGraph must hold stages, offers and links lists, and a layout');
  } else {
    const ids = new Set();
    if (!g.stages.length || g.stages.length > C.stages) err('workflow', `1 to ${C.stages} stages`);
    g.stages.forEach((st, i) => {
      if (!isObj(st) || !keysIn(st, ['id', 'name', 'text', 'model', 'skipAt']) || typeof st.id !== 'string' || !ID_RE.test(st.id)) return err('workflow', `stage ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only name, text, model and skipAt beside it`);
      if (ids.has(st.id)) err('workflow', `stage ${st.id}: the id is used twice`);
      ids.add(st.id);
      if (!lineOk(st.name, C.short) || !st.name.trim()) err('workflow', `stage ${st.id}: name must be one line of 1 to ${C.short} characters, with no bar`);
      if (!lineOk(st.text, C.line)) err('workflow', `stage ${st.id}: text must be one line of at most ${C.line} characters`);
      if (!STAGE_MODELS.includes(st.model)) err('workflow', `stage ${st.id}: model must be plan, build or owner`);
      if (!Array.isArray(st.skipAt) || st.skipAt.some(k => !TIER_KEYS.includes(k))) err('workflow', `stage ${st.id}: skipAt must list tier keys`);
    });
    const oids = new Set();
    if (g.offers.length > C.offers) err('workflow', `at most ${C.offers} offers`);
    g.offers.forEach((o, i) => {
      if (!isObj(o) || !keysIn(o, ['id', 'stage', 'when', 'words', 'agents', 'on']) || typeof o.id !== 'string' || !ID_RE.test(o.id)) return err('workflow', `offer ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only stage, when, words, agents and on beside it`);
      if (oids.has(o.id) || ids.has(o.id)) err('workflow', `offer ${o.id}: the id is used twice`);
      oids.add(o.id);
      if (!ids.has(o.stage)) err('workflow', `offer ${o.id}: its stage is not in the graph`);
      if (!Object.hasOwn(OFFER_WHENS, o.when)) err('workflow', `offer ${o.id}: when must be one of ${Object.keys(OFFER_WHENS).join(', ')}`);
      if (o.when === 'words' ? !lineOk(o.words, C.line) || !String(o.words).trim() : Object.hasOwn(o, 'words') && o.words !== '') err('workflow', `offer ${o.id}: words, one line of at most ${C.line} characters, only and always with when "words"`);
      if (!Array.isArray(o.agents) || !o.agents.length || o.agents.length > C.agents || o.agents.some(a => typeof a !== 'string' || !AGENT_RE.test(a)) || new Set(o.agents).size !== o.agents.length) err('workflow', `offer ${o.id}: 1 to ${C.agents} different agents, each a name of lowercase letters, digits and hyphens`);
      if (typeof o.on !== 'boolean') err('workflow', `offer ${o.id}: on must be true or false`);
    });
    const kids = new Set();
    const skills = g.skills || [];
    if (skills.length > C.skills) err('workflow', `at most ${C.skills} skills`);
    skills.forEach((k, i) => {
      if (!isObj(k) || !keysIn(k, ['id', 'stage', 'skill', 'mode', 'when', 'words', 'on']) || typeof k.id !== 'string' || !ID_RE.test(k.id)) return err('workflow', `skill ${i + 1}: needs an id of lowercase letters, digits and hyphens, and only stage, skill, mode, when, words and on beside it`);
      if (kids.has(k.id) || oids.has(k.id) || ids.has(k.id)) err('workflow', `skill ${k.id}: the id is used twice`);
      kids.add(k.id);
      if (!ids.has(k.stage)) err('workflow', `skill ${k.id}: its stage is not in the graph`);
      if (typeof k.skill !== 'string' || !SKILL_RE.test(k.skill)) err('workflow', `skill ${k.id}: the skill's name must be letters, digits, '.', '_', '-' or ':', with an optional leading /`);
      if (!SKILL_MODES.includes(k.mode)) err('workflow', `skill ${k.id}: mode must be offered or used`);
      if (!Object.hasOwn(OFFER_WHENS, k.when)) err('workflow', `skill ${k.id}: when must be one of ${Object.keys(OFFER_WHENS).join(', ')}`);
      if (k.when === 'words' ? !lineOk(k.words, C.line) || !String(k.words).trim() : Object.hasOwn(k, 'words') && k.words !== '') err('workflow', `skill ${k.id}: words, one line of at most ${C.line} characters, only and always with when "words"`);
      if (typeof k.on !== 'boolean') err('workflow', `skill ${k.id}: on must be true or false`);
    });
    if (g.links.length > C.links) err('workflow', `at most ${C.links} links`);
    g.links.forEach((l, i) => {
      if (!isObj(l) || !keysIn(l, ['from', 'to', 'when', 'on']) || !ids.has(l.from) || !ids.has(l.to) || l.from === l.to) return err('workflow', `link ${i + 1}: must join two different stages of the graph, with only from, to, when and on`);
      if (!lineOk(l.when, C.line)) err('workflow', `link ${i + 1}: when must be one line of at most ${C.line} characters`);
      if (typeof l.on !== 'boolean') err('workflow', `link ${i + 1}: on must be true or false`);
    });
    if (!isObj(g.layout) || Object.keys(g.layout).length > C.layout || Object.values(g.layout).some(v => !isObj(v) || !keysIn(v, ['x', 'y']) || ![v.x, v.y].every(n => Number.isFinite(n) && Math.abs(n) <= 100000))) err('workflow', `layout must map at most ${C.layout} node ids to { x, y } numbers`);
    // S2: the builder refuses a stage with two default ways on, and default ways on in a circle.
    if (!out.some(f => f.part === 'workflow')) {
      const defaults = g.links.filter(l => !l.when && l.on !== false);
      for (const st of g.stages) if (defaults.filter(l => l.from === st.id).length > 1) err('workflow', `stage ${st.id} has two default ways on: give all but one a condition`);

        const seen = new Set();
        let cur = st.id;

          seen.add(cur);
          cur = next.get(cur);

  if (!Array.isArray(p.lenses) || !p.lenses.length || p.lenses.length > C.lenses) err('lenses', `the roster must hold 1 to ${C.lenses} rows`);
  else
    p.lenses.forEach((r, i) => {
      if (!isObj(r) || !keysIn(r, ['agents', 'label', 'asks'])) return err('lenses', `row ${i + 1}: only agents, label and asks`);
      if (!Array.isArray(r.agents) || !r.agents.length || r.agents.length > C.agents || r.agents.some(a => typeof a !== 'string' || !AGENT_RE.test(a))) err('lenses', `row ${i + 1}: 1 to ${C.agents} agents, each a name of lowercase letters, digits and hyphens`);
      if (!lineOk(r.label, C.short)) err('lenses', `row ${i + 1}: label must be one line of at most ${C.short} characters`);
      if (!lineOk(r.asks, C.line) || !r.asks.trim()) err('lenses', `row ${i + 1}: asks must be one line of 1 to ${C.line} characters, with no bar`);
    });

  if (!out.some(f => f.level === 'error'))

      for (const pair of rosterPairs(p)) {
        const has = pair.agents.filter(a => o.agents.includes(a)).length;
        if (has === 1) out.push({ part: 'workflow', level: 'warn', text: `offer ${o.id}: half of ${pair.label} on its own; a pair's reports are crossed, so run both or neither` });
      }

}

/** Every text field of the parts, for the content-policy scan: [where, text]. */
function partsTexts(p) {
  const out = [];
  const add = (where, v) => {
    if (typeof v === 'string') out.push([where, v]);
  };
  (Array.isArray(p.tiers) ? p.tiers : []).forEach((t, i) => isObj(t) && ['name', 'fits', 'plan', 'build'].forEach(k => add(`tiers ${i + 1}`, t[k])));
  if (isObj(p.sensitive)) {
    (Array.isArray(p.sensitive.items) ? p.sensitive.items : []).forEach((x, i) => add(`sensitive item ${i + 1}`, x));
    ['tier', 'plan', 'build'].forEach(k => add('sensitive', p.sensitive[k]));
  }
  const g = isObj(p.workflowGraph) ? p.workflowGraph : {};
  (Array.isArray(g.stages) ? g.stages : []).forEach((s, i) => isObj(s) && ['id', 'name', 'text'].forEach(k => add(`stage ${i + 1}`, s[k])));
  (Array.isArray(g.offers) ? g.offers : []).forEach((o, i) => isObj(o) && ['id', 'words'].forEach(k => add(`offer ${i + 1}`, o[k])));
  (Array.isArray(g.skills) ? g.skills : []).forEach((s, i) => isObj(s) && ['id', 'skill', 'words'].forEach(k => add(`skill ${i + 1}`, s[k])));
  (Array.isArray(g.links) ? g.links : []).forEach((l, i) => isObj(l) && add(`link ${i + 1}`, l.when));
  (Array.isArray(p.lenses) ? p.lenses : []).forEach((r, i) => isObj(r) && ['label', 'asks'].forEach(k => add(`lenses row ${i + 1}`, r[k])));

}
/* parts-code:end */

// The open parts that are slots for cards: every editable part but the four Scriptorium builds (#262).
const SLOT_MARKS = PACT.editable.filter(m => !PACT.parts.marks.includes(m));

// The block-text rules, mirrored from gate/render-core.mjs for usability only.
// The renderer at install is the authority; a block that passes here can
// still be refused there.
const IMPORT_RE = /@[^ \n]/;
const FENCE_RE = /^\s*(?:`{3,}|~{3,})/;
const HEADING_RE = /^\s*#{1,6}(?:\s|$)/;
const SETEXT_RE = /^ {0,3}(?:=+|-+)\s*$/;
const THEMATIC_RE = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const NUMBERED_RE = /^[0-9]{1,9}[.)](?:[ \t]|$)/;
const IGNORABLE_RE = /^\p{Default_Ignorable_Code_Point}$/u;
const BLOCK_MAX = 16 * 1024;
// Split, so the page's script never holds a comment opener.
const COMMENT_OPEN = '<' + '!--';


/** A character the gate's text scanner refuses: control, line-separator or invisible. */
function refusedChar(cp) {
  if ((cp < 0x20 && cp !== 9) || (cp >= 0x7f && cp <= 0x9f)) return true;
  if (cp === 0x2028 || cp === 0x2029 || cp === 0xfffe || cp === 0xffff) return true;
  if (cp < 0xad) return false;
  return (
    (cp >= 0xe0000 && cp <= 0xe007f) ||
    (cp >= 0x202a && cp <= 0x202e) ||
    (cp >= 0x2066 && cp <= 0x2069) ||
    (cp >= 0x200b && cp <= 0x200f) ||
    cp === 0x061c ||
    cp === 0x2060 ||
    cp === 0xfeff ||
    IGNORABLE_RE.test(String.fromCodePoint(cp))
  );
}

function utf8Length(text) {
  let n = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    n += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  }
  return n;
}

/** Card text with Windows line endings made plain and trailing line breaks dropped. */
function normalize(text) {
  return String(text).replace(/\r\n?/g, '\n').replace(/\n+$/, '');
}

/** What the page finds wrong in a block file's text, as plain sentences. */
function blockProblems(text) {
  const out = [];
  if (utf8Length(text) > BLOCK_MAX) out.push('the block is larger than 16 KiB');
  if (text.includes('\r')) out.push('a carriage return');
  const body = text.endsWith('\n') ? text.slice(0, -1) : text;
  if (body.trim() === '') return ['the block is empty'];
  body.split('\n').forEach((line, i) => {
    const at = `line ${i + 1}: `;
    for (const ch of line) {
      if (refusedChar(ch.codePointAt(0))) {
        out.push(`${at}a control or invisible character`);
        break;
      }
    }
    if (line.includes(COMMENT_OPEN)) out.push(`${at}an HTML comment opener (${COMMENT_OPEN})`);
    if (IMPORT_RE.test(line)) out.push(`${at}an @ followed by text, which Claude Code may read as an import`);
    if (line.trim() === '') out.push(`${at}a blank line`);
    else if (/^[ \t]/.test(line)) out.push(`${at}a leading space or tab`);
    else if (FENCE_RE.test(line)) out.push(`${at}a code fence`);
    else if (HEADING_RE.test(line)) out.push(`${at}a heading`);
    else if (SETEXT_RE.test(line)) out.push(`${at}a heading underline`);
    else if (THEMATIC_RE.test(line)) out.push(`${at}a thematic break`);
    else if (NUMBERED_RE.test(line)) out.push(`${at}a numbered list line`);
  });
  return out;
}

const presetById = id => PACT.presets.find(p => p.id === id);
const openPart = mark => PACT.moves.flatMap(m => m.parts).find(p => p.kind === 'open' && p.mark === mark);
// The mark a security-set lens carries off its default: the renderer's words.
const OVERRIDE_MARK = 'override, not security-tested';

// What a "Your agent" card can hand its agent.
const READS = ['the diff', 'the spec', 'the ticket'];
const AGENT_NAME_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
const agentCardText = c => `Then run \`${c.name}\`, an agent from your own agents folder, on ${c.reads}, and post its report on the issue.`;
// Cards from the person's own Claude folder: a skill to use, or a command to hand back.
const SKILL_NAME_RE = /^[A-Za-z0-9][A-Za-z0-9:._-]{0,79}$/;
const skillCardText = c => `Use the \`${c.name}\` skill${c.when ? ` when ${c.when}` : ''}.`;
const commandCardText = c => `At this step, hand me the trigger: type \`/${c.name}\`.`;
const cardText = card =>
  card.kind === 'preset' ? presetById(card.id).text
    : card.kind === 'agent' ? agentCardText(card)
    : card.kind === 'skill' ? skillCardText(card)
    : card.kind === 'command' ? commandCardText(card)
    : card.text;

/** What the page finds wrong in a skill or command card. */
function skillProblems(c) {
  if (!SKILL_NAME_RE.test(c.name)) return [`the ${c.kind} name must be letters, digits, '.', '_', '-' or ':'`];
  if (c.kind === 'skill' && /[\r\n]/.test(c.when || '')) return ['the "when" text must be one line'];
  return [];
}

/** What the page finds wrong in a "Your agent" card. */
function agentProblems(c) {
  if (!AGENT_NAME_RE.test(c.name)) return ['the agent name must be lowercase letters, digits and hyphens, like my-reviewer'];
  if (PACT.agents.some(a => a.name === c.name)) return [`${c.name} is one of the pact's own agents; it already runs where the pact names it`];
  if (!READS.includes(c.reads)) return ['the agent needs something to read: the diff, the spec or the ticket'];
  return [];
}

/**
 * Each slot holds two things: whether its default text is replaced, and the
 * cards added to it. Cards always come after whatever stays; the edit the
 * renderer sees follows from the pair (see slotOp).
 */
function initialState() {
  const slots = {};
  for (const mark of SLOT_MARKS) slots[mark] = { replaced: false, cards: [] };
  // Each configurable agent starts at its file's own model and effort.
  const agents = {};
  for (const a of PACT.agents) if (a.configurable) agents[a.name] = { model: a.model, effort: a.effort };
  // The session limit (#142) starts unset; the four parts (#262) start as the builder file holds them, else the pact's defaults.
  return { usage: PACT.setting.def, session: null, slots, agents, parts: copyParts(PACT.ownParts || PACT.parts.defaults) };
}

/**
 * The renderer's operation for a slot: keep (no edit), add-after (cards after
 * the default), replace (cards instead of the default) or remove (the default
 * replaced with nothing).
 */
function slotOp(slot) {
  if (slot.replaced) return slot.cards.length ? 'replace' : 'remove';
  return slot.cards.length ? 'add-after' : 'keep';
}

/** A slot's block file text: its cards joined, ending in one line feed. */
function slotText(slot) {
  return `${slot.cards.map(c => normalize(cardText(c))).join('\n')}\n`;
}

/** Everything the page finds: [{ where, level: 'error' | 'warn', text }]. Errors stop a save. */
function problems(state) {
  const out = [];
  const s = PACT.setting;
  if (!Number.isInteger(state.usage) || state.usage < s.min || state.usage > s.max) {
    out.push({ where: s.name, level: 'error', text: `must be a whole number from ${s.min} to ${s.max}` });
  }
  const ss = PACT.session;
  if (state.session !== null && (!Number.isInteger(state.session) || state.session < ss.min || state.session > ss.max)) {
    out.push({ where: ss.name, level: 'error', text: `must be a whole number from ${ss.min} to ${ss.max}, or unset` });
  }
  // The four parts: the builder's own checks, then each changed part's text against the block rules.
  for (const f of partsProblems(state.parts)) out.push({ where: f.part, level: f.level, text: f.text });
  if (!out.some(f => PACT.parts.marks.includes(f.where) && f.level === 'error')) {
    const compiled = compileParts(state.parts);
    for (const m of PACT.parts.marks) if (compiled[m] !== PACT.parts.text[m]) for (const p of blockProblems(`${compiled[m]}\n`)) out.push({ where: m, level: 'error', text: p });
  }
  for (const mark of SLOT_MARKS) {
    const slot = state.slots[mark];
    const op = slotOp(slot);
    if (op === 'keep') continue;
    if (op !== 'remove') {
      slot.cards.forEach((c, i) => {
        if (c.kind === 'agent') for (const t of agentProblems(c)) out.push({ where: mark, level: 'error', text: `card ${i + 1}: ${t}` });
        else if (c.kind === 'skill' || c.kind === 'command') for (const t of skillProblems(c)) out.push({ where: mark, level: 'error', text: `card ${i + 1}: ${t}` });
        else if (normalize(cardText(c)).trim() === '') out.push({ where: mark, level: 'error', text: `card ${i + 1} is empty` });
      });
      for (const p of blockProblems(slotText(slot))) out.push({ where: mark, level: 'error', text: p });
    }
    if (op === 'replace' || op === 'remove') {
      const named = op === 'remove' ? [] : slotText(slot).match(/`[^`\n]+`/g) || [];
      const lost = openPart(mark).agents.filter(a => !named.includes(`\`${a}\``));
      if (lost.length) {

          where: mark,
          level: 'warn',
          text: `the default text names ${lost.map(a => `\`${a}\``).join(', ')}, and this edit drops ${lost.length === 1 ? 'it' : 'them'}. The install refuses a pact that leaves an installed agent unnamed where it is routed.`,

/** The files a save writes: [{ path, text }], the configuration first, paths relative to the pact folder. */
function buildFiles(state) {
  const config = { schema: 1 };
  if (state.usage !== PACT.setting.def) config.settings = { [PACT.setting.name]: state.usage };
  if (state.session !== null) config.settings = { ...config.settings, [PACT.session.name]: state.session };
  // Only the fields that differ from the agent file's own are written.
  const agents = {};
  for (const a of PACT.agents) {
    const want = a.configurable && state.agents && state.agents[a.name];
    if (!want) continue;
    const set = {};
    if (want.model !== a.model) set.model = want.model;
    if (want.effort !== a.effort) set.effort = want.effort;
    if (Object.keys(set).length) agents[a.name] = set;
  }
  if (Object.keys(agents).length) config.agents = agents;
  const edits = [];
  const blocks = [];
  for (const mark of SLOT_MARKS) {
    const slot = state.slots[mark];
    const op = slotOp(slot);
    if (op === 'keep') continue;
    if (op === 'remove') {
      edits.push({ mark, op });
      continue;
    }
    const file = `${mark}.md`;
    edits.push({ mark, op, file });
    blocks.push({ path: `blocks/${file}`, text: slotText(slot) });
  }
  // A part Scriptorium builds is saved only when its text differs from the pact's: an untouched part raises no security-defaults line.
  for (const [mark, text] of Object.entries(partsChanged(state))) {
    edits.push({ mark, op: 'replace', file: `${mark}.md` });
    blocks.push({ path: `blocks/${mark}.md`, text: `${text}\n` });
  }
  if (edits.length) config.edits = edits;
  return [{ path: 'config.json', text: `${JSON.stringify(config, null, 2)}\n` }, ...blocks];

/** The parts Scriptorium builds whose compiled text differs from the pact's: { mark: text }. */
function partsChanged(state) {
  const compiled = compileParts(state.parts);
  const out = {};
  for (const m of PACT.parts.marks) if (compiled[m] !== PACT.parts.text[m]) out[m] = compiled[m];
  return out;
}

/**
 * The builder file to save over `existing`, the text of the builder.json in

function builderWith(existing, state) {
  const keys = { tiers: state.parts.tiers, sensitive: state.parts.sensitive, workflowGraph: state.parts.workflowGraph, lenses: state.parts.lenses };

  if (existing === null) return atPact ? { skip: true } : { text: `${JSON.stringify({ schema: 1, ...keys }, null, 2)}\n` };

    doc = JSON.parse(existing);
  } catch {
    return { refuse: 'The folder already holds a builder.json that is not valid JSON, so nothing was written. Fix or move that file, then save again.' };

  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { refuse: 'The folder already holds a builder.json that is not a JSON object, so nothing was written.' };

/** The top-level keys of `text`, a JSON object JSON.parse accepted, in order, repeats kept. */

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      let j = i + 1;
      while (j < text.length && text[j] !== '"') j += text[j] === '\\' ? 2 : 1;
      const raw = text.slice(i, j + 1);
      i = j;
      let k = j + 1;
      while (/\s/.test(text[k] || '')) k++;
      if (depth === 1 && text[k] === ':') keys.push(JSON.parse(raw));
    } else if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') depth--;
  }
  return keys;
}

/**
 * The files a save writes over `existing`, the text of the config.json already
 * in the folder, or null when there is none (#203). The page sets no pact
 * commands, so a commands list already there is kept as it stands; without
 * this, a save would drop it and the next install would delete the commands.
 * A file that isn't JSON is never replaced. Returns { files } or { refuse }.
 */
function keepCommands(files, existing) {
  if (existing === null) return { files };
  let doc;
  try {
    doc = JSON.parse(existing);
  } catch {
    return { refuse: 'The folder already holds a config.json that is not valid JSON, so nothing was written. Fix or move that file, then save again.' };
  }
  if (!doc || typeof doc !== 'object' || Array.isArray(doc) || !Object.hasOwn(doc, 'commands')) return { files };
  // The installer refuses a key given twice, case folded; JSON.parse would keep the last one.
  const keys = topKeys(existing).map(k => k.toLowerCase());
  if (new Set(keys).size !== keys.length) return { refuse: 'The folder already holds a config.json that gives a key twice, which the installer refuses, so nothing was written. Fix that file, then save again.' };
  const config = JSON.parse(files[0].text);
  config.commands = doc.commands;
  return { files: [{ path: 'config.json', text: `${JSON.stringify(config, null, 2)}\n` }, ...files.slice(1)] };
}

/**
 * Read the config.json already in the picked folder `dir`, a directory
 * handle, and pass it through keepCommands. No file there is not a problem;
 * a file that can't be read refuses, so nothing is written.
 */
async function keepCommandsIn(dir, files) {
  let existing = null;
  try {
    existing = await (await (await dir.getFileHandle('config.json')).getFile()).text();
  } catch (e) {
    if (!e || e.name !== 'NotFoundError') return { refuse: 'The folder\'s config.json could not be read, so nothing was written.' };
  }
  return keepCommands(files, existing);
}

// Shown wherever the config.json download button is, with or without a folder picker.
const DOWNLOAD_NOTE = 'A downloaded config.json holds no commands list: if yours has one, copy its commands entry across, or the next install deletes those commands.';

/** Add a preset after its slot's text. Returns a message when it doesn't belong there. */
function addPreset(state, mark, id) {
  const p = presetById(id);
  if (!p) return 'That card is not in the library.';
  if (p.mark !== mark) return `"${p.title}" belongs in the ${p.mark} slot.`;
  state.slots[mark].cards.push({ kind: 'preset', id });
  return null;
}

/**
 * Apply a workflow: every slot back to its default, then the workflow's
 * presets added. A preset written to stand in for its slot's text turns that
 * slot's Replace on, as the workflow's author meant. The usage value and the
 * agent settings are kept.
 */
function applyWorkflow(state, id) {
  const w = PACT.workflows.find(x => x.id === id);
  if (!w) return 'That workflow is not on this page.';
  for (const mark of SLOT_MARKS) state.slots[mark] = { replaced: false, cards: [] };
  for (const pid of w.presets) {
    const p = presetById(pid);
    addPreset(state, p.mark, pid);
    if (p.standsIn) state.slots[p.mark].replaced = true;
  }
  return null;
}

/** The slots as they are now, to put back with restoreSlots. */
function snapshotSlots(state) {
  return JSON.stringify(state.slots);
}

function restoreSlots(state, snap) {
  state.slots = JSON.parse(snap);
}

/** Whether every value, slot and agent setting is at its default. */
function atDefaults(state) {
  return JSON.stringify(state) === JSON.stringify(initialState());
}

/**
 * Put everything back to the plain pact: the usage value, every slot and every
 * agent setting. Returns what was there, to put back with restoreAll.
 */
function resetAll(state) {
  const before = JSON.stringify(state);
  Object.assign(state, initialState());
  return before;
}

function restoreAll(state, snap) {
  Object.assign(state, JSON.parse(snap));
}

/** The security-set lenses set off their file's model or effort: each one is an override, not security-tested. */
function overrides(state) {
  return PACT.agents.filter(a => a.configurable && a.security && state.agents[a.name] && (state.agents[a.name].model !== a.model || state.agents[a.name].effort !== a.effort)).map(a => a.name);
}



/**
 * The pact's text laid out for reading: its hard line breaks joined back into
 * paragraphs, with list items and blank-line breaks kept. Display only; the
 * saved files keep the text exactly as written.
 */
function reflow(text) {
  return String(text)
    .split(/\n{2,}/)
    .map(para => para.split('\n').reduce((acc, line) => {
      if (!acc) return line;
      return /^\s*(?:[-*] |\d+\. )/.test(line) ? `${acc}\n${line}` : `${acc} ${line.trim()}`;
    }, ''))
    .join('\n\n');
}

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}

/** Reflowed text as nodes: `code` spans and **bold** become elements, everything else stays text. */
function prose(text, cls) {
  const p = el('p', { class: cls || 'prose' });
  for (const piece of reflow(text).split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/)) {
    if (!piece) continue;
    if (piece.startsWith('`') && piece.endsWith('`') && piece.length > 2) p.append(el('code', { text: piece.slice(1, -1) }));
    else if (piece.startsWith('**') && piece.endsWith('**') && piece.length > 4) p.append(el('strong', { text: piece.slice(2, -2) }));
    else p.append(piece);
  }
  return p;
}

/** A chip button. A toggle (a mode, the scheme) says whether it is pressed; an action doesn't. */
function chip(label, on, onclick, extra, toggle) {
  const b = el('button', { type: 'button', class: `av-tool-chip${on ? ' av-tool-chip--on' : ''}${extra ? ` ${extra}` : ''}`, onclick }, label);
  if (toggle) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  return b;
}

    const section = (key, title, node) => {

      d.open = openSections.has(key);
      d.addEventListener('toggle', () => (d.open ? openSections.add(key) : openSections.delete(key)));
      return d;
    };
    $('settings').replaceChildren(el(
      'div',
      { class: 'av-tool-sheet' },
      el('div', { class: 'av-tool-bar classic-head' }, el('div', { class: 'av-tool-head-text' }, el('h2', { class: 'av-tool-title', text: 'Settings' }), el('p', { class: 'av-tool-blurb', text: 'Your usage limits, your moves, setups and agents, and the parts the canvas builds: tiers, sensitive work, the lens roster, and what they compile to.' })), closeX('settings')),
      el(
        'section',
        { class: 'av-tool-bar av-tool-bar--stack' },
        el('h3', { class: 'section-title', text: 'Usage limits' }),
        limit('5-hour session limit', state.session, ss.min, ss.max, 80, v => (state.session = v), v => (state.session = v)),
        el('p', { class: 'av-annot', text: `Off by default: no session line. On, Claude also gives the session figure before anything expensive and waits above this line; a session that can't see the figure says so and carries on under the weekly rule. Allowed ${ss.min} to ${ss.max}.` }),
        limit('Weekly limit', state.usage, s.min, s.max, s.def, v => (state.usage = v)),
        el('p', { class: 'av-annot', text: `Before anything expensive, Claude gives the weekly figure; above this line, it waits for your go-ahead. Default ${s.def}%, allowed ${s.min} to ${s.max}.` }),
      ),
      el('section', { class: 'av-tool-bar av-tool-bar--stack' }, el('div', { class: 'accs' }, section('moves', 'Moves', spineBox), section('setups', 'Setups', setupsBox), section('agents', 'Agents', agentsBox), box)),
    ));
  }
  function openSettings() {
    openSections.clear();
    if (editor) editor.collapse();
    renderSettings();
    showDialog('settings');
  }
  /** Open a dialog; a click on its backdrop, outside the sheet, closes it. */
  function showDialog(id) {
    const d = $(id);
    if (!d.dataset.outside) {
      d.dataset.outside = 'yes';
      d.addEventListener('click', e => {
        if (e.target === d) d.close();
      });
    }
    if (typeof d.showModal === 'function') d.showModal();
    else d.setAttribute('open', '');
  }
  /** The × in a dialog's top right corner. */
  function closeX(id) {
    return el('button', { type: 'button', class: 'close-x', 'aria-label': 'Close', title: 'Close', onclick: () => $(id).close() }, '×');
  }

  // Reset all, as eagle-eye has it: one button. Right after a reset it holds the state before, and offers
  // it back as an amber Undo while the pointer rests on it; the pointer leaving starts a ten-second fuse,
  // and the label waits a moment before it turns back, so a slip of the mouse costs nothing.
  const UNDO_GRACE_MS = 10000;
  const HOT_SETTLE_MS = 260;
  let resetHot = false;
  let hotFuse = null;
  let undoFuse = null;
  const resetBtn = el('button', { type: 'button', class: 'av-tool-chip av-tool-chip--ghost reset-btn' }, 'Reset');
  function paintReset() {
    const offering = resetBefore !== null && resetHot;
    resetBtn.textContent = offering ? 'Undo' : 'Reset';
    resetBtn.classList.toggle('armed', offering);
    resetBtn.title = offering ? 'Put back what you had before the reset' : resetBefore !== null ? 'Reset. Hover to take the last reset back' : 'The limits, the moves, the agents and the canvas back to the plain pact';
    resetBtn.disabled = resetBefore === null && atDefaults(state);
  }
  function disarmUndo() {
    clearTimeout(undoFuse);
    undoFuse = null;
    resetBefore = null;
    paintReset();
  }
  function resetHover(on) {
    clearTimeout(hotFuse);
    hotFuse = null;
    if (on) {
      resetHot = true;
      clearTimeout(undoFuse);
      undoFuse = null;
      return paintReset();
    }
    hotFuse = setTimeout(() => {
      resetHot = false;
      paintReset();
    }, HOT_SETTLE_MS);
    if (resetBefore !== null) {
      clearTimeout(undoFuse);
      undoFuse = setTimeout(disarmUndo, UNDO_GRACE_MS);
    }
  }
  resetBtn.addEventListener('mouseenter', () => resetHover(true));
  resetBtn.addEventListener('focus', () => resetHover(true));
  resetBtn.addEventListener('mouseleave', () => resetHover(false));
  resetBtn.addEventListener('blur', () => resetHover(false));
  resetBtn.addEventListener('click', () => {
    if (resetBefore !== null && resetHot) {
      const before = resetBefore;
      disarmUndo();
      restoreAll(state, before);
      return renderAll();
    }
    const before = resetAll(state);
    applied = null;
    renderAll();
    resetBefore = before;
    paintReset();
  });
  function renderReset() {
    const slot = $('reset');
    if (slot && resetBtn.parentNode !== slot) slot.replaceChildren(resetBtn);
    paintReset();
  }

  function renderSummary() {
    const found = problems(state);
    const edits = SLOT_MARKS.filter(m => slotOp(state.slots[m]) !== 'keep').length + Object.keys(partsChanged(state)).length;
    const errors = found.filter(f => f.level === 'error').length;
    const warns = found.length - errors;
    const stateText = errors ? `${errors} to fix` : warns ? `${warns} to check` : 'Ready';
    const stamp = el('span', { class: `av-tool-stamp ${found.length ? 'av-tool-stamp--caution' : 'av-tool-stamp--normal'}`, text: stateText });
    const cell = (k, v) => el('div', { class: 'av-titleblock-cell' }, el('span', { class: 'av-titleblock-key', text: k }), v instanceof Node ? v : el('span', { class: 'av-titleblock-val', text: v }));
    $('summary').replaceChildren(
      el(
        'div',
        { class: 'av-titleblock', role: 'group', 'aria-label': 'Configuration summary' },
        cell('Usage pause', Number.isInteger(state.usage) ? `${state.usage}%` : '—'),
        cell('Parts edited', `${edits} of ${PACT.editable.length}`),
        cell('Files to save', String(buildFiles(state).length)),
        cell('State', stamp),
      ),
    );
  }



  let applied = null; // { id, before }: the last workflow applied, and the slots before it, for undo

  function renderWorkflows() {
    const tiles = PACT.workflows.map(w => {
      const on = applied && applied.id === w.id;
      const names = w.presets.map(id => `${presetById(id).title} (${presetById(id).mark})`);
      return el(
        'div',
        { class: `tile${on ? ' tile--on' : ''}` },
        el('span', { class: 'card-tab', text: w.title }),
        el('p', { class: 'av-annot', text: w.about }),
        el('p', { class: 'av-label', text: names.length ? names.join(' · ') : 'No presets' }),
        el('div', { class: 'card-foot' }, chip(on ? 'Applied' : 'Apply', on, () => {
          const before = snapshotSlots(state);
          applyWorkflow(state, w.id);
          applied = { id: w.id, before };
          renderWorkflows();
          renderSpine();
        })),
      );
    });
    const undo = applied ? chip('Undo', false, () => {
      restoreSlots(state, applied.before);
      applied = null;
      renderWorkflows();
      renderSpine();
    }, 'av-tool-chip--ghost') : null;
    setupsBox.replaceChildren(
      el('div', { class: 'slot-bar' }, el('h2', { class: 'section-title', text: 'Setups' }), el('div', { class: 'chips' }, el('span', { class: 'av-annot', text: 'A setup is a named set of presets: one click sets every move\'s slots. Tweak each move on its own step after. The workflow itself has its own step.' }), undo)),
      el('div', { class: 'tiles' }, ...tiles),
    );
  }

  function renderAgents() {
    const where = r => (r.move ? `${PACT.moves.find(m => m.n === r.move).lead} · ${r.mark}` : `Always on · ${r.mark}`);
    // #262 S8: each agent's offers in the workflow and its row in the roster, counted from the parts as they stand on this page.
    const inParts = a => {
      const offers = state.parts.workflowGraph.offers.filter(o => o.agents.includes(a.name));
      const stages = [...new Set(offers.map(o => (state.parts.workflowGraph.stages.find(s => s.id === o.stage) || { name: '?' }).name))];
      const row = state.parts.lenses.some(r => r.agents.includes(a.name));
      return [...(offers.length ? [`Workflow · ${offers.length} offer${offers.length === 1 ? '' : 's'}, at ${stages.join(', ')}`] : []), ...(row ? ['Lenses · a row in the roster'] : [])];
    };
    const runs = a => {
      const lines = [...a.runs.filter(r => r.kind !== 'part').map(where), ...inParts(a)];
      return el('ul', { class: 'runs' }, ...(lines.length ? lines.map(t => el('li', { text: t })) : [el('li', { text: 'Not named in the moves or the workflow' })]));
    };
    const pick = (label, list, value, set) => {
      const s = el('select', { 'aria-label': label }, ...list.map(v => el('option', { value: v, text: v })));
      s.value = value;
      s.addEventListener('change', () => {
        set(s.value);
        renderAgents();
        renderOutput();
      });
      return s;
    };
    const tiles = PACT.agents.map(a => {
      if (!a.configurable) {
        return el(
          'div',
          { class: 'tile tile--locked' },
          el('span', { class: 'card-tab', text: a.name }),
          el('span', { class: 'av-label', text: `${a.model || '?'} · ${a.effort || '?'} effort · locked` }),
          ...(a.locked ? [el('p', { class: 'av-annot', text: `Not configurable: ${a.locked}.` })] : []),
          runs(a),
        );
      }
      const now = state.agents[a.name];
      const changed = now.model !== a.model || now.effort !== a.effort;
      return el(
        'div',
        { class: `tile${changed ? ' tile--on' : ''}` },
        el('span', { class: 'card-tab', text: a.name }),
        el('div', { class: 'field-row' }, el('label', { text: 'Model' }), pick(`${a.name} model`, PACT.agentChoices.models, now.model, v => (now.model = v)), el('label', { text: 'Effort' }), pick(`${a.name} effort`, PACT.agentChoices.efforts, now.effort, v => (now.effort = v))),
        el('span', { class: 'av-label', text: changed ? `set by you · default ${a.model}, ${a.effort}` : `default · ${a.security ? 'security-set' : 'not a security lens'}` }),
        ...(changed && a.security ? [el('p', { class: 'av-callout av-callout--caution', text: `${OVERRIDE_MARK}. The pact reviews only its default.${a.egress ? ' On a weaker setting it may follow instructions planted in the code it reviews, or send a secret out through a command, a browser address or a search query.' : ''}` })] : []),
        runs(a),
      );
    });
    agentsBox.replaceChildren(
      el('p', { class: 'av-annot', text: 'Each lens takes your model and effort, and starts at its file\'s own, its default. A security-set lens set off its default is an override, not security-tested. An agent of your own goes in a move\'s slot, under Moves.' }),
      el('div', { class: 'tiles' }, ...tiles),
    );
  }







  function lockedPart(p) {
    return el(
      'div',
      { class: 'part part--locked' },
      el('span', { class: 'part-tag' }, el('b', { text: 'Locked' }), el('span', { text: p.mark })),
      prose(p.text),
    );
  }



  /**
   * A move as one text box: its text as the configuration would install it,
   * the pact's own by default. Edited, it saves as a replace edit; emptied, a
   * remove; back to the default, no edit at all.
   */
  function moveBox(p) {
    const slot = state.slots[p.mark];
    const op = slotOp(slot);
    const now = op === 'keep' ? p.text : op === 'remove' ? '' : op === 'replace' ? slotText(slot).slice(0, -1) : `${p.text}\n${slotText(slot).slice(0, -1)}`;
    const area = el('div', { class: 'move-area', contenteditable: 'plaintext-only', role: 'textbox', 'aria-multiline': 'true', 'aria-label': `The text of ${p.mark}`, spellcheck: 'true' });
    area.textContent = now;
    const tag = el('span', { class: 'av-label' });
    const reset = chip('Back to the default', false, () => {
      state.slots[p.mark] = { replaced: false, cards: [] };
      renderSpine();
    }, 'av-tool-chip--ghost');
    const show = () => {
      const op2 = slotOp(state.slots[p.mark]);
      tag.textContent = op2 === 'keep' ? 'The default' : op2 === 'remove' ? 'Removed: this move has no text' : 'Edited';
      reset.disabled = op2 === 'keep';
    };
    area.addEventListener('input', () => {
      const v = normalize(area.innerText ?? area.textContent).replace(/\n+$/, '');
      state.slots[p.mark] = v === p.text ? { replaced: false, cards: [] } : v.trim() === '' ? { replaced: true, cards: [] } : { replaced: true, cards: [{ kind: 'custom', text: v }] };
      show();
      renderOutput();
    });
    show();
    return el('div', { class: 'move-box', 'data-mark': p.mark }, area, el('div', { class: 'slot-bar' }, tag, reset));
  }

  /** Redraw the spine. A structural change clears the last status message unless the caller just set it. */
  function renderSpine(clearStatus = true) {
    if (clearStatus) status = { text: '', level: '' };
    const moves = PACT.moves.map(m =>
      el(
        'article',
        { class: 'move', id: `move-${m.n}` },
        el('div', { class: 'move-head' }, el('span', { class: 'av-label', text: String(m.n).padStart(2, '0') }), el('h3', { class: 'av-h3', text: m.lead })),
        ...m.parts.map(p => (p.kind === 'gated' ? lockedPart(p) : moveBox(p))),
      ),
    );
    spineBox.replaceChildren(...moves);
    renderOutput();
  }

  function renderAlways() {
    $('always').replaceChildren(
      el(
        'article',
        { class: 'move' },
        el('div', { class: 'move-head' }, el('span', { class: 'av-label', text: 'Always on' }), el('h2', { class: 'av-h3', text: 'Pinned blocks outside the four moves' })),
        ...PACT.always.map(lockedPart),
      ),
    );
  }

  async function saveToFolder(files) {
    let dir;
    try {
      dir = await window.showDirectoryPicker({ id: 'pact-config', mode: 'readwrite' });
    } catch (e) {
      if (e && e.name === 'AbortError') return setStatus('Save cancelled. Nothing was written.', '');
      return setStatus('The folder could not be opened. Use the download buttons instead.', 'error');
    }
    const kept = await keepCommandsIn(dir, files);
    if (kept.refuse) return setStatus(kept.refuse, 'error');
    files = kept.files;
    // The four parts' keys go into the folder's builder.json, so a rebuilt page reloads them (#262, D9).
    let existing = null;
    try {
      existing = await (await (await dir.getFileHandle('builder.json')).getFile()).text();
    } catch (e) {
      if (!e || e.name !== 'NotFoundError') return setStatus('The folder\'s builder.json could not be read, so nothing was written.', 'error');
    }
    const b = builderWith(existing, state);
    if (b.refuse) return setStatus(b.refuse, 'error');
    if (b.text) files = [...files, { path: 'builder.json', text: b.text }];
    try {
      for (const f of files) {
        const segs = f.path.split('/');
        let d = dir;
        for (const s of segs.slice(0, -1)) d = await d.getDirectoryHandle(s, { create: true });
        const handle = await d.getFileHandle(segs[segs.length - 1], { create: true });
        const w = await handle.createWritable();
        await w.write(f.text);
        await w.close();
      }
    } catch {
      return setStatus('Saving failed part way. Check the folder before you install.', 'error');
    }
    const where = dir.name === 'pact' ? '' : ` The installer reads the folder named pact in your Claude folder; this one is "${dir.name}", so move the files there.`;
    setStatus(`Saved ${files.length} file${files.length === 1 ? '' : 's'}.${where} Next, run the install's dry run.`, 'ok');
  }

  function download(f) {
    const url = URL.createObjectURL(new Blob([f.text], { type: 'application/octet-stream' }));
    const a = el('a', { download: f.path.split('/').pop() });
    a.href = url;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function renderOutput() {
    renderSummary();
    renderReset();
    const found = problems(state);
    const errors = found.filter(f => f.level === 'error');
    const files = buildFiles(state);
    const canPick = typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
    const save = chip('Save to a folder', !errors.length && canPick, () => saveToFolder(files));
    if (errors.length || !canPick) save.disabled = true;

    const notes = [
      ...overrides(state).map(n => el('li', { class: 'av-callout av-callout--caution', text: `Agents · ${n} · ${OVERRIDE_MARK}: the pact reviews only its default.` })),
      ...found.map(f => el('li', { class: 'av-callout av-callout--caution', text: `${f.level === 'error' ? 'Fix' : 'Check'} · ${f.where} · ${f.text}` })),
    ];
    if (status.text) notes.push(el('li', { class: `av-callout${status.level === 'error' ? ' av-callout--caution' : status.level === 'ok' ? ' av-callout--normal' : ''}`, text: status.text }));
    if (!notes.length) notes.push(el('li', { class: 'av-callout av-callout--normal', text: 'Nothing to fix here. The installer still checks everything.' }));

    const fileViews = files.map(f => {
      const into = f.path.startsWith('blocks/') ? '~/.claude/pact/blocks/' : '~/.claude/pact/';
      const btn = chip(`Download ${f.path.split('/').pop()}`, false, () => download(f), 'av-tool-chip--ghost');
      if (errors.length) btn.disabled = true;
      return el('div', {}, el('div', { class: 'file-head' }, el('span', { class: 'section-title', text: f.path }), el('span', { class: 'av-annot', text: `goes in ${into}` }), btn), el('pre', { class: 'av-tool-code', text: f.text }));
    });

    $('output').replaceChildren(
      el('div', { class: 'slot-bar' }, el('h2', { class: 'section-title', text: 'Save' }), save),
      el('p', { class: 'av-annot', text: canPick
        ? `Save writes these files into the folder you pick: choose the pact folder in your Claude folder (~/.claude/pact). It replaces config.json and any block file of the same name there, keeping a commands list config.json already holds. ${DOWNLOAD_NOTE} Then run the install script\'s dry run and read its Configuration block.`
        : `This browser has no folder picker, so save each file with its download button and put it where it says. ${DOWNLOAD_NOTE} Then run the install script\'s dry run and read its Configuration block.` }),
      el('ul', { class: 'callouts' }, ...notes),
      el('div', { class: 'files' }, ...fileViews),
    );
  }

  if (PACT.title) $('builder-title').textContent = `The pact · configuration · ${PACT.title}`;
  renderActions();
  renderWorkflows();
  renderAgents();
  renderAlways();
  renderSpine();
  // The canvas is the page; Settings and Export open from the head.
  $('export-close').replaceChildren(closeX('export'));
  editor = workflowEditor($('wf'), state, () => renderOutput());
  editor.show();
}

if (typeof document !== 'undefined') boot();
</script>
